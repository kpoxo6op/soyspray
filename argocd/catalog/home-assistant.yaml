# apps/home-assistant/manifests/homeassistant-application.yaml
# ArgoCD Application to manage Home Assistant
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
  labels:
    soyspray.vip/owner: household
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/data-claims: home-automation/home-assistant-config
    soyspray.vip/data: Home Assistant configuration and private runtime registries,
      including pipelines, devices, entities, areas, and exposure settings
    soyspray.vip/backup: 'Longhorn durable-small: daily, 30 retained; three replicas'
    soyspray.vip/backup-cause: Restore the complete configuration claim and privately
      verify Home Assistant runtime registries before accepting recovery.
spec:
  project: legacy-workloads
  source:
    repoURL: "https://github.com/kpoxo6op/soyspray.git"
    targetRevision: main
    path: apps/home-assistant/manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: home-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
