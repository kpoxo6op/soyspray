apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: legacy-workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: redis
      targetRevision: "22.0.7"
      helm:
        valueFiles:
          - $values/apps/redis/manifests/values.yaml
    - repoURL: "https://github.com/kpoxo6op/soyspray.git"
      targetRevision: main
      path: .
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
