apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obsidian-offsite-backup
  namespace: argocd
  labels:
    soyspray.vip/owner: household
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: legacy-workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: obsidian
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: playbooks/argocd/applications/backups/obsidian-offsite-backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
