# playbooks/argocd/applications/home-automation/zigbee2mqtt/zigbee2mqtt-application.yaml
# ArgoCD Application to manage Zigbee2MQTT
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zigbee2mqtt
  namespace: argocd
  labels:
    soyspray.vip/owner: household
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: legacy-workloads
  source:
    repoURL: "https://github.com/kpoxo6op/soyspray.git"
    targetRevision: main
    path: playbooks/argocd/applications/home-automation/zigbee2mqtt
  destination:
    server: "https://kubernetes.default.svc"
    namespace: home-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
