apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soyspray
  namespace: argocd
  labels:
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: soyspray
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: HEAD
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
