site_name: Soyspray
site_description: Human guide to the Soyspray home system
site_url: https://kpoxo6op.github.io/soyspray/
repo_url: https://github.com/kpoxo6op/soyspray
repo_name: kpoxo6op/soyspray
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/home-automation
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start here: README.md
  - Services: services.md
  - Everyday operations: operations.md
  - Recovery: recovery.md
  - Architecture: architecture.md
  - Ask an agent: ask-an-agent.md

strict: true
