---
- name: Bootstrap the boys runtime secret
  ansible.builtin.include_role:
    name: app-secret
  vars:
    secret_name: boys-runtime
    secret_namespace: boys
    create_namespace: true
    secret_data:
      - key: pin
        env_var: BOYS_PIN
      - key: session-key
        env_var: BOYS_SESSION_KEY

- name: Read the boys runtime secret version
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: boys-runtime
    namespace: boys
    kubeconfig: "{{ kubeconfig_path }}"
  register: boys_runtime_secret
  no_log: true

- name: Bootstrap the boys Cloudflare Tunnel token
  ansible.builtin.include_role:
    name: app-secret
  vars:
    secret_name: boys-cloudflared-token
    secret_namespace: boys
    secret_data:
      - key: token
        env_var: BOYS_CLOUDFLARED_TOKEN

- name: Apply the boys Argo project
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/boys/boys-project.yaml')
         | from_yaml }}

- name: Apply the boys Argo application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/boys/boys-application.yaml')
         | replace(
             'BOYS_RUNTIME_SECRET_RESOURCE_VERSION',
             boys_runtime_secret.resources[0].metadata.resourceVersion | string
           )
         | from_yaml
         | combine(
             {'spec': {'source': {'targetRevision': (boys_target_revision | string)}}},
             recursive=true
           ) }}
