---
- name: Bootstrap the Boys access identities
  ansible.builtin.import_tasks: "{{ role_path }}/../../../apps/boys/bootstrap-tasks.yml"
  vars:
    boys_bootstrap_root: "{{ role_path }}/../../.."

- name: Read the boys runtime secret version
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: boys-runtime
    namespace: boys
    kubeconfig: "{{ kubeconfig_path }}"
  register: boys_runtime_secret
  no_log: true

- name: Apply the boys Argo project
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/boys/boys-project.yaml')
         | from_yaml }}

- name: Apply the boys Argo application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/boys/boys-application.yaml')
         | replace(
             'BOYS_RUNTIME_SECRET_RESOURCE_VERSION',
             boys_runtime_secret.resources[0].metadata.resourceVersion | string
           )
         | from_yaml
         | combine(
             {'spec': {'source': {'targetRevision': (boys_target_revision | string)}}},
             recursive=true
           ) }}
