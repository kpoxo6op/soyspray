---
- name: Read the CNPG Application source
  ansible.builtin.set_fact:
    cnpg_operator_application: "{{ lookup('file', playbook_dir + '/argocd/applications/database/cnpg/cnpg-operator-application.yaml') | from_yaml }}"
  tags: cnpg-operator

- name: Apply CNPG Operator
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: argocd
    definition: "{{ cnpg_operator_application | combine({'spec': {'sources': [cnpg_operator_application.spec.sources[0], cnpg_operator_application.spec.sources[1] | combine({'targetRevision': cnpg_operator_revision | default('HEAD')})]}}, recursive=True) }}"
  tags: cnpg-operator

- name: Read the CNPG operation before an explicit sync
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: cnpg-operator
    namespace: argocd
    kubeconfig: "{{ kubeconfig_path }}"
  register: cnpg_operator_live
  when: cnpg_operator_sync | default(false) | bool
  tags: cnpg-operator

- name: Require an idle CNPG Application
  ansible.builtin.assert:
    that:
      - cnpg_operator_live.resources | length == 1
      - cnpg_operator_live.resources[0].operation | default(none) == none
  when: cnpg_operator_sync | default(false) | bool
  tags: cnpg-operator

- name: Request a CNPG sync without pruning
  kubernetes.core.k8s_json_patch:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: cnpg-operator
    namespace: argocd
    kubeconfig: "{{ kubeconfig_path }}"
    patch:
      - op: test
        path: /metadata/resourceVersion
        value: "{{ cnpg_operator_live.resources[0].metadata.resourceVersion }}"
      - op: add
        path: /operation
        value:
          initiatedBy:
            username: ansible
          sync:
            prune: false
            revisions:
              - "0.26.0"
              - "{{ cnpg_operator_revision | default('HEAD') }}"
            syncOptions:
              - ServerSideApply=true
              - DisableClientSideApplyMigration=true
  when: cnpg_operator_sync | default(false) | bool
  tags: cnpg-operator
