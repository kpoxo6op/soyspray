---
- name: Find the live Home Assistant voice Argo application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: voice-assistant
    namespace: argocd
    kubeconfig: "{{ kubeconfig_path }}"
  register: voice_assistant_live_application

- name: Remove automated sync from the Home Assistant voice application
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: voice-assistant
    namespace: argocd
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      operation: null
      spec:
        syncPolicy:
          automated: null
  when: voice_assistant_live_application.resources | length == 1

- name: Remove the Home Assistant voice Argo application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: voice-assistant
    namespace: argocd
    wait: true
    wait_timeout: 300
    kubeconfig: "{{ kubeconfig_path }}"

- name: Remove the Home Assistant voice token
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: voice-assistant-ha-token
    namespace: home-automation
    kubeconfig: "{{ kubeconfig_path }}"
