---
- name: Apply the Vaultwarden Argo project
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/security/vaultwarden/vaultwarden-project.yaml')
         | from_yaml }}

- name: Apply the Vaultwarden Argo application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/security/vaultwarden/vaultwarden-application.yaml')
         | from_yaml
         | combine(
             {'spec': {'source': {'targetRevision': (vaultwarden_target_revision | string)}}},
             recursive=true
           ) }}

- name: Wait for the Vaultwarden namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: vaultwarden
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 120

- name: Read the existing Vaultwarden agent login secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: vaultwarden-agent-login
    namespace: vaultwarden
    kubeconfig: "{{ kubeconfig_path }}"
  register: vaultwarden_agent_login_secret
  no_log: true

- name: Resolve the existing Vaultwarden agent email
  ansible.builtin.set_fact:
    vaultwarden_existing_agent_email: >-
      {{ (existing['email'] | b64decode) if 'email' in existing else '' }}
  vars:
    existing: >-
      {{ vaultwarden_agent_login_secret.resources[0].data
         if vaultwarden_agent_login_secret.resources | length > 0 else {} }}
  no_log: true

- name: Resolve the stable Vaultwarden agent password
  ansible.builtin.set_fact:
    vaultwarden_agent_master_password: >-
      {{ vaultwarden_agent_master_password_override
         if vaultwarden_agent_master_password_override | length > 0
         else ((existing['master-password'] | b64decode)
               if ('master-password' in existing
                   and vaultwarden_existing_agent_email == vaultwarden_agent_email)
               else lookup('ansible.builtin.password', '/dev/null',
                           length=48, chars=['ascii_letters', 'digits'])) }}
  vars:
    existing: >-
      {{ vaultwarden_agent_login_secret.resources[0].data
         if vaultwarden_agent_login_secret.resources | length > 0 else {} }}
  no_log: true

- name: Create the stable Vaultwarden agent login secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vaultwarden-agent-login
        namespace: vaultwarden
        labels:
          app.kubernetes.io/name: vaultwarden
          soyspray.vip/credential-source: runtime-generated-not-committed
      type: Opaque
      stringData:
        email: "{{ vaultwarden_agent_email }}"
        master-password: "{{ vaultwarden_agent_master_password }}"
  no_log: true

- name: Remove the legacy shared Vaultwarden bootstrap secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: vaultwarden-agent-bootstrap
    namespace: vaultwarden
    kubeconfig: "{{ kubeconfig_path }}"
  no_log: true
