---
- name: Bootstrap the autism traits Cloudflare Tunnel token
  ansible.builtin.include_role:
    name: app-secret
  vars:
    secret_name: autism-traits-cloudflared-token
    secret_namespace: autism-traits
    create_namespace: true
    secret_data:
      - key: token
        env_var: AUTISM_TRAITS_CLOUDFLARED_TOKEN

- name: Apply the autism traits Argo project
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/autism-traits/autism-traits-project.yaml')
         | from_yaml }}

- name: Apply the autism traits Argo application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: >-
      {{ lookup('file', playbook_dir + '/argocd/applications/web/autism-traits/autism-traits-application.yaml')
         | from_yaml
         | combine(
             {'spec': {'source': {'targetRevision': (autism_traits_target_revision | string)}}},
             recursive=true
           ) }}
