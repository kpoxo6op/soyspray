apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-health
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: voice-health
  template:
    metadata:
      labels:
        app: voice-health
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnostics
          image: ghcr.io/kpoxo6op/voice-health@sha256:71d4e2a27e555743316787c50cf72cbd8f255cb7d06571efd0239620b9536c2e
          env:
            - name: VOICE_PE_HOST
              value: 192.168.20.165
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: voice-health
  labels:
    app.kubernetes.io/name: voice-health
spec:
  type: ClusterIP
  selector:
    app: voice-health
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-health
spec:
  podSelector:
    matchLabels:
      app: voice-health
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.20.165/32
      ports:
        - protocol: TCP
          port: 6053
