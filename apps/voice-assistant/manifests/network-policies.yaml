---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-model-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: voice-model-bootstrap
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.25.10/32
    - ports:
        - port: 443
          protocol: TCP
