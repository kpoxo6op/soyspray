apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speech-to-phrase
spec:
  podSelector:
    matchLabels:
      app: speech-to-phrase
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: home-assistant
      ports:
        - port: 10300
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: home-assistant
      ports:
        - port: 8123
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
