apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

resources:
  - authentik-forward-auth.yaml
  - storageclass-local-media.yaml
  - pv-downloads.yaml
  - pvc-downloads.yaml
  - deployment.yaml
  - service.yaml
  - service-peers.yaml
  - ingress.yaml
  - pvc-config.yaml
  - bootstrap-job.yaml

# The init container copies this file over the live config at every start.
# The generated name changes with the content, so edits restart the pod.
configMapGenerator:
  - name: qbittorrent-conf
    files:
      - qBittorrent.conf

labels:
  - pairs:
      app: qbittorrent
    includeSelectors: false
