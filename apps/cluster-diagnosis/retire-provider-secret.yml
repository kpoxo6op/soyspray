---
- name: Retire the unused cluster diagnosis provider Secret
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    retired_secret: cluster-diagnosis-deepseek
  tasks:
    - name: Read the cluster diagnosis Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - -n
          - monitoring
          - get
          - deployment
          - cluster-diagnosis
          - -o
          - json
      register: diagnosis_deployment
      changed_when: false
      check_mode: false

    - name: Read every pod before removing the dedicated Secret
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ kubeconfig_path }}", get, pods, -A, -o, json]
      register: diagnosis_pods
      changed_when: false
      check_mode: false
      no_log: true

    - name: Read workload controllers before removing the dedicated Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - get
          - deployments,statefulsets,daemonsets,cronjobs
          - -A
          - -o
          - json
      register: diagnosis_workloads
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require that no running workload refers to the retired Secret
      ansible.builtin.assert:
        that:
          - retired_secret not in diagnosis_deployment.stdout
          - retired_secret not in diagnosis_pods.stdout
          - retired_secret not in diagnosis_workloads.stdout
        fail_msg: >-
          The provider Secret is still referenced by a Deployment or pod.
          Wait for the factual runtime rollout before retirement.

    - name: Check whether the dedicated Secret is present
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - -n
          - monitoring
          - get
          - secret
          - "{{ retired_secret }}"
          - -o
          - name
      register: diagnosis_provider_secret
      changed_when: false
      failed_when: >-
        diagnosis_provider_secret.rc != 0 and
        'NotFound' not in diagnosis_provider_secret.stderr
      check_mode: false
      no_log: true

    - name: Delete only the unused dedicated provider Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - -n
          - monitoring
          - delete
          - secret
          - "{{ retired_secret }}"
      changed_when: true
      when: diagnosis_provider_secret.rc == 0 and not ansible_check_mode
      no_log: true
