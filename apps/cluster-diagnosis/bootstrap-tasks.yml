- name: Read the installed Telegram delivery identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - get
      - secret
      - --namespace
      - monitoring
      - alertmanager-telegram-secret
      - --output
      - json
  register: cluster_diagnosis_telegram
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true

- name: Require the existing Alertmanager bot identity
  ansible.builtin.assert:
    that:
      - cluster_diagnosis_telegram.rc == 0
      - >-
        'PROMETHEUS_TELEGRAM_BOT_TOKEN' in
        ((cluster_diagnosis_telegram.stdout | default('{}') | from_json).data | default({}))
    fail_msg: >-
      The factual incident update is delivered by the existing Alertmanager bot.
      Restore monitoring/alertmanager-telegram-secret first. This bootstrap
      never creates, changes or deletes that Secret.
