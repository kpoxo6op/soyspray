apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-diagnosis-state
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-diagnosis
    app.kubernetes.io/part-of: observability
  annotations:
    description: >-
      Incident identity, delivered-message signatures and the Telegram outbox.
      It has no isolated restore or backup guarantee. Losing it may drop pending
      updates and cause repeated notices; preserve it during upgrades.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
