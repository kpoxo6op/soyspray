apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-diagnosis
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-diagnosis
    app.kubernetes.io/component: diagnosis
    app.kubernetes.io/part-of: observability
  annotations:
    description: >-
      One incident loop: Alertmanager grouping, bounded Loki evidence and
      factual Telegram updates when there is new information.
spec:
  replicas: 1
  # Recreate guarantees the previous pod is gone before the next starts. The
  # state store also takes an exclusive lock, so two writers cannot overlap even if a
  # pod is started by hand.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-diagnosis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-diagnosis
        app.kubernetes.io/component: diagnosis
        app.kubernetes.io/part-of: observability
      annotations:
        soyspray.dev/runtime-config: "1"
    spec:
      # No Kubernetes identity: the loop reads Alertmanager, Loki and Prometheus
      # over plain HTTP and never talks to the API server.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnosis
          # Pinned to a digest published by the image workflow, which opens a
          # separate promotion PR for every new one and is the only writer of
          # this line. A placeholder digest means a source merge landed before
          # its promotion merge, so the pod cannot start in that window and the
          # two merges are done back to back.
          image: ghcr.io/kpoxo6op/cluster-diagnosis@sha256:a16a58eb1d5661320de9a36ce0ae57d7bdd7614ae638e83a9c2dedbcf7ca97a7
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/diagnosis.py"]
          env:
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.monitoring.svc.cluster.local:9093
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local:3100
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            - name: CLUSTER_DIAGNOSIS_STATE_ROOT
              value: /state
            # The bot token belongs to the existing Alertmanager bot, so the
            # factual update arrives in the same private chat as the alerts. The
            # recipient is application configuration, never log content.
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /etc/cluster-diagnosis/telegram/PROMETHEUS_TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              value: "336642153"
            - name: POLL_SECONDS
              value: "120"
            - name: METRICS_PORT
              value: "9911"
          ports:
            - name: metrics
              containerPort: 9911
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          # No liveness probe on purpose: a dependency outage or an unreadable
          # state file must not restart the pod in a loop. Readiness reports the
          # condition and SoysprayDiagnosisStateUnusable alerts on it.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /state
            - name: telegram
              mountPath: /etc/cluster-diagnosis/telegram
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: cluster-diagnosis-state
        - name: telegram
          secret:
            secretName: alertmanager-telegram-secret
        - name: tmp
          emptyDir: {}
