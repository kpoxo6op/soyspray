# The loop reads three in-cluster Services and calls three external hosts. It has
# no Kubernetes identity, and this policy keeps it away from the API server, the
# node network and every other workload.
#
# Calico does not offer name-based egress rules, so the external side is
# expressed as "anything outside the cluster CIDRs and the LAN on 443". The pod
# CIDR, the service CIDR and the LAN subnet are excluded, which is what blocks
# the API server, the node addresses and every other workload while still
# allowing an address that can move.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-diagnosis
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-diagnosis
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-diagnosis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes the pod directly.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9911
  egress:
    # The pod resolves through NodeLocal DNSCache, which answers on the
    # kubespray `nodelocaldns_ip` address 169.254.25.10. That address is outside
    # both cluster CIDRs, so it needs its own rule: without it the loop cannot
    # resolve anything and every poll ends as source-failed. The other apps use
    # the same rule.
    - to:
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Every pod in the monitoring namespace may answer on these three ports. The
    # policy cannot name a Service, so it allows the ports rather than exactly
    # the three workloads that serve them.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
    # The two external hosts are reached by name over 443. Everything inside the
    # cluster, the node network and the LAN stays out: the API server, the node
    # addresses, the router and every other workload are unreachable from here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.233.0.0/18
              - 10.233.64.0/18
              - 192.168.20.0/24
      ports:
        - protocol: TCP
          port: 443
