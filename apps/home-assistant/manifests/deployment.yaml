# apps/home-assistant/manifests/deployment.yaml
# Deployment for Home Assistant
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      annotations:
        soyspray.vip/bootstrap-config-revision: "2026-11-05-bin-collections-v2"
      labels:
        app: home-assistant
        component: main
    spec:
      initContainers:
        - name: install-gi-voice
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          image: ghcr.io/kpoxo6op/gi-voice@sha256:d426f60337a7d369e8aa7259f1ae77a6e986ce0b1ea4a17877d5f09adb4435c9
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
        - name: bootstrap-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              cp /bootstrap/configuration.yaml /config/configuration.yaml
              cp /bootstrap/automations.yaml /config/automations.yaml
              cp /bootstrap/scripts.yaml /config/scripts.yaml
              cp /bootstrap/scenes.yaml /config/scenes.yaml
              cp /bootstrap/templates.yaml /config/templates.yaml
              mkdir -p /config/dashboards
              cp /bootstrap/mercury-dashboard.yaml /config/dashboards/mercury.yaml
              cp /bootstrap/bins-dashboard.yaml /config/dashboards/bins.yaml
              # These two files were managed by the initial Everyday promotion.
              # Everyday reads its own bundle; original GI keeps native sentences.
              for file in gi_starters.yaml gi_learned.yaml; do
                test ! -L "/config/custom_sentences/en/$file"
                rm -f "/config/custom_sentences/en/$file"
              done
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bootstrap
              mountPath: /bootstrap
        - name: install-dreame-vacuum
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache ca-certificates unzip wget >/dev/null
              version="v2.0.0b23"
              expected_sha256="7cd8e3af9d90c3a4b018970b9a05faa48c4c43d40cb007b0e7b031e174db068e"
              install_dir="/config/custom_components/dreame_vacuum"
              version_file="${install_dir}/.soyspray-version"

              if [ -f "${version_file}" ] && [ "$(cat "${version_file}")" = "${version}" ]; then
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              wget -q -O "${tmp_dir}/dreame_vacuum.zip" "https://github.com/Tasshack/dreame-vacuum/releases/download/${version}/dreame_vacuum.zip"
              echo "${expected_sha256}  ${tmp_dir}/dreame_vacuum.zip" | sha256sum -c -
              rm -rf "${install_dir}"
              mkdir -p "${install_dir}"
              unzip -q "${tmp_dir}/dreame_vacuum.zip" -d "${install_dir}"
              echo "${version}" > "${version_file}"
              rm -rf "${tmp_dir}"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-fellow-stagg
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache ca-certificates unzip wget >/dev/null
              revision="28b6ada497d934ebabd5d34e541f9d1f1280c697"
              expected_sha256="9fc99a49695d360ddda0d2a5bcc37272ddabfdd4a190d863672110da83f4188f"
              install_dir="/config/custom_components/fellow_stagg"
              version_file="${install_dir}/.soyspray-version"

              if [ -f "${version_file}" ] && [ "$(cat "${version_file}")" = "${revision}" ]; then
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              wget -q -O "${tmp_dir}/fellow.zip" "https://codeload.github.com/bramboe/stagg-ekg-plus-ha/zip/${revision}"
              echo "${expected_sha256}  ${tmp_dir}/fellow.zip" | sha256sum -c -
              unzip -q "${tmp_dir}/fellow.zip" -d "${tmp_dir}/source"
              source_dir="${tmp_dir}/source/stagg-ekg-plus-ha-${revision}/custom_components/fellow_stagg"
              test -f "${source_dir}/manifest.json"
              mkdir -p /config/custom_components
              rm -rf "${install_dir}"
              cp -R "${source_dir}" "${install_dir}"
              echo "${revision}" > "${version_file}"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-mercury-energy
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache ca-certificates git >/dev/null
              # bkintanar/home-assistant-mercury-co-nz v2.1.1
              revision="1a5774e3d8dbd7a7c8f7ce75be6248cda8143c5d"
              expected_tree="13c1b9760c0fe8fdae1800ea3eb16d7129f6b3ea"
              install_dir="/config/custom_components/mercury_co_nz"
              version_file="${install_dir}/.soyspray-version"

              if [ -f "${version_file}" ] && [ "$(cat "${version_file}")" = "${revision}" ]; then
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              git -C "${tmp_dir}" init -q
              git -C "${tmp_dir}" fetch -q --depth 1 https://github.com/bkintanar/home-assistant-mercury-co-nz.git "${revision}"
              test "$(git -C "${tmp_dir}" rev-parse FETCH_HEAD)" = "${revision}"
              test "$(git -C "${tmp_dir}" rev-parse FETCH_HEAD:custom_components/mercury_co_nz)" = "${expected_tree}"
              mkdir -p "${tmp_dir}/out"
              git -C "${tmp_dir}" archive FETCH_HEAD custom_components/mercury_co_nz | tar -x -C "${tmp_dir}/out"
              source_dir="${tmp_dir}/out/custom_components/mercury_co_nz"
              test -f "${source_dir}/manifest.json"
              rm -rf "${source_dir}/tests"
              mkdir -p /config/custom_components
              rm -rf "${install_dir}"
              cp -R "${source_dir}" "${install_dir}"
              echo "${revision}" > "${version_file}"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-waste-collection
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache ca-certificates git >/dev/null
              # mampfes/hacs_waste_collection_schedule v2.36.0 (Auckland Council source)
              revision="67cb32c01a65331cc0acc51eaa4311225a908e90"
              expected_tree="db613968d04c6ad0237b6382b33e585bfaf0d4c2"
              install_dir="/config/custom_components/waste_collection_schedule"
              version_file="${install_dir}/.soyspray-version"

              if [ -f "${version_file}" ] && [ "$(cat "${version_file}")" = "${revision}" ]; then
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              git -C "${tmp_dir}" init -q
              git -C "${tmp_dir}" fetch -q --depth 1 https://github.com/mampfes/hacs_waste_collection_schedule.git "${revision}"
              test "$(git -C "${tmp_dir}" rev-parse FETCH_HEAD)" = "${revision}"
              test "$(git -C "${tmp_dir}" rev-parse FETCH_HEAD:custom_components/waste_collection_schedule)" = "${expected_tree}"
              mkdir -p "${tmp_dir}/out"
              git -C "${tmp_dir}" archive FETCH_HEAD custom_components/waste_collection_schedule | tar -x -C "${tmp_dir}/out"
              source_dir="${tmp_dir}/out/custom_components/waste_collection_schedule"
              test -f "${source_dir}/manifest.json"
              test -f "${source_dir}/waste_collection_schedule/source/aucklandcouncil_govt_nz.py"
              mkdir -p /config/custom_components
              rm -rf "${install_dir}"
              cp -R "${source_dir}" "${install_dir}"
              echo "${revision}" > "${version_file}"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-oidc-auth
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache ca-certificates unzip wget >/dev/null
              version="v1.1.1"
              expected_sha256="9ce9e6153f80c781e360b93e097ff7d87d09235430fc48e7a67d97dda5fc3322"
              install_dir="/config/custom_components/auth_oidc"
              version_file="${install_dir}/.soyspray-version"

              if [ -f "${version_file}" ] && [ "$(cat "${version_file}")" = "${version}" ]; then
                exit 0
              fi

              tmp_dir="$(mktemp -d)"
              wget -q -O "${tmp_dir}/hass-oidc-auth.zip" "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/${version}/hass-oidc-auth.zip"
              echo "${expected_sha256}  ${tmp_dir}/hass-oidc-auth.zip" | sha256sum -c -
              rm -rf "${install_dir}"
              mkdir -p "${install_dir}"
              unzip -q "${tmp_dir}/hass-oidc-auth.zip" -d "${install_dir}"
              echo "${version}" > "${version_file}"
              rm -rf "${tmp_dir}"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.5.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: GI_VOICE_BROADCAST_ADDRESS
              value: "192.168.20.255"
            - name: TZ
              value: "Pacific/Auckland"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: bootstrap
          configMap:
            name: home-assistant-bootstrap
