    - title: Bins
      path: bins
      subview: true
      back_path: /dashboard-home/home
      icon: mdi:delete-empty
      type: sections
      max_columns: 3
      badges:
      - type: entity
        entity: sensor.bins_status
        show_name: false
        color: green
      sections:
      - type: grid
        cards:
        - type: heading
          heading: Next collection
          icon: mdi:truck-outline
          heading_style: title
        - type: markdown
          text_only: true
          grid_options:
            columns: full
          content: |
            {% if has_value('sensor.bins_next_collection') %}
            {%- set day = strptime(states('sensor.bins_next_collection'), '%Y-%m-%d') %}
            {%- set icons = {'Rubbish': '🔴', 'Food scraps': '🟢', 'Recycling': '🟡'} %}
            {%- set when = state_attr('sensor.bins_next_collection', 'when') %}
            # {{ when }}
            ### {{ day.strftime('%-d %B') if when == day.strftime('%A') else day.strftime('%A %-d %B') }}

            {% for bin in state_attr('sensor.bins_next_collection', 'bins') %}{{ icons.get(bin, '⚪') }} **{{ bin }}**&nbsp;&nbsp;{% endfor %}

            {% if states('sensor.bins_status') == 'Out' %}✅ Out — nothing to do.
            {%- elif state_attr('sensor.bins_next_collection', 'days') == 1 %}Put them out tonight.
            {%- elif state_attr('sensor.bins_next_collection', 'days') == 0 %}Kerbside before 7am.
            {%- else %}Out the evening before.{% endif %}
            {% else %}
            ## No schedule yet
            The council calendar has no upcoming dates. Check Settings → Devices & services → Waste Collection Schedule.
            {% endif %}
        - type: tile
          entity: sensor.bins_status
          name: Status
          color: green
        - type: tile
          entity: script.bins_mark_out
          name: They're out
          icon: mdi:check-circle
          color: green
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: script.bins_mark_out
      - type: grid
        cards:
        - type: heading
          heading: Each bin
          icon: mdi:delete-variant
          heading_style: title
        - type: tile
          entity: sensor.bins_rubbish
          name: Rubbish
          grid_options:
            columns: full
          icon: mdi:trash-can
          color: red
          state_content:
          - when
          - state
        - type: tile
          entity: sensor.bins_food_scraps
          name: Food scraps
          grid_options:
            columns: full
          icon: mdi:food-apple-outline
          color: green
          state_content:
          - when
          - state
        - type: tile
          entity: sensor.bins_recycling
          name: Recycling
          grid_options:
            columns: full
          icon: mdi:recycle
          color: amber
          state_content:
          - when
          - state
        - type: markdown
          text_only: true
          grid_options:
            columns: full
          content: Rubbish and food scraps every week, recycling every second week. After a public holiday collections
            move a day later; the dates here follow the council. Inorganic collection is booked separately on the council
            website.
      - type: grid
        cards:
        - type: heading
          heading: Calendar
          icon: mdi:calendar-month
          heading_style: title
        - type: calendar
          entities:
          - calendar.bin_collections
          initial_view: dayGridMonth
          grid_options:
            columns: full
      - type: grid
        cards:
        - type: heading
          heading: Reminders
          icon: mdi:bell-ring-outline
          heading_style: title
        - type: markdown
          text_only: true
          grid_options:
            columns: full
          content: The phone is reminded at 18:30 the evening before, again at 21:00 if the bins are not marked out,
            and at 06:15 on the day. "In an hour" snoozes one reminder.
        - type: tile
          entity: input_boolean.bins_reminders_paused
          name: Pause reminders
          color: grey
          features:
          - type: toggle
        - type: tile
          entity: input_datetime.bins_out_for
          name: Last marked out
          icon: mdi:check-circle-outline
          color: green
      background: 'radial-gradient(130% 55% at 0% 0%, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 62%), radial-gradient(110%
        50% at 100% 100%, rgba(20, 184, 166, 0.14) 0%, rgba(20, 184, 166, 0) 60%), fixed #0b0d12'
