---
- name: Prepare the existing ExternalDNS Application for native adoption
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    external_dns_cascading_finalizers:
      - resources-finalizer.argocd.argoproj.io
      - resources-finalizer.argocd.argoproj.io/background
  tasks:
    - name: Read the existing Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: external-dns
        kubeconfig: "{{ kubeconfig_path }}"
      register: external_dns_existing_app

    - name: Require the known source and ownership before removing cascading deletion
      vars:
        external_dns_legacy_spec: >-
          {{ (lookup('file', playbook_dir + '/../../playbooks/argocd/applications/infrastructure/' +
              'external-dns/external-dns-application.yaml') | from_yaml).spec }}
        external_dns_native_spec: "{{ (lookup('file', playbook_dir + '/argocd/application.yaml') | from_yaml).spec }}"
      ansible.builtin.assert:
        that:
          - external_dns_existing_app.resources | length == 1
          - external_dns_existing_app.resources[0].spec in [external_dns_legacy_spec, external_dns_native_spec]
          - external_dns_existing_app.resources[0].metadata.deletionTimestamp is not defined
          - >-
            external_dns_existing_app.resources[0].status.operationState.phase | default('')
            not in ['Running', 'Terminating']

    - name: Remove only the Argo cascading finalizers from the observed Application
      vars:
        external_dns_finalizers: "{{ external_dns_existing_app.resources[0].metadata.finalizers | default([]) }}"
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: external-dns
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ external_dns_existing_app.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /metadata/finalizers
            value: "{{ external_dns_finalizers | difference(external_dns_cascading_finalizers) }}"
      when: external_dns_finalizers | intersect(external_dns_cascading_finalizers) | length > 0
