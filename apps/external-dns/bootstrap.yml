---
- name: Bootstrap the ExternalDNS provider identity
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
  tasks:
    - name: Bootstrap the provider Secret
      ansible.builtin.import_tasks: ../bootstrap-secret-tasks.yml
      vars:
        bootstrap_secret_name: cloudflare-api-token
        bootstrap_secret_namespace: external-dns
        bootstrap_secret_key: api-token
        bootstrap_secret_input: "{{ external_dns_cloudflare_api_token | default('') }}"
        bootstrap_secret_namespace_file: "{{ playbook_dir }}/namespace.yaml"
        bootstrap_secret_available_fail_msg: >-
          Restore the provider Secret or supply external_dns_cloudflare_api_token through
          an Ansible Vault variables file. The public provider identity must already exist.
        bootstrap_secret_matches_fail_msg: The supplied provider token differs from the existing identity. No change was made.
