apiVersion: apps/v1
kind: Deployment
metadata:
  name: otv-horoscope
  namespace: otv-horoscope
  labels:
    app.kubernetes.io/name: otv-horoscope
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otv-horoscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otv-horoscope
    spec:
      containers:
      - name: recorder
        image: ghcr.io/kpoxo6op/otv-horoscope@sha256:490329bfd461f3a07377210bb3431b6953fc0c243a855b9ce9b713431d2ace08
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: STREAM_URL
          value: https://jz2lo90hnpy.a.trbcdn.net/livemaster/yo8gr_live-5gorrrfpouq.smil/playlist.m3u8
        - name: WORK_DIR
          value: /work
        - name: BUFFER_MINUTES
          value: '90'
        - name: WHISPER_THREADS
          value: '2'
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: otv-horoscope-telegram
              key: bot-token
        - name: TELEGRAM_CHAT_IDS
          valueFrom:
            secretKeyRef:
              name: otv-horoscope-telegram
              key: chat-ids
        - name: TELEGRAM_CHAT_IDS_FILE
          value: /etc/otv-horoscope/chat-ids
        volumeMounts:
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
        - name: recipients
          mountPath: /etc/otv-horoscope
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 90
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 300
          periodSeconds: 60
          failureThreshold: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: work
        emptyDir:
          sizeLimit: 6Gi
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: recipients
        secret:
          secretName: otv-horoscope-telegram
          items:
          - key: chat-ids
            path: chat-ids
      automountServiceAccountToken: false
      enableServiceLinks: false
