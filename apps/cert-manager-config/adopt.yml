---
- name: Prepare the existing certificate configuration Application for native adoption
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    cert_manager_cascading_finalizers:
      - resources-finalizer.argocd.argoproj.io
      - resources-finalizer.argocd.argoproj.io/background
  tasks:
    - name: Read the existing Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: cert-manager-config
        kubeconfig: "{{ kubeconfig_path }}"
      register: cert_manager_existing_app

    - name: Require the known source and ownership before removing cascading deletion
      vars:
        cert_manager_legacy_spec: >-
          {{ (lookup('file', playbook_dir + '/../../playbooks/argocd/applications/infrastructure/' +
              'cert-manager/cert-manager-application.yaml') | from_yaml).spec }}
        cert_manager_native_spec: "{{ (lookup('file', playbook_dir + '/argocd/application.yaml') | from_yaml).spec }}"
      ansible.builtin.assert:
        that:
          - cert_manager_existing_app.resources | length == 1
          - cert_manager_existing_app.resources[0].spec in [cert_manager_legacy_spec, cert_manager_native_spec]
          - cert_manager_existing_app.resources[0].metadata.deletionTimestamp is not defined
          - >-
            cert_manager_existing_app.resources[0].status.operationState.phase | default('')
            not in ['Running', 'Terminating']

    - name: Remove only the Argo cascading finalizers from the observed Application
      vars:
        cert_manager_finalizers: "{{ cert_manager_existing_app.resources[0].metadata.finalizers | default([]) }}"
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: cert-manager-config
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ cert_manager_existing_app.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /metadata/finalizers
            value: "{{ cert_manager_finalizers | difference(cert_manager_cascading_finalizers) }}"
      when: cert_manager_finalizers | intersect(cert_manager_cascading_finalizers) | length > 0
