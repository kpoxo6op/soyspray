apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: test-cert
  namespace: cert-manager
spec:
  duration: 2160h
  renewBefore: 360h
  secretName: test-cert-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - "*.test.soyspray.vip"
    - "test.soyspray.vip"
