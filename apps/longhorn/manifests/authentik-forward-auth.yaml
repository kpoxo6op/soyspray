apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-proxy-set-headers-longhorn
  namespace: longhorn-system
data:
  X-Forwarded-Host: "$http_host"
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server-longhorn
  namespace: longhorn-system
spec:
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-authentik-outpost
  namespace: longhorn-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - longhorn.soyspray.vip
      secretName: prod-cert-tls
  rules:
    - host: longhorn.soyspray.vip
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server-longhorn
                port:
                  number: 80
