apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: opencode-remote
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Private HTTPS route to OpenCode running on Boris's laptop.
  sourceRepos:
    - https://github.com/kpoxo6op/soyspray.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: opencode-remote
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
