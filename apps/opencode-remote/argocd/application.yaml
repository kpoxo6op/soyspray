apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-remote
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: opencode-remote
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/access-url: https://ai.soyspray.vip
    soyspray.vip/access-method: Private LAN or Tailscale route with protected DeepSeek Harness access
    soyspray.vip/data: none in Kubernetes; sessions and credentials stay on laptop mox
    soyspray.vip/backup: none required for the stateless Kubernetes route
    soyspray.vip/backup-cause: Git owns routing; laptop systemd and DeepSeek Harness own runtime state
spec:
  project: opencode-remote
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: apps/opencode-remote/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode-remote
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: opencode-remote
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
