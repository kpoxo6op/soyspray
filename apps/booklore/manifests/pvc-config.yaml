# apps/booklore/manifests/pvc-config.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
