---
- name: Prepare the existing Boys Application for native root adoption
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    boys_cascading_finalizers:
      - resources-finalizer.argocd.argoproj.io
      - resources-finalizer.argocd.argoproj.io/background
  tasks:
    - name: Read the existing application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: boys
        kubeconfig: "{{ kubeconfig_path }}"
      register: boys_adopt_application

    - name: Read the deployment carrying the legacy version annotation
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: boys
        name: boys
        kubeconfig: "{{ kubeconfig_path }}"
      register: boys_adopt_deployment

    - name: Require the existing single writer
      ansible.builtin.assert:
        that:
          - boys_adopt_application.resources | length == 1
          - boys_adopt_deployment.resources | length == 1
          - boys_adopt_deployment.resources[0].spec.replicas == 1
          - boys_adopt_deployment.resources[0].spec.strategy.type == 'Recreate'

    - name: Derive the two accepted source forms from the maintained definitions
      ansible.builtin.set_fact:
        boys_adopt_source: "{{ boys_adopt_application.resources[0].spec.source }}"
        boys_native_source: "{{ (lookup('file', 'argocd/application.yaml') | from_yaml).spec.source }}"
        boys_legacy_source: >-
          {{ (lookup('file', '../../playbooks/argocd/applications/web/boys/boys-application.yaml')
              | replace('BOYS_RUNTIME_SECRET_RESOURCE_VERSION',
                boys_adopt_deployment.resources[0].spec.template.metadata.annotations[
                  'soyspray.vip/runtime-secret-resource-version'] | default('')) | from_yaml).spec.source }}

    - name: Reject another deployment source or an application already being deleted
      ansible.builtin.assert:
        that:
          - boys_adopt_source in [boys_legacy_source, boys_native_source]
          - boys_adopt_application.resources[0].metadata.deletionTimestamp is not defined
          - boys_adopt_application.resources[0].spec.project == 'boys'
          - >-
            boys_adopt_application.resources[0].spec.destination ==
            {'server': 'https://kubernetes.default.svc', 'namespace': 'boys'}
          - >-
            boys_adopt_application.resources[0].status.operationState.phase | default('')
            not in ['Running', 'Terminating']

    - name: Remove only the known legacy patch and cascading finalizers
      vars:
        boys_existing_finalizers: "{{ boys_adopt_application.resources[0].metadata.finalizers | default([]) }}"
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: boys
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ boys_adopt_application.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /spec/source
            value: "{{ boys_native_source }}"
          - op: add
            path: /metadata/finalizers
            value: "{{ boys_existing_finalizers | difference(boys_cascading_finalizers) }}"
      when: >-
        boys_adopt_source != boys_native_source or
        boys_existing_finalizers | intersect(boys_cascading_finalizers) | length > 0
