---
- name: Bootstrap the autism traits tunnel identity
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the existing tunnel Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: autism-traits
        name: autism-traits-cloudflared-token
        kubeconfig: "{{ kubeconfig_path }}"
      register: autism_traits_existing_token
      no_log: true

    - name: Check whether the existing or supplied identity can be used
      ansible.builtin.set_fact:
        autism_traits_identity_available: >-
          {{ (autism_traits_cloudflared_token | default('') is string) and
             ((autism_traits_existing_token.resources | length == 1 and
               autism_traits_existing_token.resources[0].data.token | default('') | length > 0) or
              (autism_traits_existing_token.resources | length == 0 and
               autism_traits_cloudflared_token | default('') | trim | length > 0)) }}
        autism_traits_identity_matches: >-
          {{ autism_traits_existing_token.resources | length == 0 or
             autism_traits_cloudflared_token | default('') == '' or
             autism_traits_cloudflared_token ==
             (autism_traits_existing_token.resources[0].data.token | default('') | b64decode) }}
      no_log: true

    - name: Require an existing identity or an encrypted bootstrap input
      ansible.builtin.assert:
        that: autism_traits_identity_available | bool
        fail_msg: >-
          Restore the tunnel Secret or supply autism_traits_cloudflared_token through
          an Ansible Vault variables file. The public tunnel identity must already exist.

    - name: Keep the existing tunnel identity unchanged
      ansible.builtin.assert:
        that: autism_traits_identity_matches | bool
        fail_msg: The supplied tunnel token differs from the existing identity. No change was made.

    - name: Apply the declared namespace for a missing identity
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('file', playbook_dir + '/manifests/namespace.yaml') | from_yaml }}"
      when: autism_traits_existing_token.resources | length == 0

    - name: Create only the missing tunnel Secret
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ kubeconfig_path }}", create, -f, '-']
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: autism-traits-cloudflared-token
            namespace: autism-traits
          type: Opaque
          stringData:
            token: {{ autism_traits_cloudflared_token | to_json }}
      changed_when: true
      no_log: true
      when: autism_traits_existing_token.resources | length == 0 and not ansible_check_mode
