# The connector may not reach node addresses or other pods and Services, only the reading web pod.
# Like boys and autism-traits, reading labels its own all-interface HostEndpoints so this boundary selects only them.
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: reading-cloudflared-host-boundary
  labels:
    app.kubernetes.io/name: reading-cloudflared
    app.kubernetes.io/part-of: reading
    reading-cluster-boundary: "true"
spec:
  order: 10
  selector: reading-host-boundary == 'true'
  preDNAT: true
  applyOnForward: true
  types:
    - Ingress
  ingress:
    - action: Deny
      source:
        namespaceSelector: projectcalico.org/name == 'reading'
        selector: reading-component == 'cloudflared'
      destination:
        nets:
          - 10.233.0.0/18
          - 10.233.64.0/18
          - 192.168.20.0/24
        notSelector: >-
          projectcalico.org/namespace == 'reading' &&
          reading-component == 'web'
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: reading-node-0-host-boundary
  labels:
    app.kubernetes.io/part-of: reading
    reading-cluster-boundary: "true"
    reading-host-boundary: "true"
spec:
  node: node-0
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.10
  profiles:
    - projectcalico-default-allow
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: reading-node-1-host-boundary
  labels:
    app.kubernetes.io/part-of: reading
    reading-cluster-boundary: "true"
    reading-host-boundary: "true"
spec:
  node: node-1
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.11
  profiles:
    - projectcalico-default-allow
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: reading-node-2-host-boundary
  labels:
    app.kubernetes.io/part-of: reading
    reading-cluster-boundary: "true"
    reading-host-boundary: "true"
spec:
  node: node-2
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.12
  profiles:
    - projectcalico-default-allow
