apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading
  labels:
    app.kubernetes.io/name: reading
    app.kubernetes.io/part-of: reading
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: reading
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reading
        app.kubernetes.io/part-of: reading
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/kpoxo6op/reading@sha256:6e28c24bc85c6069eb20ed2e38d25e2a7ad16cfae5ebf6e5c7c278967987bf35
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
