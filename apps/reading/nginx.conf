map $arg_v $reading_revision_cache {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
}

# Font and art filenames must carry a content hash when the page builder adds fonts.
map $uri $reading_asset_cache {
    default $reading_revision_cache;
    ~^/assets/fonts/.*\.woff2$ "public, max-age=31536000, immutable";
    ~^/assets/art/.*\.[0-9a-f]{8}\.(avif|webp)$ "public, max-age=31536000, immutable";
}

# HTML, including errors and redirects, always revalidates even with ?v=.
map $sent_http_content_type $reading_cache {
    default $reading_asset_cache;
    ~^text/html "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;

    # No location overrides add_header: every response inherits this whole set.
    add_header Cache-Control $reading_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # Only extensionless paths with an actual index page get a slash redirect.
    location ~ ^/[^.]*[^./]$ {
        if (-f $request_filename/index.html) {
            return 301 $uri/$is_args$args;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
