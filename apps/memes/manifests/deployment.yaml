apiVersion: apps/v1
kind: Deployment
metadata:
  name: memes
  labels:
    app.kubernetes.io/name: memes
    app.kubernetes.io/part-of: memes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      memes.soyspray.vip/role: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memes
        app.kubernetes.io/part-of: memes
        memes.soyspray.vip/role: web
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node-0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/kpoxo6op/memes:goal03-unreleased
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        env:
        - name: MEMES_ORIGIN
          value: https://memes.soyspray.vip
        - name: MEMES_COOKIE_SECURE
          value: 'true'
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: memes-data
      - name: tmp
        emptyDir: {}
