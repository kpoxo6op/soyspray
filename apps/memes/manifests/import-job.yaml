apiVersion: batch/v1
kind: Job
metadata:
  name: memes-import-v1
  labels:
    app.kubernetes.io/name: memes
    app.kubernetes.io/part-of: memes
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-1'
spec:
  suspend: false
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memes
        app.kubernetes.io/part-of: memes
        memes.soyspray.vip/role: import
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node-0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: import
        image: memes-import-v1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 6Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: archive
          mountPath: /archive
          readOnly: true
        args:
        - python
        - -m
        - memes.importer
        - --resume
        - --target
        - '10000'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: memes-data
      - name: tmp
        emptyDir: {}
      - name: archive
        persistentVolumeClaim:
          claimName: memes-vk-archive
          readOnly: true
      restartPolicy: Never
