apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.5/manifests/install.yaml
patches:
  - target:
      kind: Secret
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: excluded
  - target:
      kind: ConfigMap
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: excluded
  - target:
      kind: Service
      name: argocd-server
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
transformers:
  - protection.yaml
