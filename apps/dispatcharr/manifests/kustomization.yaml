apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources: [pvc.yaml, deployment.yaml, service.yaml, ingress.yaml, network-policy.yaml, reconcile-job.yaml, authentik-forward-auth.yaml]
configMapGenerator:
  - name: dispatcharr-reconcile
    files: [reconcile.py]
  - name: okru-plugin
    files: [okru.py]
labels:
  - pairs: {app.kubernetes.io/name: dispatcharr, app.kubernetes.io/part-of: live-tv}
    includeSelectors: false
