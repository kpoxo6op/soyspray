rule_files:
  - cluster-diagnosis.yaml
evaluation_interval: 1m

tests:
  - name: A missing incident loop pages nobody but warns the operator
    interval: 1m
    input_series:
      - series: up{job="kube-state-metrics"}
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SoysprayDiagnosisStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The incident loop has not polled Alertmanager"
              description: >-
                No diagnosis metrics are exposed, or the last completed poll is
                more than 15 minutes old. Incidents are not being correlated
                and no factual update will arrive. Check the cluster-diagnosis
                Deployment, its persistent volume and the Argo Application.

  - name: A running loop with a fresh poll does not warn
    interval: 1m
    input_series:
      - series: soyspray_diagnosis_up
        values: "1x40"
      - series: soyspray_diagnosis_last_poll_timestamp_seconds
        values: "0+60x40"
      - series: soyspray_diagnosis_alertmanager_source_ok
        values: "1x40"
    alert_rule_test:
      - eval_time: 39m
        alertname: SoysprayDiagnosisStale
        exp_alerts: []
      - eval_time: 39m
        alertname: SoysprayDiagnosisSourceUnreadable
        exp_alerts: []

  - name: A loop that cannot read any alert warns while it keeps polling
    interval: 1m
    input_series:
      - series: soyspray_diagnosis_up
        values: "1x40"
      # The loop keeps polling, so the stale rule stays quiet: only the source
      # rule reports that nothing can be investigated.
      - series: soyspray_diagnosis_last_poll_timestamp_seconds
        values: "0+60x40"
      - series: soyspray_diagnosis_alertmanager_source_ok
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SoysprayDiagnosisSourceUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The incident loop cannot read Alertmanager"
              description: >-
                The loop is running and polling, but every poll fails before it
                reaches an incident, so no incident evidence is collected and no factual update
                will arrive. Check the pod log for source-failed and the
                NetworkPolicy in monitoring/cluster-diagnosis: the pod resolves
                through the node-local DNS cache and reads Alertmanager on port
                9093.
      - eval_time: 30m
        alertname: SoysprayDiagnosisStale
        exp_alerts: []

  - name: A stalled loop warns after the grace period
    interval: 1m
    input_series:
      - series: soyspray_diagnosis_up
        values: "1x40"
      # The loop stops advancing the poll time but the pod keeps exposing the
      # last value, which is what a stalled loop looks like when scraped.
      - series: soyspray_diagnosis_last_poll_timestamp_seconds
        values: "0+60x5 300x34"
    alert_rule_test:
      - eval_time: 35m
        alertname: SoysprayDiagnosisStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The incident loop has not polled Alertmanager"
              description: >-
                No diagnosis metrics are exposed, or the last completed poll is
                more than 15 minutes old. Incidents are not being correlated
                and no factual update will arrive. Check the cluster-diagnosis
                Deployment, its persistent volume and the Argo Application.

  - name: An unreadable state file warns
    interval: 1m
    input_series:
      - series: soyspray_diagnosis_up
        values: "1x40"
      - series: soyspray_diagnosis_last_poll_timestamp_seconds
        values: "0+60x40"
      - series: soyspray_diagnosis_state_usable
        values: "0x40"
      - series: soyspray_diagnosis_outbox_oldest_seconds
        values: "10x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SoysprayDiagnosisStateUnusable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The incident loop cannot read its state"
              description: >-
                The state file has an unsupported schema or is unreadable, so
                incident tracking and delivery stop. Check the volume and use
                the guarded reset procedure in the application README.
      - eval_time: 30m
        alertname: SoysprayDiagnosisDeliveryStalled
        exp_alerts: []

  - name: A stalled outbox warns while a fresh one stays quiet
    interval: 1m
    input_series:
      - series: soyspray_diagnosis_up
        values: "1x40"
      - series: soyspray_diagnosis_last_poll_timestamp_seconds
        values: "0+60x40"
      - series: soyspray_diagnosis_outbox_oldest_seconds{fixture="stalled"}
        values: "2400x40"
      - series: soyspray_diagnosis_outbox_oldest_seconds{fixture="fresh"}
        values: "60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SoysprayDiagnosisDeliveryStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              fixture: stalled
            exp_annotations:
              summary: "Diagnosis messages are not reaching Telegram"
              description: >-
                The oldest queued factual update has waited more than thirty minutes.
                Delivery is retried on every poll without recreating the incident, and
                an entry older than six hours is dropped. Check the bot token in
                monitoring/alertmanager-telegram-secret and the loop log.
