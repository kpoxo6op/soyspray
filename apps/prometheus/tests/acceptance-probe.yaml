rule_files:
  - acceptance-probe.yaml
evaluation_interval: 1m

tests:
  - name: The acceptance probe fires once for a running diagnosis pod
    interval: 1m
    input_series:
      - series: kube_pod_info{namespace="monitoring",pod="cluster-diagnosis-6c9f98557f-5tzvb"}
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SoysprayDiagnosisAcceptanceProbe
        exp_alerts:
          - exp_labels:
              severity: critical
              container: diagnosis
              namespace: monitoring
              pod: cluster-diagnosis-6c9f98557f-5tzvb
            exp_annotations:
              summary: "Temporary acceptance probe for the diagnosis loop"
              description: >-
                Fires once for the running diagnosis pod so the production
                incident path is exercised end to end. It carries no meaning about
                the cluster and is removed by the pull request that reverts it.

  - name: The acceptance probe ignores anything else
    interval: 1m
    input_series:
      - series: kube_pod_info{namespace="immich",pod="immich-server-0"}
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SoysprayDiagnosisAcceptanceProbe
        exp_alerts: []
