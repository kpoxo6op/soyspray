rule_files:
  - acceptance-probe.yaml
evaluation_interval: 1m

tests:
  - name: The acceptance probe fires for the real authentik postgres pod
    interval: 1m
    input_series:
      - series: kube_pod_info{namespace="authentik",pod="authentik-postgresql-2"}
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SoysprayDiagnosisAcceptanceProbe
        exp_alerts:
          - exp_labels:
              severity: critical
              container: postgres
              namespace: authentik
              pod: authentik-postgresql-2
            exp_annotations:
              summary: "Temporary acceptance probe for the diagnosis loop"
              description: >-
                A synthetic trigger used once to check the redesigned message
                against real log evidence. It carries no meaning about the cluster
                and is removed by the pull request that reverts it.
