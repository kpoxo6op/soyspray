apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Prometheus, Alertmanager, Grafana, and their monitoring resources.
  sourceRepos:
    - https://github.com/kpoxo6op/soyspray.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Secret}
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: DaemonSet}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: monitoring.coreos.com, kind: Alertmanager}
    - {group: monitoring.coreos.com, kind: PodMonitor}
    - {group: monitoring.coreos.com, kind: Prometheus}
    - {group: monitoring.coreos.com, kind: PrometheusRule}
    - {group: monitoring.coreos.com, kind: ServiceMonitor}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
