# playbooks/yaml/argocd-apps/prometheus/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prometheus
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/access-url: https://grafana.soyspray.vip
    soyspray.vip/access-method: Authentik OIDC for Grafana; Authentik forward auth for Prometheus
    soyspray.vip/data-claims: monitoring/prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
    soyspray.vip/data: Prometheus metrics history with 15-day retention
    soyspray.vip/backup: blocked; no completed Longhorn backup or isolated TSDB restore
    soyspray.vip/backup-cause: Native adoption must wait for a completed backup and an isolated TSDB recovery check.
spec:
  project: prometheus-stack
  source:
    repoURL: "https://github.com/kpoxo6op/soyspray.git"
    targetRevision: "HEAD"
    path: apps/prometheus
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/enableOTLPReceiver
  syncPolicy:
      automated:
        prune: false
        selfHeal: true
      retry:
        limit: 5
        backoff:
          duration: "10s"
          factor: 2
          maxDuration: "5m"
      syncOptions:
        - CreateNamespace=true
        - AllowClusterResourceInNamespacedApp=true
        - RespectIgnoreDifferences=true
