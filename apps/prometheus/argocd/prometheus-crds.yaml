apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prometheus
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/data: none
    soyspray.vip/backup: not-required
    soyspray.vip/backup-cause: CRDs contain schemas; the Prometheus stack owns the custom resources.
spec:
  project: prometheus-crds
  source:
    repoURL: "https://prometheus-community.github.io/helm-charts"
    chart: prometheus-operator-crds
    targetRevision: 16.0.1
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - Replace=true
      - CreateNamespace=true
