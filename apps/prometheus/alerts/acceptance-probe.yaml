# TEMPORARY. One bounded acceptance run of the redesigned message through the
# production path: a synthetic trigger on a real workload, so the evidence the
# operator sees in the message is real log data from authentik's postgres pod.
# It is deleted and retired by the pull requests that follow.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: acceptance-probe
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: acceptance-probe
      interval: 1m
      rules:
        - alert: SoysprayDiagnosisAcceptanceProbe
          expr: kube_pod_info{namespace="authentik",pod="authentik-postgresql-2"} > 0
          for: 1m
          labels:
            severity: critical
            container: postgres
          annotations:
            summary: "Temporary acceptance probe for the diagnosis loop"
            description: >-
              A synthetic trigger used once to check the redesigned message
              against real log evidence. It carries no meaning about the cluster
              and is removed by the pull request that reverts it.
