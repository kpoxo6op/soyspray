# The incident loop is the only path that turns an incident into a narrative, so
# it must say when it stops working. A missing series is the loudest case and
# absent() covers it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-diagnosis
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cluster-diagnosis
      interval: 1m
      rules:
        - alert: SoysprayDiagnosisStale
          expr: |
            absent(soyspray_diagnosis_up)
            or (time() - soyspray_diagnosis_last_poll_timestamp_seconds > 900)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The incident loop has not polled Alertmanager"
            description: >-
              No diagnosis metrics are exposed, or the last completed poll is
              more than 15 minutes old. Incidents are not being investigated
              and no narrative will arrive. Check the cluster-diagnosis
              Deployment, its persistent volume and the Argo Application.

        - alert: SoysprayDiagnosisSourceUnreadable
          expr: soyspray_diagnosis_alertmanager_source_ok == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The incident loop cannot read Alertmanager"
            description: >-
              The loop is running and polling, but every poll fails before it
              reaches an incident, so nothing is investigated and no narrative
              will arrive. Check the pod log for source-failed and the
              NetworkPolicy in monitoring/cluster-diagnosis: the pod resolves
              through the node-local DNS cache and reads Alertmanager on port
              9093.

        - alert: SoysprayDiagnosisStateUnusable
          expr: soyspray_diagnosis_state_usable == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The incident loop cannot read its spend guard"
            description: >-
              The state file is missing an expected schema, unreadable or not
              writable, so model calls are refused. This is deliberate: a lost
              ledger would hand back a fresh allowance. Use the guarded reset
              procedure in the application README.

        - alert: SoysprayDiagnosisProviderRejected
          expr: soyspray_diagnosis_provider_blocked == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "DeepSeek rejected the diagnosis credential"
            description: >-
              The provider returned 401, 402 or 403, so the loop stopped asking
              until the next day. Restore the key in
              monitoring/cluster-diagnosis-deepseek through the bootstrap.

        - alert: SoysprayDiagnosisUndiagnosed
          expr: time() - soyspray_incident_undiagnosed_timestamp_seconds > 3600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A critical incident has no diagnosis"
            description: >-
              An open critical incident has gone an hour without a successful
              answer, because every provider call failed, the attempt allowance
              is spent, or an attempt was interrupted. The incident record holds
              this state across a restart. Read the loop log for the outcome.

        - alert: SoysprayDiagnosisDeliveryStalled
          expr: soyspray_diagnosis_outbox_oldest_seconds > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Diagnosis messages are not reaching Telegram"
            description: >-
              The oldest queued narrative has waited more than thirty minutes.
              Delivery is retried on every poll without another model call, and
              an entry older than six hours is dropped. Check the bot token in
              monitoring/alertmanager-telegram-secret and the loop log.
