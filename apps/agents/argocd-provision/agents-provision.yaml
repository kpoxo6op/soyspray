apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agents-provision
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-10'
  namespace: argocd
spec:
  description: Private agent workshop protected storage provisioning.
  sourceRepos:
    - https://github.com/kpoxo6op/soyspray.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: agents
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agents-provision
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-10'
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: agents
    soyspray.vip/owner: platform
spec:
  project: agents-provision
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: apps/agents/provision
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
