apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-evidence
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: agents-evidence-rwx-retain
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-restore-test
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: agents-evidence-rwx-retain
  resources:
    requests:
      storage: 4Gi
