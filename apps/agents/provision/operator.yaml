apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-intake-operator
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-intake-operator
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-intake-operator
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
subjects:
  - kind: ServiceAccount
    name: agents-intake-operator
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agents-intake-operator
