apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  labels:
    app.kubernetes.io/name: agents
    app.kubernetes.io/part-of: agents
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    agents.soyspray.vip/release-check: rollback-v1
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents
        app.kubernetes.io/part-of: agents
      annotations:
        agents.soyspray.vip/pack: 1f1852009efe9d501516e9c6f42f7ef40a9b30a6eb8a0a0cf7ab93909e980ac6
        agents.soyspray.vip/pvc-uid: 90f7d0c7-2090-4269-942e-961d9ceb95d1
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: verify-evidence
        image: ghcr.io/kpoxo6op/agents@sha256:41c413d25a2b30877cd7a18271a046b0d5ba383d506f44d43256d77af7b81834
        command:
        - python3
        - /opt/evidence.py
        - verify
        env: &id001
        - name: PACK_HASH
          value: 1f1852009efe9d501516e9c6f42f7ef40a9b30a6eb8a0a0cf7ab93909e980ac6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id002
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 192Mi
        volumeMounts:
        - name: evidence
          mountPath: /evidence
          readOnly: true
        - name: tmp
          mountPath: /tmp
      containers:
      - name: web
        image: ghcr.io/kpoxo6op/agents@sha256:41c413d25a2b30877cd7a18271a046b0d5ba383d506f44d43256d77af7b81834
        imagePullPolicy: IfNotPresent
        env: *id001
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id002
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 192Mi
        volumeMounts:
        - name: evidence
          mountPath: /evidence
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: evidence
        persistentVolumeClaim:
          claimName: agents-evidence
          readOnly: true
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
