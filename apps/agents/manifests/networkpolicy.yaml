apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-web
  labels:
    app.kubernetes.io/name: agents
    app.kubernetes.io/part-of: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agents
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress: []
