apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: sewing-guide-cloudflared-host-boundary
  labels:
    app.kubernetes.io/name: sewing-guide-cloudflared
    app.kubernetes.io/part-of: sewing-guide
    sewing-guide-cluster-boundary: "true"
spec:
  order: 10
  selector: sewing-guide-host-boundary == 'true'
  preDNAT: true
  applyOnForward: true
  types:
    - Ingress
  ingress:
    - action: Deny
      source:
        namespaceSelector: projectcalico.org/name == 'sewing-guide'
        selector: sewing-guide-component == 'cloudflared'
      destination:
        nets:
          - 10.233.0.0/18
          - 10.233.64.0/18
          - 192.168.20.0/24
        notNets:
          - 10.233.23.98/32
        notSelector: >-
          projectcalico.org/namespace == 'sewing-guide' &&
          sewing-guide-component == 'web'
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: sewing-guide-node-0-host-boundary
  labels:
    app.kubernetes.io/part-of: sewing-guide
    sewing-guide-cluster-boundary: "true"
    sewing-guide-host-boundary: "true"
spec:
  node: node-0
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.10
  profiles:
    - projectcalico-default-allow
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: sewing-guide-node-1-host-boundary
  labels:
    app.kubernetes.io/part-of: sewing-guide
    sewing-guide-cluster-boundary: "true"
    sewing-guide-host-boundary: "true"
spec:
  node: node-1
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.11
  profiles:
    - projectcalico-default-allow
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: sewing-guide-node-2-host-boundary
  labels:
    app.kubernetes.io/part-of: sewing-guide
    sewing-guide-cluster-boundary: "true"
    sewing-guide-host-boundary: "true"
spec:
  node: node-2
  interfaceName: "*"
  expectedIPs:
    - 192.168.20.12
  profiles:
    - projectcalico-default-allow
