apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sewing-guide
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sewing-guide
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/access-url: https://sewing.soyspray.vip
    soyspray.vip/access-method: Public Cloudflare Tunnel; private LAN and Tailscale ingress
    soyspray.vip/data: none
    soyspray.vip/backup: not-required
    soyspray.vip/backup-cause: Static guide with no persistent state; recovery requires the backed-up tunnel identity.
spec:
  project: sewing-guide
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: apps/sewing-guide/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: sewing-guide
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: sewing-guide
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
