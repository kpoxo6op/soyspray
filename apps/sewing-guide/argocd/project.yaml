apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sewing-guide
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Static PFAFF passport 3.0 sewing guide and its dedicated Cloudflare Tunnel connector.
  sourceRepos:
    - https://github.com/kpoxo6op/soyspray.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sewing-guide
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: crd.projectcalico.org, kind: GlobalNetworkPolicy}
    - {group: crd.projectcalico.org, kind: HostEndpoint}
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: crd.projectcalico.org, kind: NetworkPolicy}
