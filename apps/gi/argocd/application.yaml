apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gi
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/access-url: https://gi.soyspray.vip
    soyspray.vip/access-method: Authentik forward auth, gi-users group only; LAN and
      Tailscale
    soyspray.vip/data: gi/gi-finance Secret, mounted read-only at /data/finance.json;
      published by apps/gi/finance.yml from a private file outside Git
    soyspray.vip/backup: 'Operator-owned: the private source file and a dated copy
      of each published version stay outside the cluster'
    soyspray.vip/backup-cause: The page is static and keeps no claim. Recovery is
      publishing the data file again with make -f apps/gi/Makefile finance.
spec:
  project: gi
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: apps/gi/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: gi
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
