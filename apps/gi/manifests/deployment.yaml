apiVersion: apps/v1
kind: Deployment
metadata:
  name: gi
  labels:
    app.kubernetes.io/name: gi
    app.kubernetes.io/part-of: gi
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gi
        app.kubernetes.io/part-of: gi
        gi-component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image is a private package, so the cluster needs a pull credential.
      # The maintained bootstrap creates it from private Vault inputs.  Do not
      # mark it optional: the API server discards that field, so Argo would
      # report permanent drift and re-sync forever.  Until the credential
      # exists the pod reports ImagePullBackOff, which is the honest state.
      imagePullSecrets:
        - name: gi-registry
      securityContext:
        # nginx-unprivileged runs as 101.  The data file is group-readable by
        # the same group and nothing else.
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/kpoxo6op/gi-app@sha256:c5855a45ebc2efbeae40078e16ab0a9d5f5d77e226a13a6d99d87f949ea5fe38
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: finance
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # The private data file.  Ansible writes the gi-finance Secret from a
        # file outside Git (`make -f apps/gi/Makefile finance`); Argo never
        # manages it.  Without it the page says there is no data yet.
        - name: finance
          secret:
            secretName: gi-finance
            optional: true
            defaultMode: 288 # 0440
            items:
              - key: finance.json
                path: finance.json
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
