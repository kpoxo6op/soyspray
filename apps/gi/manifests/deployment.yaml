apiVersion: apps/v1
kind: Deployment
metadata:
  name: gi
  labels:
    app.kubernetes.io/name: gi
    app.kubernetes.io/part-of: gi
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gi
        app.kubernetes.io/part-of: gi
        gi-component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image is a private package, so the cluster needs a pull credential.
      # The maintained bootstrap creates it from private Vault inputs.  It is
      # marked optional so a first sync still renders while the credential is
      # being prepared; the pod then reports ImagePullBackOff until it exists.
      imagePullSecrets:
        - name: gi-registry
          optional: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/kpoxo6op/gi-app@sha256:c4dd3208e7d426777ddee8b6c941d897a9f32aa69a27f04bb9d4739c36364444
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GI_DB_PATH
              value: /data/gi.sqlite3
            - name: GI_STATIC_DIR
              value: /app/static
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gi-data
        - name: backups
          persistentVolumeClaim:
            claimName: gi-backups
        - name: tmp
          emptyDir: {}
