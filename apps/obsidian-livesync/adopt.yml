---
- name: Prepare the existing Obsidian Application for native adoption
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    obsidian_livesync_cascading_finalizers:
      - resources-finalizer.argocd.argoproj.io
      - resources-finalizer.argocd.argoproj.io/background
  tasks:
    - name: Read the existing Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: obsidian-livesync
        kubeconfig: "{{ kubeconfig_path }}"
      register: obsidian_livesync_existing_app

    - name: Require the known source and ownership before removing cascading deletion
      vars:
        obsidian_livesync_legacy_spec: >-
          {{ (lookup('file', playbook_dir + '/../../playbooks/argocd/applications/database/' +
              'obsidian-livesync/obsidian-livesync-application.yaml') | from_yaml).spec }}
        obsidian_livesync_native_spec: "{{ (lookup('file', playbook_dir + '/argocd/application.yaml') | from_yaml).spec }}"
      ansible.builtin.assert:
        that:
          - obsidian_livesync_existing_app.resources | length == 1
          - obsidian_livesync_existing_app.resources[0].spec in [obsidian_livesync_legacy_spec, obsidian_livesync_native_spec]
          - obsidian_livesync_existing_app.resources[0].metadata.deletionTimestamp is not defined
          - >-
            obsidian_livesync_existing_app.resources[0].status.operationState.phase | default('')
            not in ['Running', 'Terminating']

    - name: Read the existing durable claim
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: obsidian
        name: obsidian-livesync-couchdb-rescue-longhorn
        kubeconfig: "{{ kubeconfig_path }}"
      register: obsidian_adoption_claim

    - name: Require the restored and verified original claim
      ansible.builtin.assert:
        that:
          - obsidian_adoption_claim.resources | length == 1
          - obsidian_adoption_claim.resources[0].metadata.uid == obsidian_adoption_claim_uid | default('')
          - obsidian_adoption_claim.resources[0].metadata.deletionTimestamp is not defined
          - obsidian_adoption_claim.resources[0].status.phase == 'Bound'
          - obsidian_adoption_claim.resources[0].spec.storageClassName == 'longhorn'
          - obsidian_adoption_claim.resources[0].spec.resources.requests.storage == '10Gi'
        fail_msg: Supply the original claim UID from the verified recovery evidence. Do not adopt a replacement claim.

    - name: Read the original bound volume
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolume
        name: "{{ obsidian_adoption_claim.resources[0].spec.volumeName }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: obsidian_adoption_volume

    - name: Require the original Longhorn binding
      ansible.builtin.assert:
        that:
          - obsidian_adoption_volume.resources | length == 1
          - obsidian_adoption_volume.resources[0].spec.claimRef.uid == obsidian_adoption_claim.resources[0].metadata.uid
          - obsidian_adoption_volume.resources[0].spec.claimRef.namespace == 'obsidian'
          - obsidian_adoption_volume.resources[0].spec.claimRef.name == 'obsidian-livesync-couchdb-rescue-longhorn'
          - obsidian_adoption_volume.resources[0].spec.csi.driver == 'driver.longhorn.io'
          - obsidian_adoption_volume.resources[0].spec.csi.volumeHandle == obsidian_adoption_claim.resources[0].spec.volumeName

    - name: Remove only the Argo cascading finalizers from the observed Application
      vars:
        obsidian_livesync_finalizers: "{{ obsidian_livesync_existing_app.resources[0].metadata.finalizers | default([]) }}"
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: obsidian-livesync
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ obsidian_livesync_existing_app.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /metadata/finalizers
            value: "{{ obsidian_livesync_finalizers | difference(obsidian_livesync_cascading_finalizers) }}"
      when: obsidian_livesync_finalizers | intersect(obsidian_livesync_cascading_finalizers) | length > 0
