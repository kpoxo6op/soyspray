---
- name: Verify an isolated Immich Restic restore
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    recovery_check_id: ""
    recovery_namespace: "immich-recovery-{{ recovery_check_id }}"
    recovery_storage_size: 100Gi
    recovery_source_secret: immich-paired-backup
    recovery_snapshot_tag: restore-candidate
    recovery_snapshot_host: immich
    recovery_restic_image: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
    recovery_database_image: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16-v0.3.0
    recovery_server_image: ghcr.io/immich-app/immich-server:v2.3.1
    recovery_redis_image: bitnamilegacy/redis:8.2.1-debian-12-r0
    recovery_probe_image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
    recovery_labels:
      soyspray.vip/purpose: immich-restore-check
      soyspray.vip/app: immich
      soyspray.vip/check-id: "{{ recovery_check_id }}"
    recovery_source_db_host: immich-db-active.postgresql.svc.cluster.local
    recovery_source_db_name: immich
    recovery_source_db_user: immich

  tasks:
    - name: Require a scratch identifier and an isolated namespace
      ansible.builtin.assert:
        that:
          - recovery_check_id is match('^[a-z0-9][a-z0-9-]{0,23}$')
          - recovery_namespace != 'immich'
          - recovery_source_db_host == 'immich-db-active.postgresql.svc.cluster.local'
          - recovery_source_db_name == 'immich'
          - recovery_source_db_user == 'immich'
          - recovery_storage_size is match('^[1-9][0-9]*(Mi|Gi|Ti)$')
        fail_msg: Supply a short recovery_check_id and keep the source database values authoritative.

    - name: Read production resources before creating the scratch namespace
      kubernetes.core.k8s_info:
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
        kubeconfig: "{{ kubeconfig_path }}"
      loop:
        - {api: apps/v1, kind: Deployment, namespace: immich, name: immich-server}
        - {api: v1, kind: PersistentVolumeClaim, namespace: immich, name: immich-library}
        - {api: v1, kind: Service, namespace: postgresql, name: immich-db-active}
        - {api: postgresql.cnpg.io/v1, kind: Cluster, namespace: postgresql, name: immich-db}
      register: recovery_production_before
      no_log: true

    - name: Require the production identities and authoritative database service
      ansible.builtin.assert:
        that:
          - recovery_production_before.results | map(attribute='resources') | map('length') | list == [1, 1, 1, 1]
          - recovery_production_before.results[0].resources[0].metadata.name == 'immich-server'
          - recovery_production_before.results[1].resources[0].metadata.name == 'immich-library'
          - recovery_production_before.results[2].resources[0].spec.externalName == recovery_source_db_host
          - recovery_production_before.results[3].resources[0].metadata.name == 'immich-db'
          - recovery_production_before.results[3].resources[0].spec.imageName == recovery_database_image
        fail_msg: Production Immich identities or the authoritative database service changed.
      no_log: true

    - name: Read the paired backup Secret without exposing its values
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: immich
        name: "{{ recovery_source_secret }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: recovery_source_secret_result
      no_log: true

    - name: Require the paired Restic and database Secret contract
      ansible.builtin.assert:
        that:
          - recovery_source_secret_result.resources | length == 1
          - >-
            ['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_DEFAULT_REGION',
             'RESTIC_REPOSITORY', 'RESTIC_PASSWORD', 'PGHOST', 'PGPORT',
             'PGDATABASE', 'PGUSER', 'PGPASSWORD']
            | difference(recovery_source_secret_result.resources[0].data.keys() | list)
            | length == 0
          - recovery_source_secret_result.resources[0].data.PGHOST | b64decode == recovery_source_db_host
          - recovery_source_secret_result.resources[0].data.PGDATABASE | b64decode == recovery_source_db_name
          - recovery_source_secret_result.resources[0].data.PGUSER | b64decode == recovery_source_db_user
        fail_msg: The paired Restic Secret is missing required keys or has the wrong source database.
      no_log: true

    - name: Read the requested namespace before creation
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ recovery_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: recovery_existing_namespace

    - name: Require a new scratch namespace
      ansible.builtin.assert:
        that: recovery_existing_namespace.resources | length == 0
        fail_msg: The requested recovery namespace already exists. Choose a new recovery_check_id.

    - name: Build and verify the isolated restore workspace
      block:
        - name: Create the labeled scratch namespace
          kubernetes.core.k8s:
            state: present
            api_version: v1
            kind: Namespace
            name: "{{ recovery_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              metadata:
                labels: "{{ recovery_labels }}"
          when: not ansible_check_mode

        - name: Copy only the paired recovery inputs into the scratch namespace
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: immich-restore-inputs
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              type: Opaque
              data:
                AWS_ACCESS_KEY_ID: "{{ recovery_source_secret_result.resources[0].data.AWS_ACCESS_KEY_ID }}"
                AWS_SECRET_ACCESS_KEY: "{{ recovery_source_secret_result.resources[0].data.AWS_SECRET_ACCESS_KEY }}"
                AWS_DEFAULT_REGION: "{{ recovery_source_secret_result.resources[0].data.AWS_DEFAULT_REGION }}"
                RESTIC_REPOSITORY: "{{ recovery_source_secret_result.resources[0].data.RESTIC_REPOSITORY }}"
                RESTIC_PASSWORD: "{{ recovery_source_secret_result.resources[0].data.RESTIC_PASSWORD }}"
                PGUSER: "{{ recovery_source_secret_result.resources[0].data.PGUSER }}"
                PGPASSWORD: "{{ recovery_source_secret_result.resources[0].data.PGPASSWORD }}"
                PGDATABASE: "{{ recovery_source_secret_result.resources[0].data.PGDATABASE }}"
                DB_URL: >-
                  {{ ('postgresql://' ~
                      (recovery_source_secret_result.resources[0].data.PGUSER | b64decode | urlencode) ~ ':' ~
                      (recovery_source_secret_result.resources[0].data.PGPASSWORD | b64decode | urlencode) ~
                      '@immich-db-rw.' ~ recovery_namespace ~ '.svc.cluster.local:5432/immich') | b64encode }}
          no_log: true
          when: not ansible_check_mode

        - name: Create the isolated restored-data PVC
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: restored-data
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: longhorn
                resources:
                  requests:
                    storage: "{{ recovery_storage_size }}"
          when: not ansible_check_mode

        - name: Restore the newest completed tagged snapshot into the isolated PVC
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: restic-restore
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 7200
                ttlSecondsAfterFinished: 86400
                template:
                  metadata:
                    labels:
                      "{{ recovery_labels | combine({'soyspray.vip/component': 'restic-restore'}) }}"
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    containers:
                      - name: restic
                        image: "{{ recovery_restic_image }}"
                        command: [/bin/sh, -ec]
                        args:
                          - >-
                            set -eu;
                            candidates="$(restic snapshots --json --host {{ recovery_snapshot_host }} --tag {{ recovery_snapshot_tag }})";
                            snapshot="$(printf '%s' "$candidates" | jq -er 'map(select(
                            .hostname == "{{ recovery_snapshot_host }}" and
                            (.tags | index("{{ recovery_snapshot_tag }}")) != null))
                            | sort_by(.time) | .[-1] // error("no completed restore candidate")')";
                            id="$(printf '%s' "$snapshot" | jq -er '.id')";
                            printf '%s\n' "$id" > /restore/backup/snapshot-id;
                            printf '%s\n' "$snapshot" > /restore/backup/snapshot.json;
                            restic restore "$id" --target /restore;
                            test -s /restore/backup/database/immich.dump;
                            test -s /restore/backup/database/started-at;
                            for path in upload library profile; do test -d "/restore/usr/src/app/upload/$path"; done;
                            printf 'snapshot=%s\n' "$id"
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_ACCESS_KEY_ID}}
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_SECRET_ACCESS_KEY}}
                          - name: AWS_DEFAULT_REGION
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_DEFAULT_REGION}}
                          - name: RESTIC_REPOSITORY
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: RESTIC_REPOSITORY}}
                          - name: RESTIC_PASSWORD_FILE
                            value: /run/secrets/restic-password
                        volumeMounts:
                          - {name: restored-data, mountPath: /restore}
                          - {name: restic-password, mountPath: /run/secrets/restic-password/RESTIC_PASSWORD, subPath: RESTIC_PASSWORD, readOnly: true}
                    volumes:
                      - name: restored-data
                        persistentVolumeClaim: {claimName: restored-data}
                      - name: restic-password
                        secret:
                          secretName: immich-restore-inputs
                          items: [{key: RESTIC_PASSWORD, path: RESTIC_PASSWORD}]
          when: not ansible_check_mode

        - name: Wait for the Restic restore Job to complete
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            namespace: "{{ recovery_namespace }}"
            name: restic-restore
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_restic_job
          until:
            - recovery_restic_job.resources | length == 1
            - >-
              recovery_restic_job.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True')
              | list | length == 1
          retries: 360
          delay: 10
          when: not ansible_check_mode

        - name: Find the completed Restic restore pod
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ recovery_namespace }}"
            label_selectors: [job-name=restic-restore]
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_restic_pods
          when: not ansible_check_mode

        - name: Record the selected recovery point without secret output
          kubernetes.core.k8s_log:
            namespace: "{{ recovery_namespace }}"
            name: "{{ recovery_restic_pods.resources[0].metadata.name }}"
            container: restic
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_restic_log
          no_log: true
          when: not ansible_check_mode

        - name: Verify every Restic file hash against the restored PVC
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: restic-verify
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 14400
                ttlSecondsAfterFinished: 86400
                template:
                  metadata:
                    labels:
                      "{{ recovery_labels | combine({'soyspray.vip/component': 'restic-verify'}) }}"
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    containers:
                      - name: verify
                        image: "{{ recovery_restic_image }}"
                        command: [/bin/sh, -ec]
                        args:
                          - >-
                            set -eu;
                            id="$(cat /restore/backup/snapshot-id)";
                            restic snapshots --json --host {{ recovery_snapshot_host }} --tag {{ recovery_snapshot_tag }} |
                            jq -e --arg id "$id" 'map(select(
                            .id == $id and .hostname == "{{ recovery_snapshot_host }}" and
                            (.tags | index("{{ recovery_snapshot_tag }}")) != null)) | length == 1' >/dev/null;
                            restic ls --json "$id" > /tmp/files.json;
                            count=0;
                            for encoded in $(jq -r '.[] | select(.struct_type == "node" and .type == "file") | .path | @base64' /tmp/files.json); do
                              path="$(printf '%s' "$encoded" | base64 -d)";
                              test -f "/restore$path";
                              expected="$(restic dump "$id" "$path" | sha256sum | cut -d' ' -f1)";
                              actual="$(sha256sum "/restore$path" | cut -d' ' -f1)";
                              test "$expected" = "$actual";
                              count=$((count + 1));
                            done;
                            test "$count" -gt 0;
                            printf 'verified_files=%s\n' "$count"
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_ACCESS_KEY_ID}}
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_SECRET_ACCESS_KEY}}
                          - name: AWS_DEFAULT_REGION
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: AWS_DEFAULT_REGION}}
                          - name: RESTIC_REPOSITORY
                            valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: RESTIC_REPOSITORY}}
                          - name: RESTIC_PASSWORD_FILE
                            value: /run/secrets/restic-password
                        volumeMounts:
                          - {name: restored-data, mountPath: /restore, readOnly: true}
                          - {name: restic-password, mountPath: /run/secrets/restic-password/RESTIC_PASSWORD, subPath: RESTIC_PASSWORD, readOnly: true}
                    volumes:
                      - name: restored-data
                        persistentVolumeClaim: {claimName: restored-data}
                      - name: restic-password
                        secret:
                          secretName: immich-restore-inputs
                          items: [{key: RESTIC_PASSWORD, path: RESTIC_PASSWORD}]
          when: not ansible_check_mode

        - name: Wait for all Restic file hashes to verify
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            namespace: "{{ recovery_namespace }}"
            name: restic-verify
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_restic_verify
          until:
            - recovery_restic_verify.resources | length == 1
            - >-
              recovery_restic_verify.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True')
              | list | length == 1
          retries: 1440
          delay: 10
          when: not ansible_check_mode

        - name: Create the isolated database credentials
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: immich-db-credentials
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              type: kubernetes.io/basic-auth
              data:
                username: "{{ recovery_source_secret_result.resources[0].data.PGUSER }}"
                password: "{{ recovery_source_secret_result.resources[0].data.PGPASSWORD }}"
          no_log: true
          when: not ansible_check_mode

        - name: Create the isolated CNPG database with the production image
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: immich-db
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                instances: 1
                imageName: "{{ recovery_database_image }}"
                storage:
                  size: 20Gi
                  storageClass: longhorn
                bootstrap:
                  initdb:
                    database: immich
                    owner: immich
                    secret:
                      name: immich-db-credentials
                postgresql:
                  shared_preload_libraries: [vectors.so]
          when: not ansible_check_mode

        - name: Wait for the isolated CNPG database
          kubernetes.core.k8s_info:
            api_version: postgresql.cnpg.io/v1
            kind: Cluster
            namespace: "{{ recovery_namespace }}"
            name: immich-db
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_database
          until:
            - recovery_database.resources | length == 1
            - recovery_database.resources[0].status.readyInstances | default(0) | int == 1
          retries: 180
          delay: 10
          when: not ansible_check_mode

        - name: Restore and compare database content from the dump
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: database-restore
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 7200
                ttlSecondsAfterFinished: 86400
                template:
                  metadata:
                    labels:
                      "{{ recovery_labels | combine({'soyspray.vip/component': 'database-restore'}) }}"
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    containers:
                      - name: restore
                        image: "{{ recovery_database_image }}"
                        command: [/bin/sh, -ec]
                        args:
                          - >-
                            set -eu;
                            export PGHOST=immich-db-rw PGPORT=5432 PGUSER=immich PGPASSWORD="$(cat /run/secrets/db-password)";
                            until pg_isready -d postgres; do sleep 2; done;
                            psql -v ON_ERROR_STOP=1 -d postgres -c 'DROP DATABASE IF EXISTS immich_snapshot';
                            psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE immich_snapshot OWNER immich';
                            pg_restore --exit-on-error --clean --if-exists --no-owner --no-acl --dbname=immich /restore/backup/database/immich.dump;
                            pg_restore --exit-on-error --clean --if-exists --no-owner --no-acl \
                              --dbname=immich_snapshot /restore/backup/database/immich.dump;
                            for database in immich immich_snapshot; do
                              for table in asset album album_asset; do
                                sql="SELECT '$table', count(*), md5(coalesce(string_agg(";
                                sql="$sql row_to_json(row)::text, E'\\n' ORDER BY row_to_json(row)::text), ''))";
                                sql="$sql FROM public.\"$table\" row";
                                psql -At -v ON_ERROR_STOP=1 -d "$database" -c "$sql";
                              done;
                              sql="SELECT 'user', count(*), md5(coalesce(string_agg(";
                              sql="$sql row_to_json(row)::text, E'\\n' ORDER BY row_to_json(row)::text), ''))";
                              sql="$sql FROM public.\"user\" row";
                              psql -At -v ON_ERROR_STOP=1 -d "$database" -c "$sql";
                            done > /tmp/database-content.txt;
                            diff -u <(sed -n '1,4p' /tmp/database-content.txt | sort) <(sed -n '5,8p' /tmp/database-content.txt | sort);
                            cat /tmp/database-content.txt
                        volumeMounts:
                          - {name: restored-data, mountPath: /restore, readOnly: true}
                          - {name: db-password, mountPath: /run/secrets/db-password, subPath: password, readOnly: true}
                        env: [{name: PGDATABASE, value: postgres}]
                    volumes:
                      - name: restored-data
                        persistentVolumeClaim: {claimName: restored-data}
                      - name: db-password
                        secret:
                          secretName: immich-db-credentials
                          items: [{key: password, path: password}]
          when: not ansible_check_mode

        - name: Wait for database restore and content comparison
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            namespace: "{{ recovery_namespace }}"
            name: database-restore
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_database_restore
          until:
            - recovery_database_restore.resources | length == 1
            - >-
              recovery_database_restore.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True')
              | list | length == 1
          retries: 360
          delay: 10
          when: not ansible_check_mode

        - name: Create isolated Redis
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: redis
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels | combine({'app': 'immich-recovery-redis'}) }}"
              spec:
                automountServiceAccountToken: false
                restartPolicy: Always
                containers:
                  - name: redis
                    image: "{{ recovery_redis_image }}"
                    env: [{name: ALLOW_EMPTY_PASSWORD, value: 'yes'}]
                    ports: [{name: redis, containerPort: 6379}]
          when: not ansible_check_mode

        - name: Create the isolated Redis Service
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: redis
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                type: ClusterIP
                selector: {app: immich-recovery-redis}
                ports: [{name: redis, port: 6379, targetPort: redis}]
          when: not ansible_check_mode

        - name: Create the isolated Immich server and internal Service
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: immich-server
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels | combine({'app': 'immich-recovery-server'}) }}"
              spec:
                automountServiceAccountToken: false
                restartPolicy: Always
                containers:
                  - name: immich-server
                    image: "{{ recovery_server_image }}"
                    env:
                      - {name: DB_URL, valueFrom: {secretKeyRef: {name: immich-restore-inputs, key: DB_URL}}}
                      - {name: DB_VECTOR_EXTENSION, value: pgvecto.rs}
                      - {name: REDIS_HOSTNAME, value: redis}
                      - {name: REDIS_PORT, value: '6379'}
                      - {name: IMMICH_MACHINE_LEARNING_URL, value: ''}
                      - {name: IMMICH_HOST, value: 0.0.0.0}
                      - {name: IMMICH_PORT, value: '2283'}
                    ports: [{name: http, containerPort: 2283}]
                    readinessProbe:
                      httpGet: {path: /api/server/ping, port: http}
                      initialDelaySeconds: 20
                      periodSeconds: 10
                    volumeMounts: [{name: restored-data, mountPath: /usr/src/app/upload}]
                volumes:
                  - name: restored-data
                    persistentVolumeClaim: {claimName: restored-data}
          no_log: true
          when: not ansible_check_mode

        - name: Create only an internal ClusterIP Service for Immich
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: immich-server
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                type: ClusterIP
                selector: {app: immich-recovery-server}
                ports: [{name: http, port: 2283, targetPort: http}]
          when: not ansible_check_mode

        - name: Deny external ingress to the scratch namespace
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: isolated-ingress
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                podSelector: {}
                policyTypes: [Ingress]
                ingress:
                  - from: [{podSelector: {}}]
          when: not ansible_check_mode

        - name: Wait for the isolated Immich server health probe
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ recovery_namespace }}"
            name: immich-server
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_server
          until:
            - recovery_server.resources | length == 1
            - recovery_server.resources[0].status.phase | default('') == 'Running'
            - recovery_server.resources[0].status.containerStatuses[0].ready | default(false)
          retries: 180
          delay: 10
          when: not ansible_check_mode

        - name: Run internal Immich ping and version requests
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: app-health
                namespace: "{{ recovery_namespace }}"
                labels: "{{ recovery_labels }}"
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                ttlSecondsAfterFinished: 86400
                template:
                  metadata:
                    labels:
                      "{{ recovery_labels | combine({'soyspray.vip/component': 'app-health'}) }}"
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    containers:
                      - name: curl
                        image: "{{ recovery_probe_image }}"
                        command: [/bin/sh, -ec]
                        args:
                          - >-
                            set -eu;
                            ping="$(curl --fail --silent --show-error http://immich-server:2283/api/server/ping)";
                            printf '%s' "$ping" | grep -F '"res":"pong"';
                            curl --fail --silent --show-error http://immich-server:2283/api/server/version
          when: not ansible_check_mode

        - name: Wait for the internal application checks
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            namespace: "{{ recovery_namespace }}"
            name: app-health
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_app_health
          until:
            - recovery_app_health.resources | length == 1
            - >-
              recovery_app_health.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True')
              | list | length == 1
          retries: 30
          delay: 10
          when: not ansible_check_mode

        - name: Re-read production identities after the isolated restore
          kubernetes.core.k8s_info:
            api_version: "{{ item.api }}"
            kind: "{{ item.kind }}"
            namespace: "{{ item.namespace }}"
            name: "{{ item.name }}"
            kubeconfig: "{{ kubeconfig_path }}"
          loop:
            - {api: apps/v1, kind: Deployment, namespace: immich, name: immich-server}
            - {api: v1, kind: PersistentVolumeClaim, namespace: immich, name: immich-library}
            - {api: v1, kind: Service, namespace: postgresql, name: immich-db-active}
            - {api: postgresql.cnpg.io/v1, kind: Cluster, namespace: postgresql, name: immich-db}
          register: recovery_production_after
          no_log: true
          when: not ansible_check_mode

        - name: Require unchanged production resource identities
          ansible.builtin.assert:
            that:
              - recovery_production_after.results | map(attribute='resources') | map('length') | list == [1, 1, 1, 1]
              - recovery_production_after.results[0].resources[0].metadata.uid == recovery_production_before.results[0].resources[0].metadata.uid
              - recovery_production_after.results[1].resources[0].metadata.uid == recovery_production_before.results[1].resources[0].metadata.uid
              - >-
                recovery_production_after.results[1].resources[0].spec.volumeName ==
                recovery_production_before.results[1].resources[0].spec.volumeName
              - recovery_production_after.results[2].resources[0].metadata.uid == recovery_production_before.results[2].resources[0].metadata.uid
              - recovery_production_after.results[2].resources[0].spec.externalName == recovery_source_db_host
              - recovery_production_after.results[3].resources[0].metadata.uid == recovery_production_before.results[3].resources[0].metadata.uid
              - recovery_production_after.results[3].resources[0].spec.imageName == recovery_database_image
            fail_msg: Production resource identity changed during the isolated restore.
          no_log: true
          when: not ansible_check_mode

        - name: Report the isolated Immich restore
          ansible.builtin.debug:
            msg:
              namespace: "{{ recovery_namespace }}"
              snapshot: "{{ recovery_restic_log.stdout | default('unknown - check mode') }}"
              database: verified_from_immich_dump
              files: verified_with_restic_sha256
              application: verified_by_internal_ping_and_version
              production_identity: unchanged
          when: not ansible_check_mode

      rescue:
        - name: Read the failed restore namespace for guarded cleanup
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ recovery_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
          register: recovery_failed_namespace

        - name: Require ownership labels before failed restore cleanup
          ansible.builtin.assert:
            that:
              - recovery_failed_namespace.resources | length == 0
                or recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/purpose'] == 'immich-restore-check'
              - recovery_failed_namespace.resources | length == 0
                or recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/app'] == 'immich'
              - recovery_failed_namespace.resources | length == 0
                or recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/check-id'] == recovery_check_id
            fail_msg: Refusing cleanup because the namespace ownership labels do not match.

        - name: Delete the failed restore namespace with its UID precondition
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ recovery_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
            delete_options:
              preconditions:
                uid: "{{ recovery_failed_namespace.resources[0].metadata.uid }}"
            wait: true
            wait_timeout: 300
          when:
            - recovery_failed_namespace.resources | length == 1
            - recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/purpose'] == 'immich-restore-check'
            - recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/app'] == 'immich'
            - recovery_failed_namespace.resources[0].metadata.labels['soyspray.vip/check-id'] == recovery_check_id

        - name: Fail after guarded cleanup
          ansible.builtin.fail:
            msg: The isolated Immich restore failed. The owned scratch namespace was removed.
