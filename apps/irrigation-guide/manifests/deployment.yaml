apiVersion: apps/v1
kind: Deployment
metadata:
  name: irrigation-guide
  labels:
    app.kubernetes.io/name: irrigation-guide
    app.kubernetes.io/part-of: irrigation-guide
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: irrigation-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: irrigation-guide
        app.kubernetes.io/part-of: irrigation-guide
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:ee7b7bc02a4af72c98d4365151f92d9b380c482c48d8c84bbbe44bd3192ba463
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /irrigation/index.html
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /irrigation/index.html
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /irrigation/index.html
            port: http
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: edition
          mountPath: /usr/share/nginx/html/irrigation
          subPath: release-06
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      - name: edition
        persistentVolumeClaim:
          claimName: irrigation-guide
          readOnly: true
