apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: irrigation-guide
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: irrigation-guide
    soyspray.vip/owner: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    soyspray.vip/access-url: https://explain.soyspray.vip/irrigation/
    soyspray.vip/access-method: Private Tailscale split DNS and LAN ingress; no public DNS or tunnel
    soyspray.vip/data: Rebuildable private static guide edition
    soyspray.vip/backup: not-required
    soyspray.vip/backup-cause: Edition is reproduced from the private controller-side source and verified manifest.
spec:
  project: irrigation-guide
  source:
    repoURL: https://github.com/kpoxo6op/soyspray.git
    targetRevision: main
    path: apps/irrigation-guide/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: irrigation-guide
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: irrigation-guide
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
