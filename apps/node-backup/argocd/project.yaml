apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: node-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Back up explicit node-local application data.
  sourceRepos:
  - https://github.com/kpoxo6op/soyspray.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: media
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: batch
    kind: CronJob
