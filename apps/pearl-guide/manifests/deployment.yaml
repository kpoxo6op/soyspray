apiVersion: apps/v1
kind: Deployment
metadata:
  name: pearl-guide
  labels:
    app.kubernetes.io/name: pearl-guide
    app.kubernetes.io/part-of: pearl-guide
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pearl-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pearl-guide
        app.kubernetes.io/part-of: pearl-guide
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/kpoxo6op/pearl-guide@sha256:ab5825c740ca7a8b54d1573c2fafea3c3259b842ad5137e7bd7727605abf499e
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
