apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pearl-guide
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pearl-guide
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
