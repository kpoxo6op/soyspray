# Assets carry a content revision (?v=<hash>, written by app/build.mjs), so a revisioned URL never changes
# and browsers may keep it for good. Everything else, the page above all, is revalidated on every visit.
map $arg_v $asset_cache {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The Dockerfile stores a .gz beside every compressible file; nginx sends that file instead of compressing per request.
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;

    add_header Cache-Control $asset_cache;

    # pearl.soyspray.vip moved to explain.soyspray.vip/pearl/ for good (15 Nov 2026). Ticks are stored per site, so
    # the page itself answers with moved.html, which carries this browser's ticks across; every other path redirects.
    if ($host = pearl.soyspray.vip) {
        rewrite ^/(index\.html)?$ /moved.html last;
        rewrite ^/pearl(/.*)?$ https://explain.soyspray.vip/pearl$1 permanent;
        return 301 https://explain.soyspray.vip/pearl$request_uri;
    }

    # explain.soyspray.vip/pearl/ routes here too (manifests/ingress-explain.yaml). Strip the prefix and serve the
    # same files; the page loads its assets by relative URLs, so they stay under the prefix. A relative Location
    # keeps the browser on the host and scheme it asked for.
    absolute_redirect off;
    rewrite ^/pearl$ /pearl/ permanent;
    rewrite ^/pearl/(.*)$ /$1 last;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /moved.html {
        add_header Cache-Control "no-cache";
    }

    location /files/ {
        add_header Cache-Control $asset_cache;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri =404;
    }
}
