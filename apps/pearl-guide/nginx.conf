# Static Pearl guide. The page is always revalidated; its scripts, styles and models carry content revisions.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /files/ {
        add_header Content-Disposition "attachment";
    }
    location / {
        try_files $uri =404;
    }
}
