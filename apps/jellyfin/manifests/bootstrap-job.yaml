apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python, /bootstrap/bootstrap.py]
          envFrom: [{secretRef: {name: jellyfin-secrets}}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: bootstrap, mountPath: /bootstrap, readOnly: true}]
      volumes: [{name: bootstrap, configMap: {name: jellyfin-bootstrap}}]
