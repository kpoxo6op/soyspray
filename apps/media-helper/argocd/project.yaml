apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: media-helper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Publish the internal media channel catalog and guide.
  sourceRepos:
  - https://github.com/kpoxo6op/soyspray.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: media
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  - group: ''
    kind: ConfigMap
  - group: networking.k8s.io
    kind: NetworkPolicy
