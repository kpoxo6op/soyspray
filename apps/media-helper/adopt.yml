---
- name: Prepare the existing media helper Application for native adoption
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    media_helper_cascading_finalizers:
      - resources-finalizer.argocd.argoproj.io
      - resources-finalizer.argocd.argoproj.io/background
  tasks:
    - name: Read the existing Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: media-helper
        kubeconfig: "{{ kubeconfig_path }}"
      register: media_helper_existing_app

    - name: Require the known source and ownership before removing cascading deletion
      vars:
        media_helper_legacy_spec: >-
          {{ (lookup('file', playbook_dir + '/../../playbooks/argocd/applications/media/' +
              'media-helper/media-helper-application.yaml') | from_yaml).spec }}
        media_helper_native_spec: "{{ (lookup('file', playbook_dir + '/argocd/application.yaml') | from_yaml).spec }}"
      ansible.builtin.assert:
        that:
          - media_helper_existing_app.resources | length == 1
          - media_helper_existing_app.resources[0].spec in [media_helper_legacy_spec, media_helper_native_spec]
          - media_helper_existing_app.resources[0].metadata.deletionTimestamp is not defined
          - >-
            media_helper_existing_app.resources[0].status.operationState.phase | default('')
            not in ['Running', 'Terminating']

    - name: Remove only the Argo cascading finalizers from the observed Application
      vars:
        media_helper_finalizers: "{{ media_helper_existing_app.resources[0].metadata.finalizers | default([]) }}"
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: media-helper
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ media_helper_existing_app.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /metadata/finalizers
            value: "{{ media_helper_finalizers | difference(media_helper_cascading_finalizers) }}"
      when: media_helper_finalizers | intersect(media_helper_cascading_finalizers) | length > 0
