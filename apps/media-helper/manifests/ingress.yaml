# LAN and Tailscale devices, such as the living-room TV's home screen, read the
# channel list and guide here. Only these two read-only paths are exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-helper
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.20.0/24,100.64.0.0/10,10.233.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts: [guide.soyspray.vip]
      secretName: prod-cert-tls
  rules:
    - host: guide.soyspray.vip
      http:
        paths:
          - path: /xmltv.xml
            pathType: Exact
            backend: {service: {name: media-helper, port: {number: 8080}}}
          - path: /api/v1/channels
            pathType: Exact
            backend: {service: {name: media-helper, port: {number: 8080}}}
