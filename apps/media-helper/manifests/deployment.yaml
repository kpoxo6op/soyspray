apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-helper
  template:
    metadata:
      labels:
        app: media-helper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: media-helper
        image: ghcr.io/kpoxo6op/media-helper@sha256:dbe9a20d6ac91f469c6393dc512d0f6af4dd3c1a67e6eba619b8b03ed064749f
        env:
        - name: MEDIA_HELPER_URL
          value: http://media-helper.media.svc.cluster.local:8080
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
