apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-helper
  template:
    metadata:
      labels:
        app: media-helper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-helper
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python, /app/app.py]
          env:
            - name: MEDIA_HELPER_URL
              value: http://media-helper.media.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap:
            name: media-helper-code
            items:
              - {key: app.py, path: app.py}
              - {key: channels.json, path: channels.json}
        - name: tmp
          emptyDir: {}
