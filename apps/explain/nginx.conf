# The catalog page at explain.soyspray.vip/. /pearl/ and /assembly/ are routed by the ingress straight to the
# guides' own services, so this server only ever sees the catalog's three files.
map $arg_v $asset_cache {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;
    gzip_proxied any;
    gzip_vary on;

    add_header Cache-Control $asset_cache;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri =404;
    }
}
