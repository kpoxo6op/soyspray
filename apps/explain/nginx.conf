# The catalog at explain.soyspray.vip/ and the network explainer at /network/, both built into this image.
# /pearl/ and /assembly/ are routed by the ingress straight to the guides' own services.
map $arg_v $asset_cache {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;
    gzip_proxied any;
    gzip_vary on;

    add_header Cache-Control $asset_cache;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    absolute_redirect off;
    location = /network {
        return 301 /network/$is_args$args;
    }

    location = /network/ {
        add_header Cache-Control "no-cache";
        try_files /network/index.html =404;
    }

    location = /network/index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri =404;
    }
}
