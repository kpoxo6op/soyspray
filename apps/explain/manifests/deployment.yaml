apiVersion: apps/v1
kind: Deployment
metadata:
  name: explain
  labels:
    app.kubernetes.io/name: explain
    app.kubernetes.io/part-of: explain
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: explain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explain
        app.kubernetes.io/part-of: explain
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/kpoxo6op/explain@sha256:eaf0daa1f96f9d4be0a7dffb11c8fdb3cd13eba1030a6594072db345f3b9f497
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html
            port: http
          periodSeconds: 15
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
