---
- name: Read the existing bootstrap Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ bootstrap_secret_namespace }}"
    name: "{{ bootstrap_secret_name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: bootstrap_secret_existing
  no_log: true

- name: Check whether the existing or supplied identity can be used
  ansible.builtin.set_fact:
    bootstrap_secret_identity_available: >-
      {{ (bootstrap_secret_input | default('') is string) and
         ((bootstrap_secret_existing.resources | length == 1 and
           bootstrap_secret_existing.resources[0].data[bootstrap_secret_key] | default('') | length > 0) or
          (bootstrap_secret_existing.resources | length == 0 and
           bootstrap_secret_input | default('') | trim | length > 0)) }}
    bootstrap_secret_identity_matches: >-
      {{ bootstrap_secret_existing.resources | length == 0 or
         bootstrap_secret_input | default('') == '' or
         bootstrap_secret_input ==
         (bootstrap_secret_existing.resources[0].data[bootstrap_secret_key] | default('') | b64decode) }}
  no_log: true

- name: Require an existing identity or an encrypted bootstrap input
  ansible.builtin.assert:
    that: bootstrap_secret_identity_available | bool
    fail_msg: "{{ bootstrap_secret_available_fail_msg }}"

- name: Keep the existing bootstrap identity unchanged
  ansible.builtin.assert:
    that: bootstrap_secret_identity_matches | bool
    fail_msg: "{{ bootstrap_secret_matches_fail_msg }}"

- name: Apply the declared namespace for a missing identity
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition: "{{ lookup('file', bootstrap_secret_namespace_file) | from_yaml }}"
  when: bootstrap_secret_existing.resources | length == 0

- name: Create only the missing bootstrap Secret
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubeconfig_path }}", create, -f, '-']
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ bootstrap_secret_name }}
        namespace: {{ bootstrap_secret_namespace }}
      type: Opaque
      stringData:
        {{ bootstrap_secret_key }}: {{ bootstrap_secret_input | to_json }}
  changed_when: true
  no_log: true
  when: bootstrap_secret_existing.resources | length == 0 and not ansible_check_mode
