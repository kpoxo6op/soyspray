<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="История общей доступности участников." />
    <title>История доступности</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/events.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Главная страница поездки">boys.soyspray.vip</a>
        <p>Планы нашей компании</p>
      </header>

      <section class="event-layout" aria-labelledby="event-title">
        <header class="event-intro">
          <div>
            <h1 id="event-title">История доступности</h1>
            <p>Сначала новые записи.</p>
          </div>
          <a class="button button-primary" href="/">К поездке</a>
        </header>

        <p id="event-error" class="form-error" role="alert"></p>
        <p id="event-empty" class="event-empty" hidden>Записей пока нет.</p>
        <ol id="event-list" class="event-list"></ol>
      </section>
    </main>
  </body>
</html>
