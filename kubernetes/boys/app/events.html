<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recent boys calendar activity." />
    <title>Event log · Boys calendar</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/events.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Boys calendar home">boys.soyspray.vip</a>
        <p>Auckland · Australia</p>
      </header>

      <section class="event-layout" aria-labelledby="event-title">
        <header class="event-intro">
          <div>
            <h1 id="event-title">Event log</h1>
            <p>Newest first.</p>
          </div>
          <a class="button button-primary" href="/">Back to calendar</a>
        </header>

        <p id="event-error" class="form-error" role="alert"></p>
        <p id="event-empty" class="event-empty" hidden>No events yet.</p>
        <ol id="event-list" class="event-list"></ol>
      </section>
    </main>
  </body>
</html>
