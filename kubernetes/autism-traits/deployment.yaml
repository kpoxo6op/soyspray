apiVersion: apps/v1
kind: Deployment
metadata:
  name: autism-traits
  labels:
    app.kubernetes.io/name: autism-traits
    app.kubernetes.io/part-of: autism-traits
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: autism-traits
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autism-traits
        app.kubernetes.io/part-of: autism-traits
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:ee7b7bc02a4af72c98d4365151f92d9b380c482c48d8c84bbbe44bd3192ba463
          imagePullPolicy: IfNotPresent
          command:
            - nginx
          args:
            - -c
            - /config/nginx.conf
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
            - name: nginx-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: autism-traits-site-core
                  items:
                    - {key: index.html, path: index.html}
                    - {key: app.js, path: assets/app.js}
                    - {key: app.css, path: assets/app.css}
              - configMap:
                  name: autism-traits-site-images-a
                  items:
                    - {key: bamboo-window.webp, path: images/bamboo-window.webp}
                    - {key: moonrise.webp, path: images/moonrise.webp}
                    - {key: wheat-field.webp, path: images/wheat-field.webp}
              - configMap:
                  name: autism-traits-site-images-b
                  items:
                    - {key: hokusai-wave.webp, path: images/hokusai-wave.webp}
                    - {key: irises.webp, path: images/irises.webp}
              - configMap:
                  name: autism-traits-site-images-c
                  items:
                    - {key: calm-sea.webp, path: images/calm-sea.webp}
                    - {key: old-trees.webp, path: images/old-trees.webp}
                    - {key: oxbow.webp, path: images/oxbow.webp}
              - configMap:
                  name: autism-traits-site-images-d
                  items:
                    - {key: le-gray-wave.webp, path: images/le-gray-wave.webp}
                    - {key: water-pitcher.webp, path: images/water-pitcher.webp}
        - name: nginx-config
          configMap:
            name: autism-traits-nginx
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
