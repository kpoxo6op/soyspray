name: Configure public Docker Hub cache
description: Use the public Google cache on an ephemeral hosted runner, keeping pinned image identities.

runs:
  using: composite
  steps:
    - name: Configure and verify the public cache before running containers
      shell: bash
      run: |
        docker logout >/dev/null
        sudo python3 - <<'PYTHON'
        import json
        from pathlib import Path
        path = Path('/etc/docker/daemon.json')
        config = json.loads(path.read_text()) if path.exists() else {}
        mirror = 'https://mirror.gcr.io'
        config['registry-mirrors'] = [mirror, *[
            value for value in config.get('registry-mirrors', []) if value != mirror
        ]]
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps(config) + '\n')
        PYTHON
        sudo systemctl restart docker
        docker info --format '{{json .RegistryConfig.Mirrors}}' | python3 -c \
          'import json,sys; assert any(x.rstrip("/") == "https://mirror.gcr.io" for x in json.load(sys.stdin))'
