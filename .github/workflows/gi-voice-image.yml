name: GI conversation image

on:
  pull_request:
    paths:
      - apps/voice-assistant/intent-agent/**
      - .github/workflows/gi-voice-image.yml
  push:
    branches: [main]
    paths:
      - apps/voice-assistant/intent-agent/**
      - .github/workflows/gi-voice-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kpoxo6op/gi-voice
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14.2
      - name: Verify the HA conversation and installer boundaries
        run: |
          python -m pip install -r apps/voice-assistant/intent-agent/requirements-tests.txt
          python -m pytest -c apps/voice-assistant/intent-agent/pytest.ini \
            -q apps/voice-assistant/intent-agent/tests
      - uses: ./.github/actions/docker-hub-cache
      - name: Build and test the offline component installer
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/voice-assistant/intent-agent
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /config:mode=700 "$IMAGE:$IMAGE_TAG"
      - name: Publish the tested source image without deploying it
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'Tested image: `%s`\nPromote through a separate reviewed PR.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$digest" > image-digest.txt
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: gi-voice-image-digest
          path: image-digest.txt
