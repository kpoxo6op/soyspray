name: Domain health image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a tested image and open a draft promotion from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: domain-health-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/domain-health
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/domain-health
      - name: Check the packaged runtime without external network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --env DOMAIN_HEALTH_SOURCE=/app/domain-health-exporter.py \
            --mount "type=bind,source=$PWD/apps/domain-health/tests/test_domain_health_runtime.py,target=/checks/test_runtime.py,readonly" \
            --entrypoint python3 "$IMAGE:$IMAGE_TAG" /checks/test_runtime.py
      - name: Check the real entrypoint with disposable inputs
        run: |
          docker run --detach --name domain-health-image-check --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --env DOMAIN_NAME=example.test --env CLOUDFLARE_API_TOKEN=synthetic \
            --env HEALTHCHECKS_PING_URL=https://healthchecks.example/test \
            --env EXPECTED_NAMESERVERS=a.ns.example,b.ns.example "$IMAGE:$IMAGE_TAG"
          docker exec -i domain-health-image-check python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          assert os.geteuid() == 1000
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=2) as response:
                      assert response.status == 200
                  break
              except urllib.error.URLError:
                  if attempt == 29: raise
                  time.sleep(1)
          try:
              urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
              raise AssertionError('No external check can succeed on the isolated network.')
          except urllib.error.HTTPError as error:
              assert error.code == 503
          print('The unprivileged entrypoint serves metrics and reports unavailable upstream checks.')
          PY
      - name: Remove the isolated test container
        if: always()
        run: docker rm --force domain-health-image-check || true
      - name: Publish and open the separate promotion when requested
        uses: ./.github/actions/publish-image-promotion
        with:
          publish: ${{ inputs.publish }}
          app-slug: domain-health
          app-name: domain health
          image: ${{ env.IMAGE }}
          image-tag: ${{ env.IMAGE_TAG }}
          runtime-paths: apps/domain-health/app apps/domain-health/Dockerfile apps/domain-health/.dockerignore
          manifest: apps/domain-health/manifests/deployment.yaml
          commit-subject: Promote the tested domain health runtime image
          promotion-title: Promote the tested domain health runtime image
          evidence: The image passed standard-library runtime and entrypoint checks with no external network, an unprivileged user, a read-only filesystem, and no capabilities. Promotion changes only the image digest and preserves provider identities, workload names, probes, restrictions, and metrics.
          verification: Run `make go`, then verify provider results and the Prometheus scrape before merge.
