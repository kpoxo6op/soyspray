name: Pearl guide image

on:
  push:
    branches: [main]
    paths:
      - apps/pearl-guide/**
      - .github/workflows/pearl-guide-image.yml
  pull_request:
    paths:
      - apps/pearl-guide/**
      - .github/workflows/pearl-guide-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearl-guide-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/pearl-guide
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Build and test the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/pearl-guide
      - name: Check the real HTTP entrypoint
        run: |
          docker run --detach --name pearl-guide-check --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=16m,uid=101,gid=101 \
            -p 127.0.0.1:4173:8080 "$IMAGE:$IMAGE_TAG"
          trap 'docker logs pearl-guide-check' ERR
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            -o "$RUNNER_TEMP/pearl-index.html" http://127.0.0.1:4173/
          grep -q '<title>Pearl' "$RUNNER_TEMP/pearl-index.html"
          for path in app.js app.css pearl.svg data/pearl.glb data/prints.glb data/bench.glb \
            draco/draco_decoder.wasm draco/draco_wasm_wrapper.js files/pearl_v3_1_shell.stl; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4173/$path"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/missing)" = 404
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/pearl-index.html" | head -1)"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/pearl-app.headers" \
            --output /dev/null "http://127.0.0.1:4173/$script"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/pearl-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/pearl-app.headers"
          for path in data/pearl.glb draco/draco_decoder.wasm files/pearl_v3_1_shell.stl; do
            curl --fail --silent --header 'Accept-Encoding: gzip' \
              --dump-header "$RUNNER_TEMP/pearl-asset.headers" \
              --output /dev/null "http://127.0.0.1:4173/$path"
            grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/pearl-asset.headers"
          done
          grep -qi '^content-disposition: attachment' "$RUNNER_TEMP/pearl-asset.headers"
          curl --fail --silent --dump-header "$RUNNER_TEMP/pearl-index.headers" \
            --output /dev/null http://127.0.0.1:4173/
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/pearl-index.headers"
      - name: Check the guide under explain.soyspray.vip/pearl/
        run: |
          base=http://127.0.0.1:4173
          curl --silent --dump-header "$RUNNER_TEMP/pearl-prefix.headers" --output /dev/null "$base/pearl"
          grep -qi '^HTTP/1.1 301' "$RUNNER_TEMP/pearl-prefix.headers"
          grep -qi '^location: /pearl/\s*$' "$RUNNER_TEMP/pearl-prefix.headers"
          curl --fail --silent --output "$RUNNER_TEMP/pearl-prefix.html" "$base/pearl/"
          cmp "$RUNNER_TEMP/pearl-prefix.html" <(curl --fail --silent "$base/")
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/pearl-prefix.html" | head -1)"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/pearl-prefix-app.headers" --output /dev/null "$base/pearl/$script"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/pearl-prefix-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/pearl-prefix-app.headers"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/pearl/missing")" = 404
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/pearl-prefix-file.headers" --output /dev/null "$base/pearl/files/pearl_v3_1_shell.stl"
          grep -qi '^content-disposition: attachment' "$RUNNER_TEMP/pearl-prefix-file.headers"
          curl --fail --silent --output /dev/null "$base/pearl/data/pearl.glb"
      - name: Check the soldering page under explain.soyspray.vip/soldering/
        run: |
          base=http://127.0.0.1:4173
          host=(--header 'Host: explain.soyspray.vip')
          curl --silent "${host[@]}" --dump-header "$RUNNER_TEMP/solder-prefix.headers" --output /dev/null "$base/soldering"
          grep -qi '^HTTP/1.1 301' "$RUNNER_TEMP/solder-prefix.headers"
          grep -qi '^location: /soldering/\s*$' "$RUNNER_TEMP/solder-prefix.headers"
          curl --fail --silent "${host[@]}" --dump-header "$RUNNER_TEMP/solder-index.headers" \
            --output "$RUNNER_TEMP/solder-index.html" "$base/soldering/"
          grep -qi '^HTTP/1.1 200' "$RUNNER_TEMP/solder-index.headers"
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/solder-index.headers"
          grep -q '<title>Soldering' "$RUNNER_TEMP/solder-index.html"
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/solder-index.html" | head -1)"
          curl --fail --silent "${host[@]}" --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/solder-app.headers" --output /dev/null "$base/soldering/$script"
          grep -qi '^HTTP/1.1 200' "$RUNNER_TEMP/solder-app.headers"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/solder-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/solder-app.headers"
          for path in data/bench.glb draco/draco_decoder.wasm; do
            curl --fail --silent "${host[@]}" --header 'Accept-Encoding: gzip' \
              --dump-header "$RUNNER_TEMP/solder-asset.headers" --output /dev/null "$base/soldering/$path"
            grep -qi '^HTTP/1.1 200' "$RUNNER_TEMP/solder-asset.headers"
            grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/solder-asset.headers"
          done
          test "$(curl --silent "${host[@]}" --output /dev/null --write-out '%{http_code}' "$base/soldering/missing")" = 404
          test "$(curl --silent --header 'Host: pearl.soyspray.vip' --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' "$base/soldering/")" = "301 https://explain.soyspray.vip/soldering/"
      - name: Check pearl.soyspray.vip forwards to explain.soyspray.vip/pearl/
        run: |
          base=http://127.0.0.1:4173
          old=(--header 'Host: pearl.soyspray.vip')
          curl --fail --silent "${old[@]}" --dump-header "$RUNNER_TEMP/moved.headers" --output "$RUNNER_TEMP/moved.html" "$base/"
          grep -q "location.replace('https://explain.soyspray.vip/pearl/'" "$RUNNER_TEMP/moved.html"
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/moved.headers"
          test "$(curl --silent "${old[@]}" --output /dev/null --write-out '%{http_code} %{redirect_url}' "$base/files/pearl_v3_1_shell.stl")" \
            = "301 https://explain.soyspray.vip/pearl/files/pearl_v3_1_shell.stl"
      - name: Remove isolated test container
        if: always()
        run: docker rm --force pearl-guide-check || true
      - uses: ./.github/actions/publish-image-promotion
        with:
          publish: ${{ github.event_name != 'pull_request' }}
          app-slug: pearl-guide
          app-name: Pearl guide
          image: ghcr.io/kpoxo6op/pearl-guide
          image-tag: ${{ env.IMAGE_TAG }}
          runtime-paths: apps/pearl-guide/app apps/pearl-guide/Dockerfile apps/pearl-guide/nginx.conf apps/pearl-guide/.dockerignore
          manifest: apps/pearl-guide/manifests/deployment.yaml
          commit-subject: Promote the tested Pearl guide image digest
          promotion-title: Promote the tested Pearl guide image
          evidence: The image built, passed its content, kit and build tests, and served /pearl/ and /soldering/, their models and decoders, and Pearl print files from a read-only container.
          verification: Merge only after explain.soyspray.vip loads. Then open explain.soyspray.vip/pearl/ and explain.soyspray.vip/soldering/ from a tailnet device, and check pearl.soyspray.vip forwards there with its ticks.
