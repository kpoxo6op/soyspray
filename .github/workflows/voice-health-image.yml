name: Voice diagnostics image

on:
  pull_request:
    paths:
      - apps/voice-assistant/health/**
      - tests/test_voice_health.py
      - tests/voice_health_scenarios.cpp
      - apps/voice-assistant/firmware/**
      - .github/workflows/voice-health-image.yml
  push:
    branches: [main]
    paths:
      - apps/voice-assistant/health/**
      - .github/workflows/voice-health-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kpoxo6op/voice-health
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-cache
      - name: Test the packaged diagnostics interface
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/voice-assistant/health
          docker run --detach --name voice-health-check --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env VOICE_PE_HOST=192.0.2.1 "$IMAGE:$IMAGE_TAG"
          docker exec -i voice-health-check python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          assert os.geteuid() == 1000
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=2) as response:
                      metrics = response.read().decode()
                      assert 'voice_device_connected 0' in metrics
                      assert 'voice_diagnostics_ready 0' in metrics
                      assert 'voice_wake_service_responding 0' in metrics
                  break
              except urllib.error.URLError:
                  if attempt == 29: raise
                  time.sleep(1)
          try:
              urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
              raise AssertionError('An unavailable device cannot be reported healthy.')
          except urllib.error.HTTPError as error:
              assert error.code == 503
          print('Unprivileged diagnostics exporter reports unavailable device without audio access.')
          PY
      - name: Clean the isolated test container
        if: always()
        run: docker rm --force voice-health-check || true
      - name: Publish the tested source image without changing the live deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'Tested image: `%s`\nSource: `%s`\nPromote through a separate reviewed PR.\n' \
            "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$digest" > image-digest.txt
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: voice-health-image-digest
          path: image-digest.txt
