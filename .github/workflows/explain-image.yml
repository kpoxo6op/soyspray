name: Explain catalog image

on:
  push:
    branches: [main]
    paths:
      - apps/explain/**
      - apps/pearl-guide/app/src/**
      - apps/assembly-guide/app/src/**
      - apps/assembly-guide/app/data/**
      - .github/workflows/explain-image.yml
  pull_request:
    paths:
      - apps/explain/**
      - apps/pearl-guide/app/src/**
      - apps/assembly-guide/app/src/**
      - apps/assembly-guide/app/data/**
      - .github/workflows/explain-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explain-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/explain
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Check the chapter list against both guides
        run: |
          (cd apps/pearl-guide/app && npm ci)
          (cd apps/assembly-guide/app && npm ci)
          cd apps/explain/app && npm ci && npm run build && npm test
      - name: Build and test the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/explain
      - name: Check the real HTTP entrypoint
        run: |
          docker run --detach --name explain-check --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=16m,uid=101,gid=101 \
            -p 127.0.0.1:4173:8080 "$IMAGE:$IMAGE_TAG"
          trap 'docker logs explain-check' ERR
          base=http://127.0.0.1:4173
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            --dump-header "$RUNNER_TEMP/explain-index.headers" -o "$RUNNER_TEMP/explain-index.html" "$base/"
          grep -q '<title>Soyspray explainers' "$RUNNER_TEMP/explain-index.html"
          grep -q '<soy-chapter href="/crimping/#crimp-plan"' "$RUNNER_TEMP/explain-index.html"
          grep -q '<soy-chapter href="/soldering/#bench"' "$RUNNER_TEMP/explain-index.html"
          grep -q '<soy-chapter href="/assembly/#ethernet"' "$RUNNER_TEMP/explain-index.html"
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/explain-index.headers"
          for asset in $(grep -oE 'app\.(js|css)\?v=[0-9a-f]{16}' "$RUNNER_TEMP/explain-index.html"); do
            curl --fail --silent --header 'Accept-Encoding: gzip' \
              --dump-header "$RUNNER_TEMP/explain-asset.headers" --output /dev/null "$base/$asset"
            grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/explain-asset.headers"
            grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/explain-asset.headers"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/missing")" = 404
          # the network explainer, served from this image
          curl --fail --silent --dump-header "$RUNNER_TEMP/net.headers" -o "$RUNNER_TEMP/net.html" "$base/network/"
          grep -q '<title>Network' "$RUNNER_TEMP/net.html"
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/net.headers"
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' "$base/network")" = "$base/network/"
          for asset in $(grep -oE 'app\.(js|css)\?v=[0-9a-f]{16}' "$RUNNER_TEMP/net.html"); do
            curl --fail --silent --header 'Accept-Encoding: gzip' \
              --dump-header "$RUNNER_TEMP/net-asset.headers" --output /dev/null "$base/network/$asset"
            grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/net-asset.headers"
            grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/net-asset.headers"
          done
      - name: Remove isolated test container
        if: always()
        run: docker rm --force explain-check || true
      - uses: ./.github/actions/publish-image-promotion
        with:
          publish: ${{ github.event_name != 'pull_request' }}
          app-slug: explain
          app-name: Explain catalog
          image: ghcr.io/kpoxo6op/explain
          image-tag: ${{ env.IMAGE_TAG }}
          runtime-paths: apps/explain/app apps/explain/Dockerfile apps/explain/nginx.conf apps/explain/.dockerignore
          manifest: apps/explain/manifests/deployment.yaml
          commit-subject: Promote the tested explain catalog image digest
          promotion-title: Promote the tested explain catalog image
          evidence: The image built, passed its catalog and network guide tests, and served both pages and their revisioned, gzipped assets from a read-only container.
          verification: Open explain.soyspray.vip from a tailnet device after Argo reports the Application Synced and Healthy.
