name: Assembly guide image

on:
  push:
    branches: [main]
    paths:
      - apps/assembly-guide/app/**
      - apps/assembly-guide/Dockerfile
      - apps/assembly-guide/.dockerignore
      - .github/workflows/assembly-guide-image.yml
  pull_request:
    paths:
      - apps/assembly-guide/app/**
      - apps/assembly-guide/Dockerfile
      - apps/assembly-guide/.dockerignore
      - .github/workflows/assembly-guide-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-guide-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kpoxo6op/assembly-guide
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/assembly-guide
      - name: Check the real HTTP entrypoint
        run: |
          docker run --detach --name assembly-guide-image-check --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=16m,uid=101,gid=101 \
            -p 127.0.0.1:4173:8080 "$IMAGE:$IMAGE_TAG"
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 \
            -o "$RUNNER_TEMP/assembly-index.html" http://127.0.0.1:4173/
          curl --fail -o "$RUNNER_TEMP/assembly-app.js" http://127.0.0.1:4173/app.js
          curl --fail -o "$RUNNER_TEMP/assembly-app.css" http://127.0.0.1:4173/app.css
          test -s "$RUNNER_TEMP/assembly-index.html"
          test "$(wc -c < "$RUNNER_TEMP/assembly-app.js")" -gt 500000
          test -s "$RUNNER_TEMP/assembly-app.css"
      - name: Remove isolated test container
        if: always()
        run: docker rm --force assembly-guide-image-check || true
      - name: Publish tested image for a separate digest promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'Tested image: `%s`\nSource: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
