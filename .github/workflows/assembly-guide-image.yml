name: Assembly guide image

on:
  push:
    branches: [main]
    paths:
      - apps/assembly-guide/app/**
      - apps/assembly-guide/Dockerfile
      - apps/assembly-guide/nginx.conf
      - apps/assembly-guide/.dockerignore
      - .github/workflows/assembly-guide-image.yml
  pull_request:
    paths:
      - apps/assembly-guide/app/**
      - apps/assembly-guide/Dockerfile
      - apps/assembly-guide/nginx.conf
      - apps/assembly-guide/.dockerignore
      - .github/workflows/assembly-guide-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-guide-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kpoxo6op/assembly-guide
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/assembly-guide
      - name: Check the real HTTP entrypoint
        run: |
          docker run --detach --name assembly-guide-image-check --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=16m,uid=101,gid=101 \
            -p 127.0.0.1:4173:8080 "$IMAGE:$IMAGE_TAG"
          trap 'docker logs assembly-guide-image-check' ERR
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            -o "$RUNNER_TEMP/assembly-index.html" http://127.0.0.1:4173/
          curl --fail -o "$RUNNER_TEMP/assembly-app.js" http://127.0.0.1:4173/app.js
          curl --fail -o "$RUNNER_TEMP/assembly-app.css" http://127.0.0.1:4173/app.css
          test -s "$RUNNER_TEMP/assembly-index.html"
          test "$(wc -c < "$RUNNER_TEMP/assembly-app.js")" -gt 500000
          test -s "$RUNNER_TEMP/assembly-app.css"
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/assembly-index.html" | head -1)"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/assembly-app.headers" \
            -o "$RUNNER_TEMP/assembly-app.js.gz" "http://127.0.0.1:4173/$script"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/assembly-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/assembly-app.headers"
          gzip -dc "$RUNNER_TEMP/assembly-app.js.gz" | cmp - "$RUNNER_TEMP/assembly-app.js"
          test "$(wc -c < "$RUNNER_TEMP/assembly-app.js.gz")" -lt 450000
          curl --fail --silent --dump-header "$RUNNER_TEMP/assembly-index.headers" \
            -o /dev/null http://127.0.0.1:4173/
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/assembly-index.headers"
      - name: Check the guide under explain.soyspray.vip/assembly/
        run: |
          base=http://127.0.0.1:4173
          curl --silent --dump-header "$RUNNER_TEMP/assembly-prefix.headers" --output /dev/null "$base/assembly"
          grep -qi '^HTTP/1.1 301' "$RUNNER_TEMP/assembly-prefix.headers"
          grep -qi '^location: /assembly/\s*$' "$RUNNER_TEMP/assembly-prefix.headers"
          curl --fail --silent --output "$RUNNER_TEMP/assembly-prefix.html" "$base/assembly/"
          cmp "$RUNNER_TEMP/assembly-prefix.html" <(curl --fail --silent "$base/")
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/assembly-prefix.html" | head -1)"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/assembly-prefix-app.headers" --output /dev/null "$base/assembly/$script"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/assembly-prefix-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/assembly-prefix-app.headers"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/assembly/missing")" = 404
      - name: Check the crimping explainer under explain.soyspray.vip/crimping/
        run: |
          base=http://127.0.0.1:4173
          curl --silent --dump-header "$RUNNER_TEMP/crimping.headers" --output /dev/null "$base/crimping"
          grep -qi '^HTTP/1.1 301' "$RUNNER_TEMP/crimping.headers"
          grep -qi '^location: /crimping/\s*$' "$RUNNER_TEMP/crimping.headers"
          curl --fail --silent --dump-header "$RUNNER_TEMP/crimping-index.headers" --output "$RUNNER_TEMP/crimping.html" "$base/crimping/"
          grep -qi '^cache-control: no-cache' "$RUNNER_TEMP/crimping-index.headers"
          grep -q '<title>Crimping Ethernet leads</title>' "$RUNNER_TEMP/crimping.html"
          script="$(grep -oE 'app\.js\?v=[0-9a-f]{16}' "$RUNNER_TEMP/crimping.html" | head -1)"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$RUNNER_TEMP/crimping-app.headers" --output /dev/null "$base/crimping/$script"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/crimping-app.headers"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/crimping-app.headers"
      - name: Check assembly.soyspray.vip forwards to explain.soyspray.vip/assembly/
        run: |
          for path in / "/app.js?v=0123456789abcdef"; do
            test "$(curl --silent --header 'Host: assembly.soyspray.vip' --output /dev/null --write-out '%{http_code} %{redirect_url}' "http://127.0.0.1:4173$path")" \
              = "301 https://explain.soyspray.vip/assembly$path"
          done
      - name: Remove isolated test container
        if: always()
        run: docker rm --force assembly-guide-image-check || true
      - name: Publish tested image for a separate digest promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'Tested image: `%s`\nSource: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
