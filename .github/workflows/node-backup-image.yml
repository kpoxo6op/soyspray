name: Node-local backup image

on:
  pull_request:
    paths:
      - "apps/node-backup/**"
      - ".github/workflows/node-backup-image.yml"
  push:
    branches: [main]
    paths:
      - "apps/node-backup/Dockerfile"
      - "apps/node-backup/.dockerignore"
      - "apps/node-backup/scripts/**"
      - ".github/workflows/node-backup-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build the immutable backup image
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag soyspray-node-backup:test apps/node-backup
      - name: Check the packaged entrypoint
        run: |
          docker run --rm --network none --read-only --entrypoint python3 \
            soyspray-node-backup:test -c "import ast; ast.parse(open('/scripts/backup.py').read())"
      - name: Run the SQLite and Restic recovery tests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          docker run --rm --read-only --tmpfs /work -e TMPDIR=/work \
            --entrypoint python3 -v "$PWD/apps/node-backup:/app:ro" \
            soyspray-node-backup:test /app/tests/test_backup.py
          python3 -m unittest discover -s apps/node-backup/tests -p 'test_manifest.py'
      - name: Publish the tested source image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/kpoxo6op/node-backup:$GITHUB_SHA"
          docker tag soyspray-node-backup:test "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Open a separate digest promotion
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/kpoxo6op/node-backup:$GITHUB_SHA"
          export IMAGE_REF="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          branch="codex/promote-node-backup-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          p = Path('apps/node-backup/manifests/cronjob.yaml')
          s = p.read_text()
          import re
          s = re.sub(r'image: ghcr.io/kpoxo6op/node-backup:\S+|image: ghcr.io/kpoxo6op/node-backup@\S+', 'image: ' + os.environ['IMAGE_REF'], s)
          p.write_text(s)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/node-backup/manifests/cronjob.yaml
          git commit -m 'Promote the tested node backup image'
          git push origin "$branch"
          commit="$(git rev-parse HEAD)"
          printf 'Promote the tested node backup image. The schedule stays suspended until a real backup and restore pass.\n\nImage: `%s`.\n\nCommit: [%s](https://github.com/%s/commit/%s).\n' "$IMAGE_REF" "$commit" "$GITHUB_REPOSITORY" "$commit" > "$RUNNER_TEMP/promotion.md"
          gh pr create --draft --base main --head "$branch" --title 'Promote the tested node backup image' --body-file "$RUNNER_TEMP/promotion.md"
