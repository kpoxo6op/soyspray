name: Node-local backup image

on:
  pull_request:
    paths:
      - "apps/node-backup/**"
      - ".github/workflows/node-backup-image.yml"
  push:
    branches: [main]
    paths:
      - "apps/node-backup/**"
      - ".github/workflows/node-backup-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build the immutable backup image
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag soyspray-node-backup:test apps/node-backup
      - name: Check the packaged entrypoint
        run: |
          docker run --rm --network none --read-only --entrypoint python3 \
            soyspray-node-backup:test -c "import ast; ast.parse(open('/scripts/backup.py').read())"
      - name: Run the SQLite and Restic recovery tests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          docker run --rm --entrypoint python3 -v "$PWD/apps/node-backup:/app:ro" \
            soyspray-node-backup:test /app/tests/test_backup.py
          python3 -m unittest discover -s apps/node-backup/tests -p 'test_manifest.py'
      - name: Publish the tested source image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/kpoxo6op/node-backup:$GITHUB_SHA"
          docker tag soyspray-node-backup:test "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
