name: Boys image

on:
  push:
    branches: [main]
    paths:
      - kubernetes/boys/app/**
      - kubernetes/boys/Dockerfile
      - kubernetes/boys/.dockerignore
      - kubernetes/boys/test-image.py
      - kubernetes/boys/tests/**
      - kubernetes/boys/package*.json
      - kubernetes/boys/playwright.config.js
      - .github/workflows/boys-image.yml
  pull_request:
    paths:
      - kubernetes/boys/app/**
      - kubernetes/boys/Dockerfile
      - kubernetes/boys/.dockerignore
      - kubernetes/boys/test-image.py
      - kubernetes/boys/tests/**
      - kubernetes/boys/package*.json
      - kubernetes/boys/playwright.config.js
      - .github/workflows/boys-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boys-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kubernetes/boys/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check dates and trip behavior in phone and desktop browsers
        working-directory: kubernetes/boys
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
  build:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/boys
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the pinned runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" kubernetes/boys
      - name: Check the image without cluster access
        run: |
          docker run --detach --name boys-check --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /data:rw,size=16m,uid=1000,gid=1000 --tmpfs /tmp:rw,size=16m \
            --env BOYS_PIN=1234 --env BOYS_COOKIE_SECURE=false \
            --env BOYS_SESSION_KEY=image-test-key-with-no-production-access \
            "$IMAGE:$IMAGE_TAG"
          docker exec -i boys-check python - < kubernetes/boys/test-image.py
      - name: Remove the isolated test container
        if: always()
        run: docker rm --force boys-check || true
      - name: Check database migration and previous-image rollback
        run: |
          previous="$(python3 - <<'PYTHON'
          import re
          from pathlib import Path
          text = Path('kubernetes/boys/deployment.yaml').read_text()
          image = re.findall(r'(?m)^          image: (ghcr\.io/kpoxo6op/boys@sha256:[0-9a-f]{64})$', text)
          if len(image) != 1:
              raise SystemExit('Expected one prior Boys digest')
          print(image[0])
          PYTHON
          )"
          docker volume create boys-migration-data
          docker run --rm --network none --read-only --user 0 --cap-drop ALL --cap-add CHOWN \
            --mount source=boys-migration-data,target=/data "$IMAGE:$IMAGE_TAG" \
            python -c 'import os; os.chown("/data", 1000, 1000)'
          run_image() {
            docker run --detach --name boys-migration --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --mount source=boys-migration-data,target=/data --tmpfs /tmp:rw,size=16m \
              --env BOYS_PIN=1234 --env BOYS_COOKIE_SECURE=false \
              --env BOYS_SESSION_KEY=image-test-key-with-no-production-access \
              --env "BOYS_TRIP_SEED_FILE=${2-}" "$1"
          }
          run_image "$previous"
          docker exec -i boys-migration python - < kubernetes/boys/test-image.py
          docker exec -i boys-migration python - record < kubernetes/boys/tests/image-migration.py
          docker rm --force boys-migration
          run_image "$IMAGE:$IMAGE_TAG" /data/check-seed.json
          docker exec -i boys-migration python - migrated < kubernetes/boys/tests/image-migration.py
          docker rm --force boys-migration
          run_image "$previous"
          docker exec -i boys-migration python - rollback < kubernetes/boys/tests/image-migration.py
      - name: Remove the isolated migration data
        if: always()
        run: |
          docker rm --force boys-migration || true
          docker volume rm boys-migration-data || true
      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'BOYS_IMAGE_REF=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'Tested image: `%s`\nSource: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a draft digest promotion
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="promote/boys-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          image = os.environ['BOYS_IMAGE_REF']
          if not re.fullmatch(r'ghcr.io/kpoxo6op/boys@sha256:[0-9a-f]{64}', image):
              raise SystemExit('The published image reference is not a digest')
          path = Path('kubernetes/boys/deployment.yaml')
          text = path.read_text()
          pattern = r'(?m)^          image: (?:python:3\.13-alpine|ghcr\.io/kpoxo6op/boys)@sha256:[0-9a-f]{64}$'
          text, count = re.subn(pattern, '          image: ' + image, text)
          if count != 1:
              raise SystemExit('Expected exactly one Boys runtime image to promote')
          path.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kubernetes/boys/deployment.yaml
          git commit -m 'Promote the tested Boys image digest'
          git push origin "$branch"
          promotion_commit="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/promotion.md" <<EOF
          Promote the tested Boys image built from [source $GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          Image: \`$BOYS_IMAGE_REF\`.

          The image passed the isolated HTTP check. Review configuration required by this source revision in this PR before deployment. Keep the existing PVC, database path, runtime Secret, and single-writer deployment.

          Run \`make check\` and \`make go\`, then use the standard Ansible deployment path. Verify the deployed user journey before merge. Roll back by restoring the prior digest and its compatible configuration. This workflow does not merge or deploy.

          Commits, oldest first:

          - [Promote the tested Boys image digest](https://github.com/$GITHUB_REPOSITORY/commit/$promotion_commit)
          EOF
          gh pr create --draft --base main --head "$branch" \
            --title 'Promote the tested Boys image' --body-file "$RUNNER_TEMP/promotion.md"
