name: GI speech recognition image

on:
  pull_request:
    paths: [apps/voice-assistant/stt/**, .github/workflows/gi-stt-image.yml, playbooks/operations/recovery/check-ha-voice-installer*]
  push:
    branches: [main]
    paths: [apps/voice-assistant/stt/**, .github/workflows/gi-stt-image.yml, playbooks/operations/recovery/check-ha-voice-installer*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stt-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kpoxo6op/gi-stt
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Check model integrity and archive confinement
        run: |
          python -m pip install pytest
          python -m pytest -q apps/voice-assistant/stt/tests
      - uses: ./.github/actions/docker-hub-cache
      - name: Build the offline speech image
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/voice-assistant/stt
      - name: Exercise Wyoming metadata and silence with no network access
        run: |
          set -euo pipefail
          for candidate in default parakeet base.en small.en; do
            if [ "$candidate" = parakeet ]; then
              library=sherpa
              model=sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
            else
              library=faster-whisper
              model="/models/$candidate"
            fi
            args=(--uri tcp://0.0.0.0:10300 --data-dir /models --download-dir /models \
              --local-files-only --language en --stt-library "$library" --model "$model" \
              --cpu-threads 2 --beam-size 1 --compute-type int8 --vad-filter)
            if [ "$candidate" = default ]; then args=(); fi
            container="$(docker run -d --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --tmpfs /tmp:uid=1000,gid=1000,mode=700 \
              "$IMAGE:$IMAGE_TAG" "${args[@]}")"
            trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
            timeout 180 docker exec -i -e PYTHONPATH=/app "$container" python - \
              < apps/voice-assistant/stt/smoke.py
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - name: Publish the tested image without deploying it
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'Tested image: `%s`\nPromote through a separate reviewed PR.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$digest" > image-digest.txt
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: gi-stt-image-digest
          path: image-digest.txt
