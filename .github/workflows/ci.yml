name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      immich: ${{ steps.scope.outputs.immich }}
      boys: ${{ steps.scope.outputs.boys }}
      autism: ${{ steps.scope.outputs.autism }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select affected application checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = true ]; then
            python3 -m scripts.ci_scope --full
          else
            python3 -m scripts.ci_scope --base "$BASE"
          fi

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install local tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install the pinned Kubernetes Ansible collection
        run: ansible-galaxy collection install -r requirements-ansible.yml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/soyspray/prometheus-3.6.0
          key: promtool-linux-amd64-3.6.0-2002ef4a
      - name: Run shared checks
        run: make lint validate test PYTHON=python3

  autism:
    needs: scope
    if: needs.scope.outputs.autism == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/autism-traits/app/package-lock.json
      - name: Install autism traits dependencies
        working-directory: apps/autism-traits/app
        run: npm ci
      - name: Check autism traits application
        working-directory: apps/autism-traits/app
        run: npm run check
      - name: Install Playwright Chromium
        working-directory: apps/autism-traits/app
        run: npx playwright install --with-deps chromium
      - name: Test autism traits browser flow
        working-directory: apps/autism-traits/app
        run: npm run test:e2e

  boys:
    needs: scope
    if: needs.scope.outputs.boys == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kubernetes/boys/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Boys browser checks
        working-directory: kubernetes/boys
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check Boys phone and desktop browsers
        run: make boys-check PYTHON=python3

  immich:
    needs: scope
    if: needs.scope.outputs.immich == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test paired backup and isolated recovery with native images
        run: python3 apps/immich/tests/test_backup.py

  check:
    needs: [scope, shared, autism, boys, immich]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared checks and every selected application check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          for job in ('scope', 'shared'):
              assert jobs[job]['result'] == 'success', f'{job} did not pass'
          for app in ('autism', 'boys', 'immich'):
              selected = jobs['scope']['outputs'].get(app)
              assert selected in ('true', 'false'), f'{app} scope is missing'
              expected = 'success' if selected == 'true' else 'skipped'
              assert jobs[app]['result'] == expected, f'{app} did not finish as expected'
          PYTHON
