name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kubernetes/autism-traits/app/package-lock.json
      - name: Install autism traits dependencies
        working-directory: kubernetes/autism-traits/app
        run: npm ci
      - name: Check autism traits application
        working-directory: kubernetes/autism-traits/app
        run: npm run check
      - name: Verify committed autism traits bundle
        run: |
          git diff --exit-code -- kubernetes/autism-traits/app/dist
          test -z "$(git ls-files --others --exclude-standard -- kubernetes/autism-traits/app/dist)"
      - name: Install Playwright Chromium
        working-directory: kubernetes/autism-traits/app
        run: npx playwright install --with-deps chromium
      - name: Test autism traits browser flow
        working-directory: kubernetes/autism-traits/app
        run: npm run test:e2e
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install local tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install Boys browser checks
        working-directory: kubernetes/boys
        run: npm ci
      - name: Run local gate
        run: make check PYTHON=python3
