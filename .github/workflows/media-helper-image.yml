name: Media helper image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a tested image and open a draft promotion from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: media-helper-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/media-helper
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Detect a runtime change before publishing
        id: runtime
        env:
          BEFORE: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          changed=false
          if [ "$REQUEST_PUBLISH" = true ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              changed=true
            elif [ "$GITHUB_EVENT_NAME" = push ]; then
              git cat-file -e "$BEFORE^{commit}"
              git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
                apps/media-helper/app apps/media-helper/Dockerfile \
                apps/media-helper/.dockerignore > "$RUNNER_TEMP/media-helper-runtime-files"
              if [ -s "$RUNNER_TEMP/media-helper-runtime-files" ]; then changed=true; fi
            fi
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - name: Build the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/media-helper
      - name: Check the packaged runtime without external network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --env MEDIA_HELPER_SOURCE=/app/app.py \
            --mount "type=bind,source=$PWD/apps/media-helper/tests/test_media_helper_runtime.py,target=/checks/test_runtime.py,readonly" \
            --entrypoint python3 "$IMAGE:$IMAGE_TAG" /checks/test_runtime.py
      - name: Check the real entrypoint with disposable inputs
        run: |
          docker run --detach --name media-helper-image-check --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges "$IMAGE:$IMAGE_TAG"
          docker exec -i media-helper-image-check python \
            - < apps/media-helper/tests/check_media_helper_entrypoint.py
      - name: Remove the isolated test container
        if: always()
        run: docker rm --force media-helper-image-check || true
      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && steps.runtime.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          printf 'MEDIA_HELPER_IMAGE_REF=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'Tested image: `%s`\nSource: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a draft digest and configuration promotion
        if: github.ref == 'refs/heads/main' && steps.runtime.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install PyYAML==6.0.3
          branch="promote/media-helper-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          python apps/media-helper/promote-image.py "$MEDIA_HELPER_IMAGE_REF"
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/media-helper/manifests/deployment.yaml apps/media-helper/kustomization.yaml
          git commit -m 'Promote the tested media helper runtime image'
          git push origin "$branch"
          promotion_commit="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/promotion.md" <<BODY
          Promote media helper built from [source $GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          Image: \`$MEDIA_HELPER_IMAGE_REF\`.

          The image passed standard-library runtime checks and entrypoint checks with no external network, an unprivileged user, a read-only filesystem, and no capabilities. Promotion couples the image digest with removal of the frozen ConfigMap generator, Python command and code mount when present. Readiness waits for the first complete guide, so the old pod remains available while the new cache warms. Liveness stays on healthz. It preserves the service, channel identities, resource limits, pod restrictions and temporary volume. Later promotions change only the digest. Guide reads use the last complete cache or return a prompt 503 while one background refresh runs.

          Run \`make go\` and deploy through the standard Ansible path. Verify catalog, playlist and guide reads from Dispatcharr and the Jellyfin user journey before merge. Roll back the image and dependent configuration together. This workflow never merges or deploys.

          Commits, oldest first:

          - [Promote the tested media helper runtime image](https://github.com/$GITHUB_REPOSITORY/commit/$promotion_commit)
          BODY
          gh pr create --draft --base main --head "$branch" \
            --title 'Promote the tested media helper runtime image' --body-file "$RUNNER_TEMP/promotion.md"
