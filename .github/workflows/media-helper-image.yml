name: Media helper image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a tested image and open a draft promotion from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: media-helper-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/kpoxo6op/media-helper
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the immutable runtime
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" apps/media-helper
      - name: Check the packaged runtime without external network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --env MEDIA_HELPER_SOURCE=/app/app.py \
            --mount "type=bind,source=$PWD/apps/media-helper/tests/test_media_helper_runtime.py,target=/checks/test_runtime.py,readonly" \
            --entrypoint python3 "$IMAGE:$IMAGE_TAG" /checks/test_runtime.py
      - name: Check the real entrypoint with disposable inputs
        run: |
          docker run --detach --name media-helper-image-check --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges "$IMAGE:$IMAGE_TAG"
          docker exec -i media-helper-image-check python \
            - < apps/media-helper/tests/check_media_helper_entrypoint.py
      - name: Remove the isolated test container
        if: always()
        run: docker rm --force media-helper-image-check || true
      - name: Publish and open the separate promotion when requested
        uses: ./.github/actions/publish-image-promotion
        with:
          publish: ${{ inputs.publish }}
          app-slug: media-helper
          app-name: media helper
          image: ${{ env.IMAGE }}
          image-tag: ${{ env.IMAGE_TAG }}
          runtime-paths: apps/media-helper/app apps/media-helper/Dockerfile apps/media-helper/.dockerignore
          manifest: apps/media-helper/manifests/deployment.yaml
          commit-subject: Promote the tested media helper runtime image
          promotion-title: Promote the tested media helper runtime image
          evidence: The image passed standard-library runtime and entrypoint checks with no external network, an unprivileged user, a read-only filesystem, and no capabilities. Promotion changes only the digest and preserves service and channel identities, probes, resource limits, pod restrictions, and cache behavior.
          verification: Run `make go`, then verify catalog, playlist, and guide reads from Dispatcharr and the Jellyfin user journey before merge.
