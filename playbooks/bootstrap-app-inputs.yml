---
- name: Bootstrap private application inputs
  hosts: kube_control_plane[0]
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    input_roles:
      - {name: Authentik, role: authentik/bootstrap}
      - {name: Immich backup, role: immich/bootstrap}
      - {name: Live TV, role: live-tv/bootstrap}
      - {name: Home Assistant Voice, role: voice-assistant/bootstrap}
  pre_tasks:
    - name: Prepare the certificate provider identity
      ansible.builtin.import_tasks: ../apps/cert-manager-config/bootstrap-tasks.yml
      tags: cert-manager

    - name: Prepare public chart repositories
      ansible.builtin.import_tasks: ../argocd/bootstrap/repositories.yml
      tags: [cert-manager, bitnami-oci]

  tasks:
    - name: "Include input role | {{ item.name }}"
      ansible.builtin.include_role:
        name: "{{ item.role }}"
      tags: always
      loop: "{{ input_roles }}"
      loop_control:
        label: "{{ item.role }}"
