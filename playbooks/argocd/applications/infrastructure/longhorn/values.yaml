persistence:
  defaultClass: true
  defaultClassReplicaCount: "3"
  defaultDataLocality: best-effort
  migratable: true
  metricsPort: 9500

defaultSettings:
  defaultReplicaCount: "3"
  concurrentReplicaRebuildPerNodeLimit: "4"
  priorityClass: null
  disableRevisionCounter: null

longhornUI:
  replicas: 1

longhornManager:
  priorityClass: longhorn-critical
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5

longhornDriver:
  priorityClass: longhorn-critical

engineImage:
  livenessProbe:
    initialDelaySeconds: 45
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

priorityClass:
  create: true
  name: longhorn-critical
  value: 2000001001

ingress:
  enabled: true
  ingressClassName: nginx
  host: longhorn.soyspray.vip
  tls: true
  tlsSecret: prod-cert-tls
  path: /
  pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://longhorn.soyspray.vip/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: "longhorn-system/auth-proxy-set-headers-longhorn"

service:
  ui:
    type: ClusterIP
  manager:
    type: ClusterIP
    nodePort: ""
    ports:
      manager: 9500
      metrics: 9500

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    port: manager
    interval: 60s
    scrapeTimeout: 30s
