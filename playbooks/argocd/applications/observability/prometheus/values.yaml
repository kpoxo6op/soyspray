# playbooks/yaml/argocd-apps/prometheus/values.yaml
# kubectl exec -n monitoring alertmanager-kube-prometheus-stack-alertmanager-0 -c alertmanager -- cat /etc/alertmanager/config/soy-telegram.tmpl
namespaceOverride: monitoring

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
      nginx.ingress.kubernetes.io/auth-signin: "https://prometheus.soyspray.vip/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
      nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"
      nginx.ingress.kubernetes.io/auth-proxy-set-headers: "monitoring/auth-proxy-set-headers-prometheus"
    hosts:
      - prometheus.soyspray.vip
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prod-cert-tls
        hosts:
          - prometheus.soyspray.vip
  prometheusSpec:
    image:
      tag: v3.6.0
    replicas: 1
    retention: 15d
    walCompression: true
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 60s
    scrapeTimeout: 30s
    evaluationInterval: 60s
    externalLabels:
      cluster: soyspray
    enableOTLPReceiver: false
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs: []

  additionalServiceMonitors:
    - name: cert-manager
      selector:
        matchLabels:
          app.kubernetes.io/name: cert-manager
      namespaceSelector:
        matchNames:
          - cert-manager
      endpoints:
        - port: tcp-prometheus-servicemonitor
          interval: 60s

    - name: argocd
      selector:
        matchLabels:
          app.kubernetes.io/name: argocd-metrics
      namespaceSelector:
        matchNames:
          - argocd
      endpoints:
        - port: metrics
          interval: 60s

    - name: domain-health
      selector:
        matchLabels:
          app.kubernetes.io/name: domain-health
      namespaceSelector:
        matchNames:
          - domain-health
      endpoints:
        - port: metrics
          interval: 60s

  additionalPodMonitors:
    - name: smartctl-exporter
      selector:
        matchLabels:
          app.kubernetes.io/name: smartctl-exporter
      namespaceSelector:
        matchNames:
          - monitoring
      podMetricsEndpoints:
        - port: metrics
          interval: 300s
          relabelings:
            - action: replace
              sourceLabels:
                - __meta_kubernetes_pod_node_name
              targetLabel: node

grafana:
  namespaceOverride: monitoring
  resources:
    requests:
      cpu: 75m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
  grafana.ini:
    auth.anonymous:
      enabled: false
      org_name: "Main Org."
      org_role: "Viewer"
    auth.generic_oauth:
      enabled: true
      name: authentik
      allow_sign_up: true
      auto_login: true
      client_id: "$__env{GRAFANA_OIDC_CLIENT_ID}"
      client_secret: "$__env{GRAFANA_OIDC_CLIENT_SECRET}"
      scopes: "openid profile email groups"
      auth_url: https://auth.soyspray.vip/application/o/authorize/
      token_url: https://auth.soyspray.vip/application/o/token/
      api_url: https://auth.soyspray.vip/application/o/userinfo/
      signout_redirect_url: https://auth.soyspray.vip/application/o/grafana/end-session/
      role_attribute_path: "contains(groups, 'cluster-admins') && 'GrafanaAdmin' || 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
    server:
      root_url: https://grafana.soyspray.vip
    date_formats:
      default_timezone: "Pacific/Auckland"
  defaultDashboardsTimezone: "Pacific/Auckland"
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      provider:
        name: 'default'
        orgId: 1
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      provider:
        name: 'default'
        orgId: 1

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: true
      jsonData:
        httpMethod: GET
        timeout: 60

  service:
    type: ClusterIP
  envFromSecret: grafana-oidc
  admin:
    existingSecret: grafana-oidc
    userKey: admin-user
    passwordKey: admin-password
  image:
    tag: 11.3.0

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
    labels: {}
    hosts:
      - grafana.soyspray.vip
    path: /
    tls:
      - secretName: prod-cert-tls
        hosts:
          - grafana.soyspray.vip

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    volumes:
      - name: telegram-secret
        secret:
          secretName: alertmanager-telegram-secret
    volumeMounts:
      - name: telegram-secret
        mountPath: /etc/alertmanager/telegram
        readOnly: true
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.20.35
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname","namespace","severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "watchdog-healthchecks"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
        - matchers:
            - severity=~"none|info"
          receiver: "null"
        - matchers:
            - severity=~"warning|critical"
          receiver: "telegram"
    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - api_url: "https://api.telegram.org"
            bot_token_file: /etc/alertmanager/telegram/PROMETHEUS_TELEGRAM_BOT_TOKEN
            chat_id: 336642153
            parse_mode: HTML
            message: '{{ template "soy.telegram" . }}'
      - name: "watchdog-healthchecks"
        webhook_configs:
          - url: "https://hc-ping.com/ee92de78-bf59-4cb8-a41a-01382feb9a65"
            send_resolved: false
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  templateFiles:
    soy-telegram.tmpl: |
      {{- define "soy.telegram" -}}
      {{- if eq .Status "firing" -}}🔥 FIRING{{- else -}}✅ RESOLVED{{- end }} [{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }} ({{ len .Alerts }})

      {{- range .Alerts }}
      - <b>Alert</b>
        {{- if .Labels.namespace }}
        ns={{ .Labels.namespace }}{{ end }}{{ if .Labels.job_name }}
        job={{ .Labels.job_name }}{{ end }}{{ if .Labels.deployment }}
        deploy={{ .Labels.deployment }}{{ end }}{{ if .Labels.statefulset }}
        sts={{ .Labels.statefulset }}{{ end }}{{ if .Labels.daemonset }}
        ds={{ .Labels.daemonset }}{{ end }}{{ if and .Labels.pod (not .Labels.job_name) }}
        pod={{ .Labels.pod }}{{ end }}{{ if .Labels.container }}
        container={{ .Labels.container }}{{ end }}{{ if .Labels.node }}
        node={{ .Labels.node }}{{ end }}{{ if .Labels.reason }}
        reason={{ .Labels.reason }}{{ end }}

        {{- $text := .Annotations.summary -}}
        {{- if eq $text "" -}}{{- $text = .Annotations.description -}}{{- end -}}
        {{ $text }}
        {{- if and .Annotations.description (ne .Annotations.description $text) }}

        {{ .Annotations.description }}
        {{- end }}

        {{- if .GeneratorURL }}
        Source: <a href="{{ .GeneratorURL }}">open</a>
        {{- end }}

      {{- end }}
      {{- if .CommonAnnotations.runbook_url }}
      Runbook: <a href="{{ .CommonAnnotations.runbook_url }}">open</a>
      {{- end }}
      {{- end }}

prometheus-node-exporter:
  namespaceOverride: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  namespaceOverride: monitoring
  rbac:
    extraRules:
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [list, watch]
      - apiGroups: [longhorn.io]
        resources: [backups, volumes]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Backup
            metricNamePrefix: soyspray_longhorn
            labelsFromPath:
              backup: [metadata, name]
              volume: [status, volumeName]
              backup_target: [status, backupTargetName]
              state: [status, state]
              progress: [status, progress]
              backup_error: [status, error]
            metrics:
              - name: backup_snapshot_timestamp_seconds
                help: Unix time of the source snapshot; not backup completion time.
                each:
                  type: Gauge
                  gauge:
                    path: [status, snapshotCreatedAt]
                    nilIsZero: false
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            metricNamePrefix: soyspray_longhorn
            metrics:
              - name: volume_info
                help: Longhorn volume ownership and its explicitly assigned backup group.
                each:
                  type: Info
                  info:
                    path: []
                    labelsFromPath:
                      volume: [metadata, name]
                      volume_uid: [metadata, uid]
                      critical_group: [metadata, labels, recurring-job-group.longhorn.io/critical]
                      backup_target: [spec, backupTargetName]
                      app_namespace: [status, kubernetesStatus, namespace]
                      pvc: [status, kubernetesStatus, pvcName]
                      pv_status: [status, kubernetesStatus, pvStatus]
  prometheus:
    monitor:
      http:
        metricRelabelings:
          # Reject a backup with an error before storing any sample or error text.
          - action: drop
            sourceLabels: [__name__, backup_error]
            regex: 'soyspray_longhorn_backup_snapshot_timestamp_seconds;.+'
          - action: labeldrop
            regex: backup_error
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kubeEtcd:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
      hookDeletePolicy: before-hook-creation,hook-succeeded
  tls:
    enabled: false
  resources:
    requests:
      cpu: 75m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
  service:
    port: 8443
    targetPort: 8443
  containerArgs:
    - --web.listen-address=:8443
    - --web.enable-tls=false
