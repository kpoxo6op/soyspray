apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boys
  namespace: argocd
spec:
  description: Shared-PIN event calendar and its dedicated Cloudflare Tunnel connector.
  sourceRepos:
    - https://github.com/kpoxo6op/soyspray.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: boys
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: crd.projectcalico.org, kind: GlobalNetworkPolicy}
    - {group: crd.projectcalico.org, kind: HostEndpoint}
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: Service}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: crd.projectcalico.org, kind: NetworkPolicy}
