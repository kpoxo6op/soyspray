# playbooks/argocd/applications/home-automation/zigbee2mqtt/kustomization.yaml
# Kustomize configuration for Zigbee2MQTT
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - authentik-forward-auth.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc-data.yaml
  - configmap-config.yaml

namespace: home-automation

labels:
  - pairs:
      app: zigbee2mqtt
      managed-by: argocd
    includeSelectors: false
