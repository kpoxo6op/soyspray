---
# The monitoring Application keeps pruning disabled on purpose, so a resource it
# no longer declares stays in the cluster. This operation removes the one
# resource the temporary acceptance probe left behind. It names that resource
# exactly, refuses to touch anything else, and is safe to rerun.
- name: Retire the temporary diagnosis acceptance probe
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    probe_rule_name: acceptance-probe
    probe_namespace: monitoring
    probe_alert: SoysprayDiagnosisAcceptanceProbe
  tasks:
    - name: Read the probe rule
      kubernetes.core.k8s_info:
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        name: "{{ probe_rule_name }}"
        namespace: "{{ probe_namespace }}"
      register: probe_rule

    - name: Report that the probe is already gone
      ansible.builtin.debug:
        msg: >-
          {{ probe_rule_name }} is not in {{ probe_namespace }}. Nothing to
          remove; the alert and its incident are already resolved.
      when: probe_rule.resources | length == 0

    - name: Require the rule to be the probe and nothing else
      ansible.builtin.assert:
        that:
          - probe_rule.resources[0].spec.groups | length == 1
          - >-
            probe_rule.resources[0].spec.groups[0].rules | map(attribute='alert')
            | list == [probe_alert]
        fail_msg: >-
          {{ probe_rule_name }} does not contain exactly the acceptance probe.
          Inspect it by hand: this operation only removes the temporary probe.
      when: probe_rule.resources | length == 1

    - name: Remove the probe rule
      kubernetes.core.k8s:
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        name: "{{ probe_rule_name }}"
        namespace: "{{ probe_namespace }}"
        state: absent
        wait: true
      when: probe_rule.resources | length == 1

    - name: Read the probe rule again
      kubernetes.core.k8s_info:
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        name: "{{ probe_rule_name }}"
        namespace: "{{ probe_namespace }}"
      register: probe_rule_remaining

    - name: Require the probe rule to be gone
      ansible.builtin.assert:
        that: probe_rule_remaining.resources | length == 0
        fail_msg: The probe rule is still present.
      # A check run never removes anything, so it cannot assert the result.
      when:
        - probe_rule.resources | length == 1
        - not ansible_check_mode

    - name: Report the next step
      ansible.builtin.debug:
        msg: >-
          The alert resolves once Prometheus reloads. The incident loop then
          closes the incident, sends one closing message, and stops exposing
          soyspray_incident_undiagnosed_timestamp_seconds for it.
