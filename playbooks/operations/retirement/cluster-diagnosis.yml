---
- name: Retire only the cluster diagnosis writer and its access objects
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    retire_cluster_diagnosis: false
    diagnosis_objects:
      - {api_version: argoproj.io/v1alpha1, kind: Application, namespace: argocd, name: cluster-diagnosis}
      - {api_version: apps/v1, kind: Deployment, namespace: monitoring, name: cluster-diagnosis}
      - {api_version: v1, kind: Service, namespace: monitoring, name: cluster-diagnosis}
      - {api_version: monitoring.coreos.com/v1, kind: ServiceMonitor, namespace: monitoring, name: cluster-diagnosis}
      - {api_version: networking.k8s.io/v1, kind: NetworkPolicy, namespace: monitoring, name: cluster-diagnosis}
      - {api_version: argoproj.io/v1alpha1, kind: AppProject, namespace: argocd, name: cluster-diagnosis}
    diagnosis_protected:
      - {api_version: v1, kind: Secret, namespace: monitoring, name: alertmanager-telegram-secret}
      - {api_version: v1, kind: Namespace, name: monitoring}
      - {api_version: v1, kind: PersistentVolumeClaim, namespace: monitoring, name: cluster-diagnosis-state}
  tasks:
    - name: Require explicit scope and the native root removal
      ansible.builtin.assert:
        that:
          - retire_cluster_diagnosis | bool
          - "'apps/cluster-diagnosis' not in lookup('file', playbook_dir + '/../../../argocd/kustomization.yaml')"
        fail_msg: Remove the diagnosis child through Git before this scoped retirement.

    - name: Read the exact reviewed source revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir }}/../../.."
      register: diagnosis_local_revision
      changed_when: false
      check_mode: false

    - name: Read the delivered main revision
      ansible.builtin.command:
        argv: [git, ls-remote, https://github.com/kpoxo6op/soyspray.git, refs/heads/main]
      register: diagnosis_main_revision
      changed_when: false
      check_mode: false

    - name: Require delivered main for live retirement
      ansible.builtin.assert:
        that:
          - diagnosis_local_revision.stdout == diagnosis_main_revision.stdout.split()[0]
      when: not ansible_check_mode

    - name: Read preserved namespace, ledger claim, and shared delivery identity
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace | default(omit) }}"
        name: "{{ item.name }}"
      loop: "{{ diagnosis_protected }}"
      register: diagnosis_protected_before
      no_log: true

    - name: Require the preserved resources
      ansible.builtin.assert:
        that:
          - diagnosis_protected_before.results | map(attribute='resources') | map('length') | min == 1
        fail_msg: The shared identity, namespace, or retained ledger claim is missing.

    - name: Read only the named retirement objects
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      loop: "{{ diagnosis_objects }}"
      register: diagnosis_read

    - name: Refuse ownership drift before any deletion
      ansible.builtin.assert:
        that:
          - item.resources | length <= 1
          - item.resources | length == 0 or item.resources[0].metadata.labels.get('argocd.argoproj.io/instance', '') == 'cluster-diagnosis' or (item.item.kind in ['Application', 'AppProject'] and item.resources[0].metadata.labels.get('argocd.argoproj.io/instance', '') == 'soyspray')
          - item.resources | length == 0 or item.item.kind != 'Application' or (item.resources[0].spec.source.path == 'apps/cluster-diagnosis' and item.resources[0].spec.source.targetRevision == 'main' and item.resources[0].spec.destination.namespace == 'monitoring' and item.resources[0].metadata.get('finalizers', []) | length == 0)
          - item.resources | length == 0 or item.item.kind != 'AppProject' or (item.resources[0].spec.destinations | length == 1 and item.resources[0].spec.destinations[0].namespace == 'monitoring' and item.resources[0].spec.clusterResourceWhitelist | length == 0)
        fail_msg: A named object does not match the retired diagnosis owner; stop without cleanup.
      loop: "{{ diagnosis_read.results }}"
      loop_control:
        label: "{{ item.item.kind }}/{{ item.item.name }}"

    - name: Delete reviewed objects with UID preconditions and no cascading Application deletion
      kubernetes.core.k8s:
        api_version: "{{ item.item.api_version }}"
        kind: "{{ item.item.kind }}"
        namespace: "{{ item.item.namespace }}"
        name: "{{ item.item.name }}"
        state: absent
        delete_options:
          preconditions:
            uid: "{{ item.resources[0].metadata.uid }}"
          propagationPolicy: Foreground
        wait: true
        wait_timeout: 180
      loop: "{{ diagnosis_read.results }}"
      loop_control:
        label: "{{ item.item.kind }}/{{ item.item.name }}"
      when: item.resources | length == 1

    - name: Read preserved resources after retirement
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace | default(omit) }}"
        name: "{{ item.name }}"
      loop: "{{ diagnosis_protected }}"
      register: diagnosis_protected_after
      no_log: true

    - name: Verify retained data and shared identity without printing private fields
      ansible.builtin.assert:
        that:
          - diagnosis_protected_after.results[item].resources | length == 1
          - diagnosis_protected_before.results[item].resources[0].metadata.uid == diagnosis_protected_after.results[item].resources[0].metadata.uid
          - item != 0 or diagnosis_protected_before.results[item].resources[0].metadata.resourceVersion == diagnosis_protected_after.results[item].resources[0].metadata.resourceVersion
          - item != 2 or diagnosis_protected_before.results[item].resources[0].spec == diagnosis_protected_after.results[item].resources[0].spec
      loop: [0, 1, 2]
      no_log: true

    - name: Verify all named retirement objects are absent
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      loop: "{{ diagnosis_objects }}"
      register: diagnosis_after
      when: not ansible_check_mode

    - name: Require completed scoped retirement
      ansible.builtin.assert:
        that:
          - diagnosis_after.results | map(attribute='resources') | map('length') | max == 0
      when: not ansible_check_mode
