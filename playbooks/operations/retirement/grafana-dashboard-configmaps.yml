---
- name: Retire replaced Grafana dashboard ConfigMaps
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dashboard_namespace: monitoring
    dashboard_label: grafana_dashboard
    dashboard_prefix: grafana-dashboard-
  tasks:
    - name: Read the monitoring Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: kube-prometheus-stack
        namespace: argocd
      register: dashboard_application

    - name: Require a healthy Application before removing anything
      ansible.builtin.assert:
        that:
          - dashboard_application.resources | length == 1
          - dashboard_application.resources[0].status.health.status == 'Healthy'
        fail_msg: Wait for kube-prometheus-stack to be Healthy.

    - name: Require the only drift to be replaced dashboard ConfigMaps
      ansible.builtin.assert:
        that:
          - >-
            dashboard_application.resources[0].status.resources
            | rejectattr('status', 'equalto', 'Synced')
            | rejectattr('kind', 'equalto', 'ConfigMap') | list | length == 0
          - >-
            dashboard_application.resources[0].status.resources
            | rejectattr('status', 'equalto', 'Synced')
            | map(attribute='name') | select('match', '^' + dashboard_prefix)
            | list | length
            == dashboard_application.resources[0].status.resources
            | rejectattr('status', 'equalto', 'Synced') | list | length
        fail_msg: >-
          The Application has drift beyond replaced dashboard ConfigMaps. Resolve
          that first; this operation only removes the ConfigMaps a newer
          revision replaced, which is why the Application cannot reach Synced on
          its own.

    - name: Select the ConfigMaps the Application declares
      ansible.builtin.set_fact:
        dashboard_desired: >-
          {{ dashboard_application.resources[0].status.resources
             | selectattr('kind', 'equalto', 'ConfigMap')
             | map(attribute='name')
             | select('match', '^' + dashboard_prefix)
             | list }}

    - name: Read the live dashboard ConfigMaps
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: "{{ dashboard_namespace }}"
        label_selectors:
          - "{{ dashboard_label }}=1"
      register: dashboard_live

    - name: Select the replaced ConfigMaps
      ansible.builtin.set_fact:
        dashboard_stale: >-
          {{ dashboard_live.resources
             | map(attribute='metadata.name')
             | select('match', '^' + dashboard_prefix)
             | difference(dashboard_desired) | list }}

    - name: Report the plan
      ansible.builtin.debug:
        msg:
          declared: "{{ dashboard_desired | sort }}"
          replaced: "{{ dashboard_stale | sort }}"

    - name: Require a replacement for every ConfigMap to remove
      ansible.builtin.assert:
        that:
          - dashboard_desired | length > 0
          - dashboard_stale | select('match', '^' + dashboard_prefix) | list | length == dashboard_stale | length
        fail_msg: >-
          Refusing to remove a ConfigMap outside {{ dashboard_prefix }} or while
          no replacement ConfigMap is declared.

    - name: Remove the replaced dashboard ConfigMaps
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: "{{ item }}"
        namespace: "{{ dashboard_namespace }}"
        state: absent
        wait: true
      loop: "{{ dashboard_stale }}"
      when: dashboard_stale | length > 0

    - name: Read the remaining dashboard ConfigMaps
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: "{{ dashboard_namespace }}"
        label_selectors:
          - "{{ dashboard_label }}=1"
      register: dashboard_remaining

    - name: Require exactly one ConfigMap per declared dashboard
      ansible.builtin.assert:
        that:
          - >-
            dashboard_remaining.resources | map(attribute='metadata.name')
            | select('match', '^' + dashboard_prefix) | list | sort
            == dashboard_desired | sort
        fail_msg: >-
          A dashboard is still duplicated or missing. Grafana's sidecar writes one
          file per ConfigMap, so a leftover copy overwrites the current view.
