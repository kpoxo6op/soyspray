---
- name: Discover all currently installed Kong CRDs
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ kubeconfig_path }}", get, crds, -o, json]
  register: bank_current_crds
  changed_when: false
  check_mode: false

- name: Select Kong definitions without including Gateway API definitions
  ansible.builtin.set_fact:
    bank_kong_resources: >-
      {{ (bank_current_crds.stdout | from_json)['items']
         | selectattr('spec.group', 'search', '(^|[.])konghq[.]com$') | list }}

- name: Refuse to remove an unknown Kong definition
  ansible.builtin.assert:
    that:
      - bank_kong_resources | map(attribute='metadata.name') | list | difference(bank_kong_crds) | length == 0

- name: List every Kong instance across all namespaces
  kubernetes.core.k8s_info:
    api_version: "{{ item.spec.group }}/{{ (item.spec.versions | selectattr('storage') | first).name }}"
    kind: "{{ item.spec.names.kind }}"
    kubeconfig: "{{ kubeconfig_path }}"
  loop: "{{ bank_kong_resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: bank_instances

- name: Stop if any Kong instance remains
  ansible.builtin.assert:
    that:
      - item.resources | length == 0
    fail_msg: A Kong custom resource remains. Preserve its CRD and inspect the owner before retirement.
  loop: "{{ bank_instances.results }}"
  loop_control:
    label: "{{ item.item.metadata.name }}"
