---
- name: Confirm the survivor cluster before node-2 rejoin
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    recovery_target: node-2
    recovery_target_ip: 192.168.20.12
    node2_repository_root: "{{ (playbook_dir + '/../../..') | realpath }}"
    etcdctl_bin: "{{ bin_dir | default('/usr/local/bin') }}/etcdctl"
    etcd_cert_dir: /etc/ssl/etcd/ssl
    etcdctl_environment:
      ETCDCTL_API: "3"
      ETCDCTL_ENDPOINTS: https://127.0.0.1:2379
      ETCDCTL_CACERT: "{{ etcd_cert_dir }}/ca.pem"
      ETCDCTL_CERT: "{{ etcd_cert_dir }}/admin-{{ inventory_hostname }}.pem"
      ETCDCTL_KEY: "{{ etcd_cert_dir }}/admin-{{ inventory_hostname }}-key.pem"
  tasks:
    - name: Require the exact retained-OS rejoin boundary
      ansible.builtin.assert:
        that:
          - recovery_target == 'node-2'
          - hostvars[recovery_target].ansible_host == recovery_target_ip
          - node2_rejoin_authorization | default('') == 'rejoin-node-2-retained-os'
          - node2_evacuation_evidence_file | default('') is match('^/')
          - node2_recovery_git_revision | default('') is match('^[0-9a-f]{40}$')
          - node2_recovery_git_revision == lookup('pipe', 'git -C ' + (node2_repository_root | quote) + ' rev-parse HEAD')
          - node2_recovery_git_revision == lookup('pipe', 'git -C ' + (node2_repository_root | quote) + ' rev-parse origin/main')
          - lookup('pipe', 'git -C ' + (node2_repository_root | quote) + ' status --porcelain --untracked-files=no') | length == 0
          - not (ignore_assert_errors | default(false) | bool)
          - ansible_limit | default('') | length == 0
          - ansible_run_tags | default(['all']) == ['all']
          - ansible_skip_tags | default([]) | length == 0
        fail_msg: Rejoin only node-2 from the exact delivered recovery source.

    - name: Load the evacuation plan
      ansible.builtin.set_fact:
        node2_evacuation_plan: "{{ lookup('file', node2_evacuation_evidence_file) | from_json }}"

    - name: Read the two survivor nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_survivor_nodes

    - name: Read survivor etcd status
      ansible.builtin.command:
        argv: ["{{ etcdctl_bin }}", endpoint, status, --cluster, -w, json]
      environment: "{{ etcdctl_environment }}"
      register: node2_survivor_etcd
      changed_when: false
      check_mode: false

    - name: Require the authoritative survivor or resumed cluster
      ansible.builtin.assert:
        that:
          - node2_evacuation_plan.target == recovery_target
          - node2_survivor_nodes.resources | length in [2, 3]
          - >-
            node2_survivor_nodes.resources | map(attribute='metadata.name') | sort | list
            == (['node-0', 'node-1'] if node2_survivor_nodes.resources | length == 2
                else ['node-0', 'node-1', 'node-2'])
          - >-
            node2_survivor_nodes.resources
            | map(attribute='status.conditions') | flatten
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length
            == node2_survivor_nodes.resources | length
          - >-
            (node2_survivor_etcd.stdout | from_json) | length
            == node2_survivor_nodes.resources | length
          - (node2_survivor_etcd.stdout | from_json) | map(attribute='Status.header.cluster_id') | unique | list | length == 1

    - name: Recognize an exact partially completed rejoin
      ansible.builtin.set_fact:
        node2_rejoin_resumed: "{{ node2_survivor_nodes.resources | length == 3 }}"

    - name: Require a safe new identity before resuming Kubespray
      ansible.builtin.assert:
        that:
          - >-
            node2_survivor_nodes.resources
            | selectattr('metadata.name', 'equalto', recovery_target)
            | map(attribute='metadata.uid')
            | reject('equalto', node2_evacuation_plan.kubernetes_node_uid)
            | list | length == 1
          - >-
            (node2_survivor_etcd.stdout | from_json)
            | map(attribute='Status.header.member_id') | unique | list | length == 3
        fail_msg: Refuse to resume unless node-2 has a new identity in the healthy original cluster.
      when: node2_rejoin_resumed

    - name: Record the survivor etcd cluster identity
      ansible.builtin.set_fact:
        node2_survivor_cluster_id: >-
          {{ ((node2_survivor_etcd.stdout | from_json) | first).Status.header.cluster_id }}

    - name: Read an interrupted cert-manager namespace migration
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: cert-manager
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_cert_manager_namespace

    - name: Read ACME challenges blocking the interrupted migration
      kubernetes.core.k8s_info:
        api_version: acme.cert-manager.io/v1
        kind: Challenge
        namespace: cert-manager
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_cert_manager_challenges
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Require only failed pending ACME challenges before finalizer recovery
      ansible.builtin.assert:
        that:
          - node2_cert_manager_challenges.resources | length > 0
          - >-
            node2_cert_manager_challenges.resources
            | map(attribute='metadata.finalizers') | flatten | unique | list
            == ['acme.cert-manager.io/finalizer']
          - >-
            node2_cert_manager_challenges.resources
            | map(attribute='status.state') | unique | list == ['pending']
        fail_msg: Refuse to alter an interrupted cert-manager namespace with unknown blockers.
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Read the cert-manager webhook service during interrupted migration
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: cert-manager
        name: cert-manager-webhook
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_cert_manager_webhook_service
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Require the cert-manager webhook service to be absent
      ansible.builtin.assert:
        that: node2_cert_manager_webhook_service.resources | length == 0
        fail_msg: Refuse to remove admission registrations while the cert-manager webhook service exists.
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Remove orphaned cert-manager admission registrations
      kubernetes.core.k8s:
        api_version: admissionregistration.k8s.io/v1
        kind: "{{ item }}"
        name: cert-manager-webhook
        state: absent
        kubeconfig: "{{ kubeconfig_path }}"
      loop:
        - ValidatingWebhookConfiguration
        - MutatingWebhookConfiguration
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Release failed pending ACME challenges from the interrupted migration
      kubernetes.core.k8s:
        api_version: acme.cert-manager.io/v1
        kind: Challenge
        namespace: cert-manager
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            finalizers: []
        merge_type: merge
        state: patched
        kubeconfig: "{{ kubeconfig_path }}"
      loop: "{{ node2_cert_manager_challenges.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

    - name: Wait for the interrupted cert-manager namespace deletion
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: cert-manager
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_cert_manager_namespace_deleted
      until: node2_cert_manager_namespace_deleted.resources | length == 0
      retries: 30
      delay: 2
      when:
        - not ansible_check_mode
        - node2_cert_manager_namespace.resources | length == 1
        - node2_cert_manager_namespace.resources[0].metadata.deletionTimestamp is defined

- name: Confirm the retained node-2 host baseline
  hosts: node-2
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    expected_target_ip: 192.168.20.12
    expected_root_uuid: d3507a31-6115-4f40-affc-ca5164120e50
    expected_root_model: SAMSUNG MZVLB256HAHQ-000L7
    expected_storage_uuid: 49c092f4-dd55-41f5-99c6-854f8b44af4e
    expected_storage_model: PNY 500GB SATA S
  tasks:
    - name: Read retained filesystems before rejoin
      ansible.builtin.command:
        argv: [findmnt, -J, -o, "SOURCE,TARGET,FSTYPE,UUID", --target, "{{ item }}"]
      loop: ['/', /storage]
      register: node2_rejoin_mounts
      changed_when: false
      check_mode: false

    - name: Read retained disk models before rejoin
      ansible.builtin.command:
        argv: [lsblk, -dn, -o, MODEL, "{{ item }}"]
      loop: [/dev/nvme0n1, /dev/sda]
      register: node2_rejoin_models
      changed_when: false
      check_mode: false

    - name: Read cluster service states before rejoin
      ansible.builtin.command:
        argv: [systemctl, is-active, kubelet.service, containerd.service, etcd.service]
      register: node2_rejoin_services
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read removed cluster paths before rejoin
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
        - /var/lib/containerd
        - /etc/cni
        - /var/lib/cni
        - /var/lib/longhorn
      register: node2_rejoin_paths

    - name: Require the retained disk identity before Kubespray
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'node-2'
          - ansible_host == expected_target_ip
          - (node2_rejoin_mounts.results[0].stdout | from_json).filesystems[0].uuid == expected_root_uuid
          - (node2_rejoin_mounts.results[1].stdout | from_json).filesystems[0].uuid == expected_storage_uuid
          - node2_rejoin_models.results[0].stdout | trim == expected_root_model
          - node2_rejoin_models.results[1].stdout | trim == expected_storage_model

    - name: Require the clean retained host before the first Kubespray join
      ansible.builtin.assert:
        that:
          - node2_rejoin_services.stdout_lines | select('equalto', 'active') | list | length == 0
          - node2_rejoin_paths.results | selectattr('stat.exists') | list | length == 0
      when: not hostvars[groups['kube_control_plane'][0]].node2_rejoin_resumed

    - name: Require the matching joined host before a Kubespray resume
      ansible.builtin.assert:
        that:
          - node2_rejoin_services.stdout_lines | select('equalto', 'active') | list | length == 3
          - >-
            ['/etc/kubernetes', '/var/lib/kubelet', '/var/lib/etcd', '/var/lib/containerd']
            | difference(node2_rejoin_paths.results | selectattr('stat.exists') | map(attribute='item') | list)
            | length == 0
      when: hostvars[groups['kube_control_plane'][0]].node2_rejoin_resumed

- name: Prepare the existing node-2 storage filesystem
  ansible.builtin.import_playbook: ../storage/prepare-existing-longhorn-storage.yml

- name: Rejoin node-2 through the pinned full Kubespray cluster play
  ansible.builtin.import_playbook: >-
    {{ '../../../kubespray/cluster.yml'
       if (node2_rejoin_apply | default(false) | bool)
       else 'check-node2-rejoin.yml' }}

- name: Verify the new node-2 member in the original cluster
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    recovery_target: node-2
    etcdctl_bin: "{{ bin_dir | default('/usr/local/bin') }}/etcdctl"
    etcd_cert_dir: /etc/ssl/etcd/ssl
    etcdctl_environment:
      ETCDCTL_API: "3"
      ETCDCTL_ENDPOINTS: https://127.0.0.1:2379
      ETCDCTL_CACERT: "{{ etcd_cert_dir }}/ca.pem"
      ETCDCTL_CERT: "{{ etcd_cert_dir }}/admin-{{ inventory_hostname }}.pem"
      ETCDCTL_KEY: "{{ etcd_cert_dir }}/admin-{{ inventory_hostname }}-key.pem"
  tasks:
    - name: Reload the evacuation plan
      ansible.builtin.set_fact:
        node2_evacuation_plan: "{{ lookup('file', node2_evacuation_evidence_file) | from_json }}"
      when: not ansible_check_mode

    - name: Read all rejoined Kubernetes nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ kubeconfig_path }}"
      register: node2_rejoined_nodes
      when: not ansible_check_mode

    - name: Read all rejoined etcd members
      ansible.builtin.command:
        argv: ["{{ etcdctl_bin }}", endpoint, status, --cluster, -w, json]
      environment: "{{ etcdctl_environment }}"
      register: node2_rejoined_etcd
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Require a new node identity in the original three-member cluster
      ansible.builtin.assert:
        that:
          - node2_rejoined_nodes.resources | length == 3
          - >-
            node2_rejoined_nodes.resources
            | selectattr('metadata.name', 'equalto', recovery_target)
            | map(attribute='metadata.uid') | reject('equalto', node2_evacuation_plan.kubernetes_node_uid)
            | list | length == 1
          - >-
            node2_rejoined_nodes.resources
            | map(attribute='status.conditions') | flatten
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length == 3
          - (node2_rejoined_etcd.stdout | from_json) | length == 3
          - >-
            (node2_rejoined_etcd.stdout | from_json)
            | map(attribute='Status.header.cluster_id') | map('string') | unique | list
            == [hostvars[groups['kube_control_plane'][0]].node2_survivor_cluster_id | string]
          - >-
            (node2_rejoined_etcd.stdout | from_json)
            | map(attribute='Status.header.member_id') | unique | list | length == 3
        fail_msg: Node-2 did not rejoin as a new member of the original healthy cluster.
      when: not ansible_check_mode
