---
- name: Check the requested drill target
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require one non-first member and the complete three-node inventory
      ansible.builtin.assert:
        that:
          - drill_node | default('') in ['node-2', 'node-1']
          - drill_operation | default('') in ['remove', 'readd']
          - node | default(drill_node) == drill_node
          - ansible_limit | default('') | length == 0
          - ansible_run_tags | default(['all']) == ['all']
          - ansible_skip_tags | default([]) | length == 0
          - not ansible_check_mode
        fail_msg: Use a single drill_node, no CLI filters, and an explicit confirmation. Check mode is not a rebuild simulation.

    - name: Require the maintained inventory and confirm the selected disruption mode
      ansible.builtin.assert:
        that:
          - groups['kube_control_plane'] | sort == ['node-0', 'node-1', 'node-2']
          - groups['etcd'] | sort == ['node-0', 'node-1', 'node-2']
          - groups['kube_node'] | sort == ['node-0', 'node-1', 'node-2']
          - groups['kube_control_plane'][0] == 'node-0'
          - groups['etcd'][0] == 'node-0'
          - hostvars[drill_node].ansible_host == {'node-1':'192.168.20.11', 'node-2':'192.168.20.12'}[drill_node]
          - not (flush_iptables | default(false) | bool)
          - not (reset_restart_network | default(false) | bool)
          - reset_nodes | default(true) | bool
          - (allow_ungraceful_removal | default(drill_disrupt | default(false)) | bool) == (drill_disrupt | default(false) | bool)
          - >-
            drill_confirm | default('') ==
            ((('lose' if drill_disrupt | default(false) | bool else 'remove')
            if drill_operation == 'remove' else 'readd') + ' ' + drill_node)
        fail_msg: The target, inventory, reset settings, or confirmation differs from the documented v2 drill.
