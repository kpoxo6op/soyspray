---
- name: Serve the private Soyspray assembly helper on node-1
  hosts: node-1
  gather_facts: false
  become: true
  vars:
    assembly_source: "{{ lookup('ansible.builtin.env', 'ASSEMBLY_GUIDE_SOURCE_DIR') }}"
    assembly_target: /srv/soyspray-assembly-guide
    assembly_files:
      - index.html
      - app.js
      - app.css
  tasks:
    - name: Require the intended node and a local source directory
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'node-1'
          - assembly_source | length > 0
          - assembly_source is match('^/')

    - name: Inspect each local static file
      ansible.builtin.stat:
        path: "{{ assembly_source }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop: "{{ assembly_files }}"
      register: assembly_sources

    - name: Require all three regular files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
      loop: "{{ assembly_sources.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect Tailscale node identity
      ansible.builtin.command:
        argv: [tailscale, status, --json]
      register: tailscale_identity
      changed_when: false

    - name: Require the running node-1 tailnet identity
      ansible.builtin.assert:
        that:
          - (tailscale_identity.stdout | from_json).BackendState == 'Running'
          - (tailscale_identity.stdout | from_json).Self.HostName == 'node-1'
          - (tailscale_identity.stdout | from_json).Self.DNSName | length > 0

    - name: Inspect existing Serve and Funnel routes
      ansible.builtin.command:
        argv: [tailscale, serve, status, --json]
      register: serve_before
      changed_when: false

    - name: Protect other routes and reject Funnel
      ansible.builtin.assert:
        that:
          - (serve_before.stdout | from_json).get('Funnel', {}) | length == 0
          - (serve_before.stdout | from_json) == {} or assembly_target in serve_before.stdout
        fail_msg: node-1 has a different Serve route or Funnel; no site files were changed.

    - name: Create private site directory
      ansible.builtin.file:
        path: "{{ assembly_target }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy the reviewed static bundle
      ansible.builtin.copy:
        src: "{{ assembly_source }}/{{ item }}"
        dest: "{{ assembly_target }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ assembly_files }}"

    - name: Enable tailnet-only HTTPS for the site
      ansible.builtin.command:
        argv: [tailscale, serve, --bg, --yes, "{{ assembly_target }}"]
      when: (serve_before.stdout | from_json) == {}

    - name: Verify the resulting private route
      ansible.builtin.command:
        argv: [tailscale, serve, status, --json]
      register: serve_after
      changed_when: false

    - name: Require the intended directory and no Funnel
      ansible.builtin.assert:
        that:
          - assembly_target in serve_after.stdout
          - (serve_after.stdout | from_json).get('Funnel', {}) | length == 0
