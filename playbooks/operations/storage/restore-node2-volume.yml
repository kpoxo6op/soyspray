---
- name: Read the recorded volume before restoring its policy
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_volume_before_restore

- name: Require the evacuated volume identity and health
  ansible.builtin.assert:
    that:
      - node2_volume_before_restore.resources | length == 1
      - node2_volume_before_restore.resources[0].metadata.uid == node2_volume_entry.uid
      - >-
        node2_volume_before_restore.resources[0].spec.numberOfReplicas | int
        in [2, node2_volume_entry.restore_replicas | int]
      - node2_volume_before_restore.resources[0].status.robustness == 'healthy'

- name: Restore the recorded replica count
  kubernetes.core.k8s_json_patch:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
    patch: >-
      {{ [{'op': 'test', 'path': '/metadata/uid', 'value': node2_volume_entry.uid},
          {'op': 'test', 'path': '/spec', 'value': node2_volume_before_restore.resources[0].spec},
          {'op': 'replace', 'path': '/spec/numberOfReplicas', 'value': node2_volume_entry.restore_replicas | int}] }}
  when: >-
    node2_volume_before_restore.resources[0].spec.numberOfReplicas | int
    != node2_volume_entry.restore_replicas | int

- name: Wait for the restored replica policy
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_volume_after_restore
  until:
    - node2_volume_after_restore.resources | length == 1
    - node2_volume_after_restore.resources[0].spec.numberOfReplicas | int == node2_volume_entry.restore_replicas | int
    - node2_volume_after_restore.resources[0].status.robustness == 'healthy'
  retries: 360
  delay: 10
  when: not ansible_check_mode
- name: Read the restored live replicas
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Replica
    namespace: longhorn-system
    label_selectors:
      - "longhornvolume={{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_replicas_after_restore
  until:
    - >-
      node2_replicas_after_restore.resources
      | selectattr('spec.failedAt', 'equalto', '')
      | selectattr('status.currentState', 'equalto', 'running')
      | list | length == node2_volume_entry.restore_replicas | int
  retries: 360
  delay: 10
  when: not ansible_check_mode

- name: Wait for synchronized read-write engine copies
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Engine
    namespace: longhorn-system
    label_selectors:
      - "longhornvolume={{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_engines_after_restore
  until:
    - node2_engines_after_restore.resources | length == 1
    - >-
      node2_engines_after_restore.resources[0].status.replicaModeMap | default({}) | dict2items
      | selectattr('value', 'equalto', 'RW') | list | length == node2_volume_entry.restore_replicas | int
  retries: 360
  delay: 10
  when: not ansible_check_mode

- name: Require the recorded healthy replica count
  ansible.builtin.assert:
    that:
      - >-
        node2_replicas_after_restore.resources
        | selectattr('spec.failedAt', 'equalto', '')
        | selectattr('status.currentState', 'equalto', 'running')
        | list | length == node2_volume_entry.restore_replicas | int
      - >-
        node2_volume_entry.restore_replicas | int != 3 or
        recovery_target in (node2_replicas_after_restore.resources | map(attribute='spec.nodeID') | list)
  when: not ansible_check_mode
