---
- name: Adopt the configured replica count for existing Longhorn CSI controllers
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    csi_controllers:
      - csi-attacher
      - csi-provisioner
      - csi-resizer
      - csi-snapshotter
  tasks:
    - name: Read the existing controllers
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: longhorn-system
        name: "{{ item }}"
        kubeconfig: "{{ kubeconfig_path }}"
      loop: "{{ csi_controllers }}"
      register: csi_deployments

    - name: Check identities and availability before changing any controller
      ansible.builtin.assert:
        quiet: true
        that:
          - item.resources | length == 1
          - item.resources[0].spec.replicas in [1, 3]
          - item.resources[0].status.availableReplicas | default(0) >= 1
          - item.resources[0].spec.selector.matchLabels.app == item.item
          - item.resources[0].spec.template.spec.serviceAccountName == 'longhorn-service-account'
      loop: "{{ csi_deployments.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Increase replicas without replacing controller identities or templates
      kubernetes.core.k8s_json_patch:
        api_version: apps/v1
        kind: Deployment
        namespace: longhorn-system
        name: "{{ item.item }}"
        kubeconfig: "{{ kubeconfig_path }}"
        patch: >-
          {{ [
            {'op': 'test', 'path': '/metadata/uid', 'value': item.resources[0].metadata.uid},
            {'op': 'test', 'path': '/spec', 'value': item.resources[0].spec},
            {'op': 'replace', 'path': '/spec/replicas', 'value': 3}
          ] }}
      loop: "{{ csi_deployments.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.resources[0].spec.replicas != 3

    - name: Wait for all three controller replicas
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: longhorn-system
        name: "{{ item }}"
        kubeconfig: "{{ kubeconfig_path }}"
      loop: "{{ csi_controllers }}"
      register: csi_result
      until: csi_result.resources[0].status.availableReplicas | default(0) == 3
      retries: 60
      delay: 5
      when: not ansible_check_mode
