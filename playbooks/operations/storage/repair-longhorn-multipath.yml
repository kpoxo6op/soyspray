---
- name: Release an unused multipath map for an explicitly selected Longhorn claim
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
  tasks:
    - name: Require an explicit namespace and claim
      ansible.builtin.assert:
        that:
          - storage_namespace is defined
          - storage_claim is defined
          - storage_namespace | length > 0
          - storage_claim | length > 0

    - name: Read the existing selected claim
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ storage_namespace }}"
        name: "{{ storage_claim }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: storage_pvc

    - name: Require the bound Longhorn filesystem claim
      ansible.builtin.assert:
        that:
          - storage_pvc.resources | length == 1
          - storage_pvc.resources[0].status.phase == 'Bound'
          - storage_pvc.resources[0].spec.storageClassName == 'longhorn'
          - storage_pvc.resources[0].spec.volumeMode | default('Filesystem') == 'Filesystem'

    - name: Read its Longhorn volume
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ storage_pvc.resources[0].spec.volumeName }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: storage_volume

    - name: Require healthy attached storage on an inventory node
      ansible.builtin.assert:
        that:
          - storage_volume.resources | length == 1
          - storage_volume.resources[0].status.state == 'attached'
          - storage_volume.resources[0].status.robustness == 'healthy'
          - storage_volume.resources[0].status.currentNodeID in groups['kube_node']
          - storage_volume.resources[0].status.currentNodeID == storage_volume.resources[0].spec.nodeID
          - storage_volume.resources[0].status.kubernetesStatus.namespace == storage_namespace
          - storage_volume.resources[0].status.kubernetesStatus.pvcName == storage_claim

    - name: Inspect and repair only the node holding the selected volume
      delegate_to: "{{ storage_volume.resources[0].status.currentNodeID }}"
      connection: ssh
      become: true
      vars:
        storage_device: "/dev/longhorn/{{ storage_pvc.resources[0].spec.volumeName }}"
      block:
        - name: Verify the Longhorn path and refuse a map with users or other disks
          ansible.builtin.command:
            argv: [python3, '-', "{{ storage_device }}"]
            stdin: |
              import json, os, pathlib, re, stat, subprocess, sys
              device = pathlib.Path(sys.argv[1])
              assert stat.S_ISBLK(device.stat().st_mode), 'Expected a block device'
              def properties(path):
                  result = subprocess.check_output(
                      ['udevadm', 'info', '-q', 'property', str(path)], text=True)
                  return dict(line.split('=', 1) for line in result.splitlines() if '=' in line)
              props = properties(device)
              expected = '-iscsi-iqn.2019-10.io.longhorn:' + device.name + '-lun-1'
              assert props.get('ID_PATH', '').endswith(expected), 'Not the selected Longhorn LUN'
              wwid = props['ID_SERIAL']
              assert re.fullmatch('[0-9a-f]+', wwid), 'Invalid WWID'
              for disk in pathlib.Path('/sys/class/block').glob('sd*'):
                  other = properties('/dev/' + disk.name)
                  if other.get('ID_SERIAL') == wwid:
                      assert '-iscsi-iqn.2019-10.io.longhorn:' in other.get('ID_PATH', ''), \
                          'WWID also belongs to non-Longhorn storage'
              info = device.stat()
              block = pathlib.Path('/sys/dev/block') / f'{os.major(info.st_rdev)}:{os.minor(info.st_rdev)}'
              holders = list((block / 'holders').iterdir())
              name = None
              if holders:
                  assert len(holders) == 1, 'Unexpected device holders'
                  holder = holders[0]
                  assert (holder / 'dm/uuid').read_text().strip() == 'mpath-' + wwid
                  assert [p.name for p in (holder / 'slaves').iterdir()] == [block.resolve().name], \
                      'Multipath map contains other disks'
                  name = (holder / 'dm/name').read_text().strip()
                  opened = subprocess.check_output(
                      ['dmsetup', 'info', '-C', '--noheadings', '-o', 'open', name], text=True)
                  assert int(opened.strip()) == 0, 'Multipath map is in use; refusing repair'
              print(json.dumps({'wwid': wwid, 'map': name}))
          register: storage_map_inspection
          changed_when: false
          check_mode: false

        - name: Record the verified map identity
          ansible.builtin.set_fact:
            storage_map: "{{ storage_map_inspection.stdout | from_json }}"

        - name: Create the multipath configuration fragment directory
          ansible.builtin.file:
            path: /etc/multipath/conf.d
            state: directory
            mode: '0755'

        - name: Exclude only the verified Longhorn WWID from multipath
          ansible.builtin.copy:
            dest: /etc/multipath/conf.d/soyspray-longhorn.conf
            mode: '0644'
            content: |
              # Managed by Soyspray repair-longhorn-multipath.yml.
              blacklist {
                  wwid "{{ storage_map.wwid }}"
              }
          register: storage_blacklist

        - name: Check that multipath loads the exclusion
          ansible.builtin.command:
            argv: [multipath, '-t']
          register: storage_multipath_config
          changed_when: false
          when: not ansible_check_mode

        - name: Require the exclusion in the effective configuration
          ansible.builtin.assert:
            that: >-
              storage_multipath_config.stdout is search(
                'blacklist\s*\{[^}]*wwid\s+"' ~ storage_map.wwid ~ '"')
          when: not ansible_check_mode

        - name: Reload multipath without restarting other storage
          ansible.builtin.command:
            argv: [multipathd, reconfigure]
          changed_when: true
          when:
            - not ansible_check_mode
            - storage_blacklist.changed or storage_map.map is not none

        - name: Release only the verified unused map
          ansible.builtin.command:
            argv: [multipath, '-f', "{{ storage_map.map }}"]
          changed_when: true
          when:
            - not ansible_check_mode
            - storage_map.map is not none

    - name: Recheck the original claim identity
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ storage_namespace }}"
        name: "{{ storage_claim }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: storage_pvc_after

    - name: Require the same claim and volume after repair
      ansible.builtin.assert:
        that:
          - storage_pvc_after.resources[0].metadata.uid == storage_pvc.resources[0].metadata.uid
          - storage_pvc_after.resources[0].spec.volumeName == storage_pvc.resources[0].spec.volumeName
