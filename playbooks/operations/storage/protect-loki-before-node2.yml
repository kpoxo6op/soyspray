---
- name: Protect Loki before node-2 storage evacuation
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    loki_namespace: monitoring
    loki_claim: storage-loki-0
    loki_claim_uid: c43a407a-b315-458d-b6ab-a73aa882c0fb
    loki_volume: pvc-c43a407a-b315-458d-b6ab-a73aa882c0fb
    removal_target: node-2
  tasks:
    - name: Read the Loki claim
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ loki_namespace }}"
        name: "{{ loki_claim }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: loki_pvc

    - name: Read the Loki Longhorn volume
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ loki_volume }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: loki_volume_before

    - name: Read the current Loki replicas
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Replica
        namespace: longhorn-system
        label_selectors:
          - "longhornvolume={{ loki_volume }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: loki_replicas_before

    - name: Require the sole healthy target replica and original identity
      ansible.builtin.assert:
        that:
          - loki_pvc.resources | length == 1
          - loki_pvc.resources[0].metadata.uid == loki_claim_uid
          - loki_pvc.resources[0].spec.volumeName == loki_volume
          - loki_volume_before.resources | length == 1
          - loki_volume_before.resources[0].metadata.name == loki_volume
          - loki_volume_before.resources[0].status.robustness == 'healthy'
          - loki_volume_before.resources[0].spec.numberOfReplicas in [1, 2]
          - >-
            loki_replicas_before.resources
            | rejectattr('spec.failedAt')
            | selectattr('status.currentState', 'equalto', 'running')
            | map(attribute='spec.nodeID')
            | list
            | unique
            | length == loki_volume_before.resources[0].spec.numberOfReplicas
          - >-
            loki_volume_before.resources[0].spec.numberOfReplicas == 2 or
            (loki_replicas_before.resources | map(attribute='spec.nodeID') | list) == [removal_target]
        fail_msg: >-
          Loki no longer has the reviewed claim, volume, health, or replica
          placement. Stop before changing its replica policy.

    - name: Add one native Loki replica
      kubernetes.core.k8s_json_patch:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ loki_volume }}"
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/uid
            value: "{{ loki_volume_before.resources[0].metadata.uid }}"
          - op: test
            path: /spec
            value: "{{ loki_volume_before.resources[0].spec }}"
          - op: replace
            path: /spec/numberOfReplicas
            value: 2
      when: loki_volume_before.resources[0].spec.numberOfReplicas == 1

    - name: Wait for two healthy Loki replicas
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Replica
        namespace: longhorn-system
        label_selectors:
          - "longhornvolume={{ loki_volume }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: loki_replicas_after
      until:
        - >-
          loki_replicas_after.resources
          | rejectattr('spec.failedAt')
          | selectattr('status.currentState', 'equalto', 'running')
          | map(attribute='spec.nodeID')
          | list
          | unique
          | length == 2
        - removal_target in (loki_replicas_after.resources | map(attribute='spec.nodeID') | list)
        - >-
          loki_replicas_after.resources
          | map(attribute='spec.nodeID')
          | reject('equalto', removal_target)
          | list
          | length == 1
      retries: 120
      delay: 5
      when: not ansible_check_mode

    - name: Require the protected Loki volume
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ loki_volume }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: loki_volume_after
      until:
        - loki_volume_after.resources | length == 1
        - loki_volume_after.resources[0].spec.numberOfReplicas == 2
        - loki_volume_after.resources[0].status.robustness == 'healthy'
      retries: 60
      delay: 5
      when: not ansible_check_mode
