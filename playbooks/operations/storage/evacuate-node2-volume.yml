---
- name: Read the current evacuation volume
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_current_evacuation_volume

- name: Read the current evacuation replicas
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Replica
    namespace: longhorn-system
    label_selectors:
      - "longhornvolume={{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_current_evacuation_replicas

- name: Select current healthy replicas
  ansible.builtin.set_fact:
    node2_current_live_replicas: >-
      {{ node2_current_evacuation_replicas.resources
         | selectattr('spec.failedAt', 'equalto', '')
         | selectattr('status.currentState', 'equalto', 'running') | list }}
    node2_current_target_replicas: >-
      {{ node2_current_evacuation_replicas.resources
         | selectattr('spec.failedAt', 'equalto', '')
         | selectattr('status.currentState', 'equalto', 'running')
         | selectattr('spec.nodeID', 'equalto', removal_target) | list }}
    node2_current_survivor_nodes: >-
      {{ node2_current_evacuation_replicas.resources
         | selectattr('spec.failedAt', 'equalto', '')
         | selectattr('status.currentState', 'equalto', 'running')
         | rejectattr('spec.nodeID', 'equalto', removal_target)
         | map(attribute='spec.nodeID') | unique | sort | list }}

- name: Require a safe initial or retry state
  ansible.builtin.assert:
    that:
      - node2_current_evacuation_volume.resources | length == 1
      - node2_current_evacuation_volume.resources[0].metadata.uid == node2_volume_entry.uid
      - node2_current_evacuation_volume.resources[0].status.robustness == 'healthy'
      - node2_current_evacuation_volume.resources[0].spec.numberOfReplicas | int in [2, 3]
      - node2_current_live_replicas | length == node2_current_evacuation_volume.resources[0].spec.numberOfReplicas | int
      - node2_current_target_replicas | length in [0, 1]
      - node2_current_target_replicas | length == 1 or node2_current_survivor_nodes == ['node-0', 'node-1']
      - node2_current_target_replicas | length == 0 or node2_current_survivor_nodes | length >= 1
    fail_msg: "{{ node2_volume_entry.name }} is not safe to continue or retry evacuation."

- name: Temporarily use the two survivor replicas
  kubernetes.core.k8s_json_patch:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
    patch:
      - {op: test, path: /metadata/uid, value: "{{ node2_volume_entry.uid }}"}
      - {op: test, path: /spec, value: "{{ node2_current_evacuation_volume.resources[0].spec }}"}
      - {op: replace, path: /spec/numberOfReplicas, value: 2}
  when: node2_current_evacuation_volume.resources[0].spec.numberOfReplicas | int == 3
