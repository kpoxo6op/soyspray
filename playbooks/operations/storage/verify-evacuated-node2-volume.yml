---
- name: Read the evacuated volume
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Volume
    namespace: longhorn-system
    name: "{{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_evacuated_volume

- name: Read the evacuated volume replicas
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Replica
    namespace: longhorn-system
    label_selectors:
      - "longhornvolume={{ node2_volume_entry.name }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: node2_evacuated_replicas

- name: Require two healthy survivor replicas
  ansible.builtin.assert:
    that:
      - node2_evacuated_volume.resources | length == 1
      - node2_evacuated_volume.resources[0].metadata.uid == node2_volume_entry.uid
      - node2_evacuated_volume.resources[0].spec.numberOfReplicas | int == 2
      - node2_evacuated_volume.resources[0].status.robustness == 'healthy'
      - >-
        node2_evacuated_replicas.resources
        | selectattr('spec.failedAt', 'equalto', '')
        | selectattr('status.currentState', 'equalto', 'running')
        | rejectattr('spec.nodeID', 'equalto', removal_target)
        | map(attribute='spec.nodeID') | unique | list | length == 2
    fail_msg: "{{ node2_volume_entry.name }} is not healthy on both survivors."
