---
- name: Set the deliberate replica policy for disposable monitoring data
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    monitoring_replicas: 1
    monitoring_claim_names:
      - prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
      - storage-loki-0
  tasks:
    - name: Limit the policy to one replica or the previous three replicas
      ansible.builtin.assert:
        that:
          - monitoring_replicas | int in [1, 3]

    - name: Read the two existing monitoring claims
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: monitoring
        name: "{{ item }}"
        kubeconfig: "{{ kubeconfig_path }}"
      loop: "{{ monitoring_claim_names }}"
      register: monitoring_claims

    - name: Require existing bound Longhorn filesystem claims
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
          - item.resources[0].status.phase == 'Bound'
          - item.resources[0].spec.storageClassName == 'longhorn'
          - item.resources[0].spec.volumeMode | default('Filesystem') == 'Filesystem'
      loop: "{{ monitoring_claims.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read only the bound monitoring volumes
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ item.resources[0].spec.volumeName }}"
        kubeconfig: "{{ kubeconfig_path }}"
      loop: "{{ monitoring_claims.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: monitoring_volumes

    - name: Require healthy attached volumes with the expected claim identity
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
          - item.resources[0].status.state == 'attached'
          - item.resources[0].status.robustness == 'healthy'
          - item.resources[0].status.kubernetesStatus.namespace == 'monitoring'
          - item.resources[0].status.kubernetesStatus.pvcName == item.item.item
          - item.resources[0].spec.numberOfReplicas in [1, 3]
          - item.resources[0].metadata.labels.get('recurring-job-group.longhorn.io/critical') != 'enabled'
      loop: "{{ monitoring_volumes.results }}"
      loop_control:
        label: "{{ item.item.item }}"

    - name: Change only the verified volume's replica count
      kubernetes.core.k8s_json_patch:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ item.resources[0].metadata.name }}"
        kubeconfig: "{{ kubeconfig_path }}"
        patch: >-
          {{ [
            {'op': 'test', 'path': '/metadata/uid', 'value': item.resources[0].metadata.uid},
            {'op': 'test', 'path': '/spec', 'value': item.resources[0].spec},
            {'op': 'replace', 'path': '/spec/numberOfReplicas', 'value': monitoring_replicas | int}
          ] }}
      loop: "{{ monitoring_volumes.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when: item.resources[0].spec.numberOfReplicas != monitoring_replicas | int

    - name: Wait for healthy volumes with the requested replica count
      kubernetes.core.k8s_info:
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ item.resources[0].metadata.name }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: monitoring_result
      until:
        - monitoring_result.resources | length == 1
        - monitoring_result.resources[0].spec.numberOfReplicas == monitoring_replicas | int
        - monitoring_result.resources[0].status.robustness == 'healthy'
      retries: 60
      delay: 5
      loop: "{{ monitoring_volumes.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when: not ansible_check_mode
