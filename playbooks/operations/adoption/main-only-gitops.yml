---
- name: Adopt the main-only application catalog
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    soyspray_repo: https://github.com/kpoxo6op/soyspray.git
  tasks:
    - name: Require the pushed adoption branch and commit
      ansible.builtin.assert:
        that:
          - adoption_revision | default('') | length > 0
          - adoption_revision != 'main'
          - adoption_commit | default('') is match('^[0-9a-f]{40}$')

    - name: Read the root project
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: AppProject
        name: soyspray
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
      register: adoption_project

    - name: Read the root Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: soyspray
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
      register: adoption_root

    - name: Require the fixed safe root
      ansible.builtin.assert:
        that:
          - adoption_project.resources | length == 1
          - >-
            {'group': 'argoproj.io', 'kind': 'ApplicationSet'} in
            adoption_project.resources[0].spec.namespaceResourceWhitelist
          - >-
            {'group': 'argoproj.io', 'kind': 'AppProject'} in
            adoption_project.resources[0].spec.namespaceResourceWhitelist
          - adoption_root.resources | length == 1
          - adoption_root.resources[0].metadata.finalizers | default([]) | length == 0
          - >-
            adoption_root.resources[0].spec.source == main_source or
            adoption_root.resources[0].spec.source == adoption_source
          - adoption_root.resources[0].spec.syncPolicy.automated.prune == false
      vars:
        main_source:
          repoURL: "{{ soyspray_repo }}"
          targetRevision: main
          path: argocd
        adoption_source:
          repoURL: "{{ soyspray_repo }}"
          targetRevision: "{{ adoption_revision }}"
          path: argocd

    - name: Select the pushed catalog with an identity guard
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: soyspray
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ adoption_root.resources[0].metadata.resourceVersion }}"
          - op: replace
            path: /spec/source
            value:
              repoURL: "{{ soyspray_repo }}"
              targetRevision: "{{ adoption_revision }}"
              path: argocd
      when:
        - not ansible_check_mode
        - adoption_root.resources[0].spec.source.targetRevision == 'main'

    - name: Wait for the adopted root commit
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: soyspray
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
      register: adopted_root
      until:
        - adopted_root.resources | length == 1
        - adopted_root.resources[0].status.sync.status | default('') == 'Synced'
        - adopted_root.resources[0].status.health.status | default('') == 'Healthy'
        - adopted_root.resources[0].status.sync.revision | default('') == adoption_commit
        - adopted_root.resources[0].status.sync.comparedTo.source.targetRevision == adoption_revision
      retries: 60
      delay: 5
      when: not ansible_check_mode

    - name: Read the adopted Applications
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
        label_selectors:
          - soyspray.vip/owner
      register: adopted_apps
      when: not ansible_check_mode

    - name: Require the complete adopted Application set
      ansible.builtin.assert:
        that:
          - adopted_apps.resources | length == 33
      when: not ansible_check_mode

    - name: Disable cascading deletion on adopted Applications
      kubernetes.core.k8s_json_patch:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ item.metadata.name }}"
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
        patch:
          - op: test
            path: /metadata/resourceVersion
            value: "{{ item.metadata.resourceVersion }}"
          - op: replace
            path: /metadata/finalizers
            value: []
      loop: "{{ adopted_apps.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - not ansible_check_mode
        - item.metadata.name != 'soyspray'
        - item.metadata.finalizers | default([]) | length > 0

    - name: Read the protected Applications
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        kubeconfig: "{{ kubeconfig_path }}"
        label_selectors:
          - soyspray.vip/owner
      register: protected_apps
      when: not ansible_check_mode

    - name: Confirm cascading deletion is disabled
      ansible.builtin.assert:
        that:
          - >-
            protected_apps.resources |
            rejectattr('metadata.name', 'equalto', 'soyspray') |
            selectattr('metadata.finalizers', 'defined') |
            map(attribute='metadata.finalizers') |
            flatten |
            length == 0
      when: not ansible_check_mode
