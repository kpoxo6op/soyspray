---
- name: Install deterministic laptop backup observations
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    evidence_repo: "{{ operations_checkout | default((playbook_dir + '/../../..') | realpath) }}"
    evidence_python: "{{ evidence_repo }}/soyspray-venv/bin/python"
    evidence_unit_dir: "{{ lookup('env', 'HOME') }}/.config/systemd/user"
    evidence_bind: "{{ operations_evidence_bind | default('192.168.20.50') }}"
    evidence_subnet: "{{ operations_evidence_subnet | default('192.168.20.0/24') }}"
  tasks:
    - name: Require the maintained collector and Python runtime
      ansible.builtin.assert:
        that:
          - (evidence_repo + '/scripts/operations_evidence.py') is file
          - evidence_python is file
    - name: Create the user unit directory
      ansible.builtin.file:
        path: "{{ evidence_unit_dir }}"
        state: directory
        mode: '0700'
    - name: Install the observation service and timer
      ansible.builtin.template:
        src: "systemd/soyspray-operations-evidence.{{ item }}.j2"
        dest: "{{ evidence_unit_dir }}/soyspray-operations-evidence.{{ item }}"
        mode: '0644'
      loop: [service, timer]
    - name: Validate the observation units
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - --user
          - verify
          - "{{ evidence_unit_dir }}/soyspray-operations-evidence.service"
          - "{{ evidence_unit_dir }}/soyspray-operations-evidence.timer"
      changed_when: false
      when: not ansible_check_mode
    - name: Enable the deterministic observation timer
      ansible.builtin.systemd_service:
        name: soyspray-operations-evidence.timer
        scope: user
        daemon_reload: true
        enabled: "{{ evidence_enabled | default(true) | bool }}"
        state: "{{ 'started' if evidence_enabled | default(true) | bool else 'stopped' }}"

    - name: Read the installed runtime revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ evidence_repo }}"
      register: evidence_revision_command
      changed_when: false
      check_mode: false

    # The revision marker in the unit file must be the revision itself. A
    # registered result would put the whole result, timestamps included, into
    # the unit, which changed the file on every run and restarted the service
    # even when the checkout had not moved.
    - name: Select the installed runtime revision
      ansible.builtin.set_fact:
        evidence_revision: "{{ evidence_revision_command.stdout | trim }}"

    - name: Install the saved evidence endpoint
      ansible.builtin.template:
        src: "systemd/soyspray-evidence-metrics.service.j2"
        dest: "{{ evidence_unit_dir }}/soyspray-evidence-metrics.service"
        mode: '0644'
      register: evidence_metrics_unit

    - name: Validate the saved evidence endpoint
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - --user
          - verify
          - "{{ evidence_unit_dir }}/soyspray-evidence-metrics.service"
      changed_when: false
      when: not ansible_check_mode

    - name: Enable the saved evidence endpoint
      ansible.builtin.systemd_service:
        name: soyspray-evidence-metrics.service
        scope: user
        daemon_reload: "{{ evidence_metrics_unit.changed }}"
        enabled: true
        state: "{{ 'restarted' if evidence_metrics_unit.changed else 'started' }}"

    - name: Install the route for numeric endpoint replies only
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/soyspray-evidence-route.service
        mode: '0644'
        content: |
          [Unit]
          Description=Keep Soyspray metrics replies on the local network
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/ip rule add priority 5191 from {{ evidence_bind }}/32 to {{ evidence_subnet }} ipproto tcp sport 9910 lookup main
          ExecStop=/usr/sbin/ip rule del priority 5191 from {{ evidence_bind }}/32 to {{ evidence_subnet }} ipproto tcp sport 9910 lookup main
          [Install]
          WantedBy=multi-user.target
      register: evidence_route_unit

    - name: Enable the numeric endpoint reply route
      become: true
      ansible.builtin.systemd_service:
        name: soyspray-evidence-route.service
        daemon_reload: "{{ evidence_route_unit.changed }}"
        enabled: true
        state: "{{ 'restarted' if evidence_route_unit.changed else 'started' }}"
